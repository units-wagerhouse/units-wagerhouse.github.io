function parseSpreadLabel(label) {
  if (label === undefined || label === null) return null;
  if (label === 'PK') return 0;
  const n = parseFloat(label);
  return isNaN(n) ? null : n;
}
function settlePick(p) {
  if (p.settledResult) return p.settledResult;
  if (p.propType === 'player') return { status: 'pending' }; // resolved by persistNewlySettledPlayerProps
  if (p.propType === 'golf_h2h') return { status: 'pending' }; // resolved by persistNewlySettledGolfH2H
  if (p.propType === 'combo_pool') return { status: 'pending' }; // resolved by persistNewlySettledComboPool
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };

  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else outcome = p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss');
  } else {
    const spreadVal = parseSpreadLabel(p.spreadLabel);
    if (spreadVal !== null) {
      const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
      const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
      const margin = (teamScore - oppScore) + spreadVal;
      outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
    } else {
      const winnerAbbr = homeScore > awayScore ? g.home : (awayScore > homeScore ? g.away : null);
      outcome = winnerAbbr === null ? 'push' : (winnerAbbr === p.sideAbbr ? 'win' : 'loss');
    }
  }
  if (outcome === 'push') return { status: 'push' };
  return { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
}
function computePoolPayouts(pool) {
  const participants = pool.participants || [];
  if (!participants.length) return [];
  const scored = participants.map(p => ({ name: p.name, ...poolParticipantScore(pool, p) }));
  if (scored.some(s => !s.allSettled)) return null; // not everyone's games are final yet
  const purse = pool.buyInDollars * participants.length;
  const perSlot = purse / pool.paidPositions;
  scored.sort((a,b) => b.total - a.total);
  const payouts = [];
  let slotIndex = 0, i = 0;
  while (i < scored.length && slotIndex < pool.paidPositions) {
    let j = i;
    while (j < scored.length && scored[j].total === scored[i].total) j++;
    const tierSize = j - i;
    const tierStartSlot = slotIndex;
    const tierEndSlot = Math.min(slotIndex + tierSize, pool.paidPositions) - 1;
    if (tierEndSlot >= tierStartSlot) {
      const slotsCovered = tierEndSlot - tierStartSlot + 1;
      const perPerson = (slotsCovered * perSlot) / tierSize;
      for (let k = i; k < j; k++) payouts.push({ name: scored[k].name, amount: perPerson });
    }
    slotIndex += tierSize;
    i = j;
  }
  return payouts;
}
async function ensurePoolPlayerPropBoxScores() {
  const pools = allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'combo_pool' && p.status === 'open' && (p.participants || []).length > 0);
  const pairs = new Set();
  pools.forEach(pool => {
    pool.legs.forEach(leg => {
      if (leg.betType !== 'playerprop') return;
      const idx = gameIndex[leg.gameId];
      const gameFinal = idx && idx.game && idx.game.status !== 'scheduled' && idx.game.status !== 'inprogress';
      if (gameFinal && boxScoreCache[leg.gameId] === undefined) pairs.add(leg.sport + '|' + leg.gameId);

  for (const pair of pairs) {
    const [sport, gameId] = pair.split('|');
    try { await fetchPlayerBoxScore(sport, gameId); } catch (e) { /* leave uncached, will retry next cycle */ }
  }
}
async function persistNewlySettledComboPool() {
  let changed = false;

// ---------- Player props: box score fetch + async settlement ----------
// NOTE: built from ESPN's commonly-documented summary?event= box score shape (boxscore.players[].statistics[].athletes[]),
// but not verified against a live response in this session — test after deploying and report back if stats don't match.
const PLAYER_PROP_CATEGORIES = [
  { id: 'passingYards', label: 'Passing Yards', sport: 'nfl' },
  { id: 'rushingYards', label: 'Rushing Yards', sport: 'nfl' },
  { id: 'receptions', label: 'Receptions', sport: 'nfl' },
  { id: 'receivingYards', label: 'Receiving Yards', sport: 'nfl' },
  { id: 'touchdowns', label: 'Touchdowns (Any)', sport: 'nfl' },
  { id: 'pitcherStrikeouts', label: 'Pitcher Strikeouts', sport: 'mlb' },
  { id: 'hitterHomeRuns', label: 'Home Runs', sport: 'mlb' },
  { id: 'hitterHits', label: 'Hits', sport: 'mlb' },
];
const PROP_RELEVANT_POSITIONS = new Set(['QB','RB','WR','TE','FB']);
const PROP_RELEVANT_POSITIONS_MLB = new Set(['SP','RP','P','C','1B','2B','3B','SS','OF','DH','LF','CF','RF']);
let teamRosterCache = {}; // 'sport:teamAbbr'(lowercase) -> [{id, name, position}] | null
async function fetchTeamRoster(teamAbbr, sport) {
  sport = sport || 'nfl';
  const key = sport + ':' + (teamAbbr || '').toLowerCase();
  if (teamRosterCache[key] !== undefined) return teamRosterCache[key];
  const espnSport = sport === 'mlb' ? 'baseball' : 'football';
  const espnLeague = sport === 'mlb' ? 'mlb' : 'nfl';
  const posSet = sport === 'mlb' ? PROP_RELEVANT_POSITIONS_MLB : PROP_RELEVANT_POSITIONS;
  try {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${espnSport}/${espnLeague}/teams/${(teamAbbr||'').toLowerCase()}/roster`);
    if (!res.ok) { teamRosterCache[key] = null; return null; }
    const json = await res.json();
    const groups = json.athletes || [];
    const players = [];
    groups.forEach(grp => {
      (grp.items || []).forEach(a => {
        const pos = (a.position && (a.position.abbreviation || a.position.name)) || '';
        if (!posSet.has(pos)) return;
        players.push({ id: a.id, name: a.displayName || a.fullName, position: pos });
      });
    });
    teamRosterCache[key] = players;
    return players;
  } catch (e) { teamRosterCache[key] = null; return null; }
}
let boxScoreCache = {}; // gameId -> {normalizedName: {displayName, passingYards, rushingYards, receptions, receivingYards, passingTouchdowns, rushingTouchdowns, receivingTouchdowns, strikeouts, homeRuns, hits}} | null
async function fetchPlayerBoxScore(sport, gameId) {
  if (boxScoreCache[gameId] !== undefined) return boxScoreCache[gameId];
  const paths = ESPN_PATHS[sport];
  if (!paths) { boxScoreCache[gameId] = null; return null; }
  try {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${paths.sport}/${paths.league}/summary?event=${gameId}`);
    if (!res.ok) { boxScoreCache[gameId] = null; return null; }
    const json = await res.json();
    const players = {};
    const teamsArr = (json.boxscore && json.boxscore.players) || [];
    teamsArr.forEach(teamBlock => {
      (teamBlock.statistics || []).forEach(cat => {
        const keys = cat.keys || cat.labels || [];
        (cat.athletes || []).forEach(a => {
          const name = a.athlete && a.athlete.displayName;
          if (!name) return;
          const norm = name.toLowerCase().trim();
          if (!players[norm]) players[norm] = { displayName: name, passingYards: null, rushingYards: null, receptions: null, receivingYards: null, passingTouchdowns: null, rushingTouchdowns: null, receivingTouchdowns: null, strikeouts: null, homeRuns: null, hits: null };
          const statVals = a.stats || [];
          keys.forEach((k, i) => {
            const kl = (k || '').toLowerCase().replace(/[^a-z]/g, '');
            const raw = statVals[i];
            const v = parseFloat(raw);
            if (raw === undefined || isNaN(v)) return;
            if (kl.includes('passingyards')) players[norm].passingYards = v;
            else if (kl.includes('rushingyards')) players[norm].rushingYards = v;
            else if (kl === 'receptions') players[norm].receptions = v;
            else if (kl.includes('receivingyards')) players[norm].receivingYards = v;
            else if (kl.includes('passingtouchdowns')) players[norm].passingTouchdowns = v;
            else if (kl.includes('rushingtouchdowns')) players[norm].rushingTouchdowns = v;
            else if (kl.includes('receivingtouchdowns')) players[norm].receivingTouchdowns = v;
            else if (kl === 'strikeouts' || kl === 'k') players[norm].strikeouts = v;
            else if (kl.includes('homerun')) players[norm].homeRuns = v;
            else if (kl === 'hits' || kl === 'h') players[norm].hits = v;
          });
        });
      });
    });
    boxScoreCache[gameId] = players;
    return players;
  } catch (e) { boxScoreCache[gameId] = null; return null; }
}
function statValueFor(playerStats, category) {
  if (!playerStats) return null;
  if (category === 'touchdowns') {
    const parts = [playerStats.passingTouchdowns, playerStats.rushingTouchdowns, playerStats.receivingTouchdowns];
    if (parts.every(x => x === null)) return null;
    return parts.reduce((s,x) => s + (x || 0), 0);
  }
  if (category === 'pitcherStrikeouts') return playerStats.strikeouts;
  if (category === 'hitterHomeRuns') return playerStats.homeRuns;
  if (category === 'hitterHits') return playerStats.hits;
  return playerStats[category];
}
function findPlayerInBoxScore(box, typedName) {
  const norm = typedName.toLowerCase().trim();
  if (box[norm]) return box[norm];
  const match = Object.values(box).find(x => x.displayName.toLowerCase() === norm);
  if (match) return match;
  return Object.values(box).find(x => x.displayName.toLowerCase().includes(norm) || norm.includes(x.displayName.toLowerCase()));
}
async function persistNewlySettledPlayerProps() {
  let changed = false;
  const toCheck = allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'player' && !p.settledResult && (p.status === 'open' || p.status === 'accepted'));
  for (const p of toCheck) {
    const idx = gameIndex[p.gameId];
    if (!idx || (idx.game.status !== 'closed' && idx.game.status !== 'complete')) continue;
    const box = await fetchPlayerBoxScore(p.sport, p.gameId);
    if (!box) continue; // fetch failed, retry next cycle
    const stats = findPlayerInBoxScore(box, p.playerName);
    if (!stats) { if (!p.playerNotFound) { p.playerNotFound = true; changed = true; } continue; }
    const val = statValueFor(stats, p.statCategory);
    if (val === null) { if (!p.playerNotFound) { p.playerNotFound = true; changed = true; } continue; }
    const diff = val - p.line;
    const outcome = diff === 0 ? 'push' : (p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss'));
    p.settledResult = outcome === 'push' ? { status: 'push' } : { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
    p.actualStatValue = val;
    changed = true;
  }
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* best-effort; retry next cycle */ } }
  return changed;
}

async function persistNewlySettledGolfH2H() {
  let changed = false;
  const toCheck = allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'golf_h2h' && !p.settledResult && (p.status === 'open' || p.status === 'accepted'));
  if (!toCheck.length) return false;
  const field = await fetchGolfField(false);
  if (!field || !field.completed) return false; // only settle once the tournament itself is final
  for (const p of toCheck) {
    const a = findGolferByName(field, p.playerA);
    const b = findGolferByName(field, p.playerB);
    if (!a || !b) { if (!p.playerNotFound) { p.playerNotFound = true; changed = true; } continue; }
    const round = p.round || 'total';
    let aScore, bScore, cutRuleApplied = false, winnerName = null;

    if ((round === 'r3' || round === 'r4' || round === 'total') && a.missedCut !== b.missedCut) {
      // One player made the cut, the other didn't — whoever made the cut automatically wins this bet.
      winnerName = a.missedCut ? p.playerB : p.playerA;
      cutRuleApplied = true;
    } else if (round === 'r1') { aScore = a.roundScores[0]; bScore = b.roundScores[0]; }
    else if (round === 'r2') { aScore = a.roundScores[1]; bScore = b.roundScores[1]; }
    else if (round === 'r3') { aScore = a.roundScores[2]; bScore = b.roundScores[2]; }
    else if (round === 'r4') { aScore = a.roundScores[3]; bScore = b.roundScores[3]; }
    else { aScore = a.score; bScore = b.score; }

    if (!cutRuleApplied) {
      if (aScore === null || aScore === undefined || bScore === null || bScore === undefined) {
        if (!p.playerNotFound) { p.playerNotFound = true; changed = true; }
        continue;
      }
      if (aScore === bScore) { p.settledResult = { status: 'push' }; changed = true; continue; }
      winnerName = aScore < bScore ? p.playerA : p.playerB; // lower score wins
    }

    const outcome = winnerName === p.sideAbbr ? 'win' : 'loss';
    p.settledResult = { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
    p.finalScores = { [p.playerA]: aScore !== undefined ? aScore : a.score, [p.playerB]: bScore !== undefined ? bScore : b.score };
    changed = true;
  }
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* best-effort; retry next cycle */ } }
  return changed;
}

  rows.forEach((r, i) => {
    const y = 6 + i * rowH;
    const barW = (Math.abs(r.net) / maxAbs) * halfTrack;
    const x = r.net >= 0 ? mid : mid - barW;
    const color = r.net > 0 ? 'var(--accent)' : (r.net < 0 ? 'var(--danger)' : 'var(--text-faint)');
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="14" rx="2" style="fill:${color}"/>`;
    bars += `<text x="6" y="${y + 11}" font-size="10.5" style="fill:var(--text-dim)" font-family="var(--font-head)" font-weight="700">${r.label}</text>`;
    bars += `<text x="${w - 6}" y="${y + 11}" font-size="10.5" text-anchor="end" style="fill:var(--text)" font-family="var(--font-mono)">${fmtUnits(r.net)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${mid}" y1="0" x2="${mid}" y2="${h}" style="stroke:var(--border)"/>
    ${bars}
  </svg>`;
}

// ---------- badges ----------
const BADGES = [
  { id: 'first_win', icon: '🏆', label: 'First Blood', desc: 'Win your first bet',
    check: (settled) => settled.some(x => x.r.status === 'win') },
  { id: 'perfect_week', icon: '💯', label: 'Perfect Week', desc: 'Go undefeated in a week (2+ bets)',
    check: (settled) => {
      const byWeek = {};
      settled.forEach(x => { const wk = weekKey(x.start); (byWeek[wk] = byWeek[wk] || []).push(x); });
      return Object.values(byWeek).some(list => list.length >= 2 && list.every(x => x.r.status === 'win'));
    } },
  { id: 'hot_streak', icon: '🔥', label: 'Hot Streak', desc: 'Win 3 bets in a row',
    check: (settled) => {
      let streak = 0, best = 0;
      settled.forEach(x => { if (x.r.status === 'win') { streak++; best = Math.max(best, streak); } else streak = 0; });
      return best >= 3;
    } },
  { id: 'iron_stomach', icon: '💪', label: 'Iron Stomach', desc: 'Risk 5+ units on a single bet',
    check: (settled, mine) => mine.some(p => p.units >= 5) },
  { id: 'diversifier', icon: '🎲', label: 'Diversifier', desc: 'Bet on 3+ leagues in the same week',
    check: (settled, mine) => {
      const byWeek = {};
      mine.forEach(p => { (byWeek[p.week] = byWeek[p.week] || new Set()).add(p.sport); });
      return Object.values(byWeek).some(s => s.size >= 3);
    } },
  { id: 'big_week', icon: '📈', label: 'Big Week', desc: 'Net +5 units in a single week',
    check: (settled) => {
      const byWeek = {};
      settled.forEach(x => { const wk = weekKey(x.start); byWeek[wk] = (byWeek[wk] || 0) + x.r.profit; });
      return Object.values(byWeek).some(v => v >= 5);
    } },
  { id: 'century', icon: '💰', label: 'Century Club', desc: 'Reach +10 net units lifetime',
    check: (settled) => settled.reduce((s, x) => s + x.r.profit, 0) >= 10 },
  { id: 'grinder', icon: '⛏️', label: 'Grinder', desc: 'Place 25 total bets',
    check: (settled, mine) => mine.length >= 25 },
];
function renderBadges(settled, mine) {
  const grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:8px;';
  BADGES.forEach(b => {
    const earned = b.check(settled, mine);
    const tile = el('div');
    tile.style.cssText = `background:${earned ? 'var(--accent-dark)' : 'var(--surface)'};border:1px solid ${earned ? 'var(--accent)' : 'var(--border)'};border-radius:10px;padding:12px 10px;text-align:center;${earned ? '' : 'opacity:0.5;'}`;
    tile.innerHTML = `<div style="font-size:26px;line-height:1;">${b.icon}</div><div style="font-size:12px;font-weight:800;margin-top:6px;color:${earned ? 'var(--accent)' : 'var(--text-dim)'};">${b.label}</div><div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">${b.desc}</div>`;
    grid.appendChild(tile);
  });
  return grid;
}

function renderStats() {
  const wrap = el('div');
  const entries = settledPicksSorted(profile.name);
  const mine = poolOnly(allPicks.filter(p => p.player === profile.name));

  wrap.appendChild(el('div', 'week-header', 'Badges'));
  wrap.appendChild(renderBadges(entries, mine));

  if (!entries.length) {
    wrap.appendChild(el('div', 'empty', 'No settled bets yet — stats will fill in once games finish.'));
    return wrap;
  }

  const overall = recordFor(entries);
  const overallBanner = el('div', 'rank-banner');
  const oc1 = el('div', 'rank-cell');
  oc1.appendChild(el('div', 'rc-label', 'Record'));
  oc1.appendChild(el('div', 'rc-value', `${overall.w}-${overall.l}`));
  oc1.appendChild(el('div', 'rc-sub', overall.winPct.toFixed(1) + '% win rate'));
  overallBanner.appendChild(oc1);
  const oc2 = el('div', 'rank-cell');
  oc2.appendChild(el('div', 'rc-label', 'Net units'));
  oc2.appendChild(el('div', 'rc-value ' + (overall.net > 0 ? 'accent' : ''), fmtUnits(overall.net)));
  oc2.appendChild(el('div', 'rc-sub', overall.total + ' settled bets'));
  overallBanner.appendChild(oc2);
  wrap.appendChild(overallBanner);

  wrap.appendChild(el('div', 'week-header', 'Win % over time'));
  const trendCard = el('div', 'event-card');
  trendCard.innerHTML = winPctTrendSVG(entries);
  wrap.appendChild(trendCard);

  wrap.appendChild(el('div', 'week-header', 'Rolling record'));
  const rollWrap = el('div', 'rank-banner');
  [10, 20, 50].forEach(n => {
    const recentWindow = entries.slice(-n);
    const rec = recordFor(recentWindow);
    const cell = el('div', 'rank-cell');
    cell.appendChild(el('div', 'rc-label', 'Last ' + n));
    cell.appendChild(el('div', 'rc-value', recentWindow.length ? rec.winPct.toFixed(0) + '%' : '—'));
    cell.appendChild(el('div', 'rc-sub', recentWindow.length ? `${rec.w}-${rec.l} · ${fmtUnits(rec.net)}` : 'not enough yet'));
    rollWrap.appendChild(cell);
  });
  wrap.appendChild(rollWrap);

  wrap.appendChild(el('div', 'week-header', 'By league'));
  const byLeague = {};
  entries.forEach(x => { (byLeague[x.p.sport] = byLeague[x.p.sport] || []).push(x); });
  const leagueRows = Object.keys(byLeague).map(sport => {
    const rec = recordFor(byLeague[sport]);
    const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
    return { label, w: rec.w, l: rec.l, winPct: rec.winPct, net: rec.net };
  }).sort((a, b) => b.net - a.net);

  const table = el('table', 'stats-table');
  table.innerHTML = `<thead><tr><th>League</th><th>Record</th><th>Win%</th><th>Net</th></tr></thead>`;
  const tbody = el('tbody');
  leagueRows.forEach(r => {
    const tr = el('tr');
    tr.innerHTML = `<td>${r.label}</td><td>${r.w}-${r.l}</td><td>${r.winPct.toFixed(0)}%</td><td class="${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : ''}">${fmtUnits(r.net)}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.appendChild(el('div', 'week-header', 'Net units by league'));
  const barsCard = el('div', 'event-card');
  barsCard.innerHTML = leagueBarsSVG(leagueRows.map(r => ({ label: r.label, net: r.net })));
  wrap.appendChild(barsCard);

  return wrap;
}

function filteredSettledFor(name, dateMode, leagueId) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), date: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .filter(x => inDateRange(x.date, dateMode))
    .filter(x => leagueId === null || x.p.sport === leagueId);
}

function renderLeaderboard() {
  const wrap = el('div');
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);

  // date range chips
  const dateScroller = el('div', 'league-scroller');
  [['day','Today'], ['week','This week'], ['year','This year'], ['all','All-time']].forEach(([mode,label]) => {
    const pill = el('button', 'league-pill' + (lbDateMode === mode ? ' active' : ''), label);
    pill.onclick = () => { lbDateMode = mode; render(); };
    dateScroller.appendChild(pill);
  });
  wrap.appendChild(dateScroller);

  // league filter chips
  const leaguesPresent = [...new Set(poolOnly(allPicks).map(p => p.sport))];
  if (leaguesPresent.length) {
    const leagueScroller = el('div', 'league-scroller');
    const allPill = el('button', 'league-pill' + (lbLeagueFilter === null ? ' active' : ''), 'All leagues');
    allPill.onclick = () => { lbLeagueFilter = null; render(); };
    leagueScroller.appendChild(allPill);
    leaguesPresent.forEach(sport => {
      const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
      const pill = el('button', 'league-pill' + (lbLeagueFilter === sport ? ' active' : ''), label);
      pill.onclick = () => { lbLeagueFilter = sport; render(); };
      leagueScroller.appendChild(pill);
    });
    wrap.appendChild(leagueScroller);
  }

  const ranked = names.map(name => {
    const entries = filteredSettledFor(name, lbDateMode, lbLeagueFilter);
    const rec = recordFor(entries);
    return { name, profit: rec.net, rec };
  }).sort((a,b) => b.profit - a.profit);

  if (!ranked.length || ranked.every(r => r.rec.total === 0)) {
    wrap.appendChild(el('div', 'empty', 'No settled bets in this range yet.'));
    wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount.'));
    return wrap;
  }
  ranked.forEach((r, i) => {
    const row = el('div', 'lb-row' + (profile && r.name === profile.name ? ' me' : ''));
    row.appendChild(el('div', 'lb-rank' + (i === 0 && r.profit > 0 ? ' first' : ''), (i+1).toString()));
    const nameWrap = el('div', 'lb-name', r.name);
    row.appendChild(nameWrap);
    row.appendChild(el('div', 'lb-record', `${r.rec.w}-${r.rec.l}`));
    row.appendChild(el('div', 'lb-profit ' + (r.profit > 0 ? 'pos' : r.profit < 0 ? 'neg' : ''), fmtUnits(r.profit)));
    wrap.appendChild(row);
  });
  wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount. Scores are checked live from ESPN, so standings update automatically as games finish.'));
  return wrap;
}

(async function init() {
  loadProfile();
  loadSession();
  appSection = 'pools';
  activeTab = 'existing';
  existingChallengeView = 'friends';
  challengeBrowseMode = 'swipe';
  openChallengeLeague = null;
  openChallengeTypeFilter = 'all';
  openChallengeDateFilter = 'today';
  swipeStackInitialized = false;

  if (profile && session) {
    const ok = await ensureFreshSession().catch(() => false);
    if (!ok) { profile = null; clearSession(); }
  } else if (profile && !session) {
    profile = null; // stale profile cache with no real session behind it (from before real auth existed)
  }

  if (profile) {
    try {
      const g = await loadGlobalData();
      players = g.players; allPicks = g.picks; dailySlateData = g.dailySlate;
    } catch (e) {
      setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
    }
  }
  render();

  if (profile) {
    (async () => {
      try {
        await migrateLegacyWeeklyPicks();
        await cleanupStaleHouseBets();
        await cleanupAcceptedChallengesOnce();
        await cleanupAllOpenAndAcceptedChallengesOnce();
        await cleanupHouseChallengesOnce();
        await resetMyAccountOnce();
        if (!players.includes(profile.name)) { players.push(profile.name); await savePlayers(players); }
        await refreshGameLists();

        startPolling();
        startLiveScoreChecks();
        render();
      } catch (e) {
        setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
        render();
      }
    })();
  }
  render();
})();
</script>
