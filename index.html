<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNITS</title>
<style>
  :root {
    --bg: #0B0B0B; --surface: #171514; --surface-2: #201C1A; --border: #332D29;
    --text: #F6EBD7; --text-dim: #B8A99A; --text-faint: #7A6D62;
    --accent: #FF7A3D; --accent-dark: #3D2011; --accent-text: #1F0E05;
    --danger: #EF3B3B; --danger-dark: #3A1414;
    --gold: #FFC629;
    --font-head: 'Helvetica Neue', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-head); -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; overflow-x: hidden; width: 100%; }
  html.no-scroll { overflow: hidden; }
  body.no-scroll { overflow: hidden; position: fixed; top: 0; left: 0; right: 0; height: 100%; width: 100%; }
  #app { min-height: 100vh; padding-bottom: 50px; }
  input, button { font-family: var(--font-head); }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 16px 16px 0; border-bottom: 1px solid var(--border); }
  header.top .row1 { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  header.top h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; text-transform: uppercase; color: var(--text); }
  header.top h1 span { background: linear-gradient(135deg, #FFC629, #EF3B3B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  header.top .who { font-size: 12px; color: var(--text-dim); }
  .menu-btn { background: none; border: none; color: var(--text); font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; height: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .friends-btn { background: none; border: none; padding: 4px 6px; cursor: pointer; height: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; position: relative; }
  .balance-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 10px; cursor: pointer; color: var(--accent); font-weight: 800; font-size: 12px; font-family: var(--font-mono); height: 26px; display: flex; align-items: center; }
  .menu-dropdown { position: absolute; top: 44px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; z-index: 30; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .menu-dropdown .menu-item { padding: 12px 16px; font-size: 13.5px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; }
  .menu-dropdown .menu-item:last-child { border-bottom: none; }
  .menu-dropdown .menu-item.danger { color: var(--danger); }
  .menu-dropdown .menu-item .sub { display: block; font-size: 11px; color: var(--text-faint); font-weight: 500; margin-top: 2px; }
  .swipe-card-big { display: flex; flex-direction: column; justify-content: center; overflow-y: auto; overflow-x: hidden; max-width: 100%; width: 100%; flex: 1; min-height: 0; box-sizing: border-box; }
  .swipe-team-logo { width: 56px; height: 56px; object-fit: contain; }
  .swipe-fixed-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 25; box-sizing: border-box; }
  .swipe-bar-spacer { height: 76px; }

  .tabbar { display: flex; gap: 4px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 700; color: var(--text-faint); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.02em; }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  .league-scroller { display: flex; gap: 5px; overflow-x: auto; padding: 3px 0; scrollbar-width: none; }
  .league-scroller::-webkit-scrollbar { display: none; }
  .league-pill { flex: 0 0 auto; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); font-size: 11px; font-weight: 700; white-space: nowrap; text-transform: uppercase; }
  .league-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .league-pill.offered { border-color: #4CAF50; color: #4CAF50; }
  .league-pill.offered.active { background: #4CAF50; border-color: #4CAF50; color: #0a1f0c; }
  .league-pill.offered.outline-only.active { background: var(--accent); border-color: #4CAF50; color: var(--accent-text); }
  .league-pill.off { opacity: 0.5; }

  main { padding: 4px 16px 8px; }

  .offseason-card { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .offseason-card .big { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .offseason-card .small { font-size: 12.5px; }

  .event-card { background: var(--surface); border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid var(--border); box-sizing: border-box; max-width: 100%; }
  .event-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .event-meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.03em; }
  .event-meta.live { color: var(--danger); font-weight: 700; }

  .team-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  .team-name { font-size: 14.5px; font-weight: 700; }
  .team-score { font-family: var(--font-mono); font-size: 15px; font-weight: 700; min-width: 24px; text-align: right; }
  .team-row.winner .team-name { color: var(--accent); }
  .team-row.loser .team-name { color: var(--text-dim); }

  .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .outcome-btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 6px; text-align: center; color: var(--text); }
  .outcome-btn .oc-team { font-size: 11.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
  .outcome-btn .oc-line { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
  .outcome-btn .oc-odds { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .outcome-btn.selected { background: var(--accent); border-color: var(--accent); }
  .outcome-btn.selected .oc-team, .outcome-btn.selected .oc-line, .outcome-btn.selected .oc-odds { color: var(--accent-text); }
  .outcome-btn.disabled { opacity: 0.45; }

  .bet-slip { margin-top: 10px; background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .bs-row { display: flex; align-items: center; gap: 8px; }
  .bs-row label { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  .bs-row input { width: 58px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 8px; font-family: var(--font-mono); font-size: 14px; }
  .bs-row .to-win { flex: 1; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  .bs-row .to-win .lbl { color: var(--text-faint); font-family: var(--font-head); font-size: 10.5px; display: block; text-transform: uppercase; }
  .lock-btn { width: 100%; margin-top: 9px; background: var(--accent); border: none; color: var(--accent-text); border-radius: 6px; padding: 10px; font-size: 13.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .lock-btn:disabled { opacity: 0.35; }
  .pick-error { color: var(--danger); font-size: 11px; margin-top: 6px; }

  .locked-note { margin-top: 10px; background: var(--accent-dark); border: 1px solid var(--accent); border-radius: 8px; padding: 10px; font-size: 12.5px; color: var(--accent); }
  .locked-note .ln-title { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.03em; margin-bottom: 3px; color: var(--text-dim); }
  .locked-note b { font-family: var(--font-mono); }
  .no-odds-note { margin-top: 8px; font-size: 11.5px; color: var(--text-faint); font-style: italic; }

  .setup-card { background: var(--surface); border-radius: 10px; padding: 16px; margin-top: 8px; border: 1px solid var(--border); }
  .setup-card label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; margin-top: 12px; }
  .setup-card label:first-child { margin-top: 0; }
  .setup-card input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 9px 10px; font-size: 14px; }
  .setup-card .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .setup-card button { flex: 1; padding: 10px; border-radius: 6px; font-size: 13.5px; font-weight: 800; border: none; background: var(--accent); color: var(--accent-text); text-transform: uppercase; }
  .setup-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }

  .rank-banner { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .rank-cell { flex: 1; padding: 12px; text-align: center; }
  .rank-cell + .rank-cell { border-left: 1px solid var(--border); }
  .rank-cell .rc-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .rank-cell .rc-value { font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--text); }
  .rank-cell .rc-value.accent { color: var(--accent); }
  .rank-cell .rc-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .pick-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface); border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }
  .pick-row .who { font-size: 13.5px; font-weight: 700; }
  .pick-row .who .pick-league { display: inline-block; background: var(--surface-2); color: var(--accent); font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.02em; vertical-align: middle; }
  .pick-row .detail { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; font-family: var(--font-mono); }
  .pick-row .result { font-family: var(--font-mono); font-size: 15px; font-weight: 800; text-align: right; white-space: nowrap; }
  .pick-row .result .sub { display: block; font-size: 9.5px; color: var(--text-faint); font-weight: 500; text-transform: uppercase; font-family: var(--font-head); }
  .result.win { color: var(--accent); }
  .result.loss { color: var(--danger); }
  .result.pending { color: var(--gold); }
  .result.profit-pos { color: #4CAF50; }
  .result.profit-neg { color: var(--danger); }

  .week-header { font-size: 12.5px; font-weight: 800; color: var(--text-dim); margin: 18px 0 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .week-header:first-child { margin-top: 8px; }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--border); background: var(--surface); margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); }
  .lb-row.me { border-color: var(--accent); }
  .lb-rank { font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); width: 20px; }
  .lb-rank.first { color: var(--gold); font-weight: 800; }
  .lb-name { flex: 1; font-size: 14.5px; font-weight: 700; }
  .lb-record { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .lb-profit { font-family: var(--font-mono); font-size: 16px; font-weight: 800; min-width: 60px; text-align: right; }
  .lb-profit.pos { color: var(--accent); }
  .lb-profit.neg { color: var(--danger); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-faint); font-size: 14px; }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stats-table th { text-align: left; font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .stats-table td { padding: 9px 10px; font-size: 13px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); color: var(--text); }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table td.pos { color: var(--accent); }
  .stats-table td.neg { color: var(--danger); }
  .refresh-note { margin: 16px 0 0; padding: 11px 13px; background: var(--surface); border-radius: 8px; font-size: 11px; color: var(--text-faint); line-height: 1.5; border-left: 2px solid var(--accent-dark); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
</style>
</head>

    <div class="row1">
      <div class="brand">

const LEAGUES_META = [
  { id: 'nfl', label: 'NFL', active: true, spreadSport: true },
  { id: 'mlb', label: 'MLB', active: true, spreadSport: false },
  { id: 'ncaaf', label: 'NCAAF', active: true, spreadSport: true },
  { id: 'wnba', label: 'WNBA', active: true, spreadSport: true },
  { id: 'atp', label: "Men's Tennis", active: true, spreadSport: false, moneylineOnly: true },
  { id: 'wta', label: "Women's Tennis", active: true, spreadSport: false, moneylineOnly: true },

];

let DATA = { nfl: [], mlb: [], ncaaf: [], wnba: [], atp: [], wta: [] };
const gameIndex = {};
function rebuildGameIndex() {
  Object.keys(gameIndex).forEach(k => delete gameIndex[k]);
  Object.keys(DATA).forEach(sport => (DATA[sport] || []).forEach(g => gameIndex[g.id] = { sport, game: g }));
}

// ---------- live game list + scores (ESPN public scoreboard) ----------
const ESPN_PATHS = {
  nfl: { sport: 'football', league: 'nfl' },
  mlb: { sport: 'baseball', league: 'mlb' },
  ncaaf: { sport: 'football', league: 'college-football' },
  wnba: { sport: 'basketball', league: 'wnba' },
  atp: { sport: 'tennis', league: 'atp' },
  wta: { sport: 'tennis', league: 'wta' },
  nba: { sport: 'basketball', league: 'nba' },
  nhl: { sport: 'hockey', league: 'nhl' },
  ncaab: { sport: 'basketball', league: 'mens-college-basketball' },
};
async function fetchSportGames(sport) {
  const { sport: espnSport, league } = ESPN_PATHS[sport];
  const now = new Date();
  const dateStrs = [0, 1, 2, 3, 4, 5, 6].map(offset => {
    const d = new Date(now);
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10).replace(/-/g, '');
  });
  const seen = new Set();
  const events = [];
  const results = await Promise.all(dateStrs.map(async (date) => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${espnSport}/${league}/scoreboard?dates=${date}&limit=300`);
      if (!res.ok) return [];
      const json = await res.json();
      return json.events || [];
    } catch (e) { return []; /* best-effort per date */ }
  }));
  results.flat().forEach(ev => { if (!seen.has(ev.id)) { seen.add(ev.id); events.push(ev); } });
  return events.map(ev => {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp || !comp.competitors) return null;
    let home = comp.competitors.find(c => c.homeAway === 'home');
    let away = comp.competitors.find(c => c.homeAway === 'away');
    if (!home || !away) { home = comp.competitors[0]; away = comp.competitors[1]; }
    if (!home || !away) return null;
    const homeEntity = home.team || home.athlete;
    const awayEntity = away.team || away.athlete;
    if (!homeEntity || !awayEntity) return null;
    const homeAbbr = home.team ? home.team.abbreviation : ('p' + homeEntity.id);
    const awayAbbr = away.team ? away.team.abbreviation : ('p' + awayEntity.id);
    const homeName = home.team ? home.team.displayName : homeEntity.displayName;
    const awayName = away.team ? away.team.displayName : awayEntity.displayName;
    const homeLogo = home.team ? (home.team.logo || null) : ((homeEntity.headshot && homeEntity.headshot.href) || null);
    const awayLogo = away.team ? (away.team.logo || null) : ((awayEntity.headshot && awayEntity.headshot.href) || null);
    const extractRecord = (competitor) => {
      try {
        const recs = competitor.records;
        if (!recs || !recs.length) return null;
        const overall = recs.find(r => r.name === 'overall' || r.type === 'total') || recs[0];
        return overall.summary || null;
      } catch (e) { return null; }
    };
    const homeRecord = extractRecord(home);
    const awayRecord = extractRecord(away);
    const state = ev.status && ev.status.type && ev.status.type.state;
    const status = state === 'post' ? 'closed' : (state === 'in' ? 'inprogress' : 'scheduled');
    const odds = comp.odds && comp.odds[0];
    const extractPitcher = (competitor) => {
      try {
        const p = competitor.probables && competitor.probables[0];
        if (p && p.athlete) return p.athlete.shortName || p.athlete.displayName || null;
        if (p && p.displayName) return p.displayName;
      } catch (e) { /* field not present in this response */ }
      return null;
    };
    const g = {
      id: ev.id,
      status,
      home: homeAbbr, away: awayAbbr,
      teams: { [homeAbbr]: { name: homeName, logo: homeLogo, record: homeRecord }, [awayAbbr]: { name: awayName, logo: awayLogo, record: awayRecord } },
      start: ev.date,
      local_start: new Date(ev.date).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      title: (comp.notes && comp.notes[0] && comp.notes[0].headline) || null,
      liveDetail: state === 'in' ? ((ev.status.type && ev.status.type.shortDetail) || null) : null,
      oddsDetails: (odds && odds.details) || null,
      overUnder: (odds && typeof odds.overUnder === 'number') ? odds.overUnder : null,
      homePitcher: sport === 'mlb' ? extractPitcher(home) : null,
      awayPitcher: sport === 'mlb' ? extractPitcher(away) : null,
    };
    if (status !== 'scheduled') {
      g.score = { [homeAbbr]: Number(home.score), [awayAbbr]: Number(away.score) };
    }
    return g;
  }).filter(Boolean);
}
let gamesLoaded = false;
async function refreshGameLists() {
  const before = JSON.stringify(DATA);
  const activeSports = Object.keys(ESPN_PATHS).filter(sport => {
    const meta = LEAGUES_META.find(l => l.id === sport);
    return meta && meta.active;
  });
  await Promise.all(activeSports.map(async (sport) => {
    try {
      const games = await fetchSportGames(sport);
      if (games.length) DATA[sport] = games;
    } catch (e) { /* keep previous list for this sport on failure */ }
  }));
  rebuildGameIndex();
  gamesLoaded = true;
  return JSON.stringify(DATA) !== before;
}

let liveTimer = null;
function startLiveScoreChecks() {
  refreshGameLists().then(async () => { await persistNewlySettledPicks(); await persistNewlySettledWeeklyBets(); await persistNewlySettledPlayerProps(); await persistNewlySettledGolfH2H(); await persistNewlySettledComboPool(); await persistPoolPayoutToMe(); await persistAccountAdjustmentsForChallenges(); if (profile) render(); });
  if (liveTimer) return;
  liveTimer = setInterval(async () => {
    if (pendingSaveCount > 0) return; // don't rebuild the screen while a bet is mid-save
    const dataChanged = await refreshGameLists();
    const settledA = await persistNewlySettledPicks();
    const settledB = await persistNewlySettledWeeklyBets();
    const settledC = await persistNewlySettledPlayerProps();
    const settledD = await persistNewlySettledGolfH2H();
    const settledF = await persistNewlySettledComboPool();
    const settledG = await persistPoolPayoutToMe();
    const settledE = await persistAccountAdjustmentsForChallenges();
    if (profile && (dataChanged || settledA || settledB || settledC || settledD || settledE || settledF || settledG)) render();
  }, 60000);
}

function mondayOf(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function weekLabel(d) { return 'Week of ' + mondayOf(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function weekKey(d) { return mondayOf(d).toISOString().slice(0,10); }
function inDateRange(date, mode) {
  if (mode === 'all') return true;
  const now = new Date();
  if (mode === 'day') return date.toDateString() === now.toDateString();
  if (mode === 'week') return weekKey(date) === weekKey(now);
  if (mode === 'year') return date.getFullYear() === now.getFullYear();
  return true;
}

// ---------- spread from real ESPN posted line (payout is flat 1:1, no odds weighting) ----------
function fmtUnits(n) {
  const r = Math.round(n * 100) / 100;
  return (r > 0 ? '+' : '') + r.toFixed(2) + 'u';
}
// Returns spread as the HOME team's number: negative = home favored, positive = home underdog. null = no posted line.
function computeSpread(sport, g) {
  const meta = LEAGUES_META.find(l => l.id === sport);
  if (!meta || !meta.spreadSport) return null;
  if (!g.oddsDetails) return null;
  const m = g.oddsDetails.match(/^([A-Za-z.]+)\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const favTeam = m[1].toUpperCase();
  const magnitude = Math.abs(parseFloat(m[2]));
  if (favTeam === (g.home || '').toUpperCase()) return -magnitude;
  if (favTeam === (g.away || '').toUpperCase()) return magnitude;
  return null;
}
function spreadLabelForSide(sport, g, ab) {
  const spread = computeSpread(sport, g);
  if (spread === null) return null;
  const val = ab === g.home ? spread : -spread;
  return val === 0 ? 'PK' : (val > 0 ? '+' + val : val.toString());
}
function pickSpreadDisplay(p) {
  if (p.spreadLabel) return p.spreadLabel;
  const idx = gameIndex[p.gameId];
  if (!idx) return null;
  return spreadLabelForSide(idx.sport, idx.game, p.sideAbbr);
}

function toFsValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFsValue) } };
  return { mapValue: { fields: toFsFields(v) } };
}
function toFsFields(obj) {
  const fields = {};
  Object.keys(obj).forEach(k => fields[k] = toFsValue(obj[k]));
  return fields;
}
function fromFsValue(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('integerValue' in v) return parseInt(v.integerValue, 10);
  if ('doubleValue' in v) return v.doubleValue;
  if ('nullValue' in v) return null;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFsValue);
  if ('mapValue' in v) return fromFsFields(v.mapValue.fields || {});
  return null;
}
function fromFsFields(fields) {
  const obj = {};
  Object.keys(fields || {}).forEach(k => obj[k] = fromFsValue(fields[k]));
  return obj;
}
function describeFetchError(e) {
  const msg = (e && e.message) || '';
  if (!navigator.onLine) return 'You appear to be offline — check your connection and try again.';
  if (/load failed|network|failed to fetch/i.test(msg)) {
    return 'Network request was blocked before it reached Firestore (msg: "' + msg + '"). This can happen if the page is opened as a raw local file rather than over https, or if something on the network is blocking requests to firestore.googleapis.com.';
  }
  return msg || 'unknown error';
}
function authHeader() {
  return session && session.idToken ? { 'Authorization': 'Bearer ' + session.idToken } : {};
}
async function fsGet() {
  await ensureFreshSession();
  const res = await fetch(`${FS_DOC}?key=${firebaseConfig.apiKey}`, { headers: authHeader() });
  if (res.status === 404) return {};
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error('Firestore GET ' + res.status + ': ' + t.slice(0,150)); }
  const json = await res.json();
  return fromFsFields(json.fields);
}
async function fsPatch(partial) {
  await ensureFreshSession();
  const fields = toFsFields(partial);
  const params = new URLSearchParams();
  params.append('key', firebaseConfig.apiKey);
  Object.keys(partial).forEach(k => params.append('updateMask.fieldPaths', k));
  const res = await fetch(`${FS_DOC}?${params.toString()}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeader() },
    body: JSON.stringify({ fields })
  });
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error('Firestore PATCH ' + res.status + ': ' + t.slice(0,150)); }
  return res.json();
}

function describeAuthError(e) {
  const msg = (e && e.message) || '';
  const map = {
    EMAIL_EXISTS: 'That username is already taken.',
    EMAIL_NOT_FOUND: 'No account with that username.',
    INVALID_PASSWORD: 'Incorrect password.',
    INVALID_LOGIN_CREDENTIALS: 'Incorrect username or password.',
    USER_DISABLED: 'This account has been disabled.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts — try again in a bit.',
  };
  for (const code in map) if (msg.indexOf(code) !== -1) return map[code];
  if (msg.indexOf('WEAK_PASSWORD') !== -1) return 'Password must be at least 6 characters.';
  if (msg.indexOf('INVALID_EMAIL') !== -1 || msg.indexOf('EMAIL_INVALID') !== -1) return 'Usernames can only contain letters, numbers, dots, dashes, and underscores.';

function accountTxsFor(name) {
  return allPicks.filter(p => p.poolType === 'accountTx' && p.player === name);
}
function accountBalanceFor(name) {
  return accountTxsFor(name).reduce((s,tx) => s + (tx.type === 'deposit' ? tx.amount : -tx.amount), 0);
}
function netChallengeTxsToday() {
  const today = houseDayKey(new Date());
  return accountTxsFor(profile.name)
    .filter(tx => tx.relatedChallengeId && houseDayKey(new Date(tx.timestamp)) === today)
    .reduce((s,tx) => s + (tx.type === 'deposit' ? tx.amount : -tx.amount), 0);
}
function todaysRemainingBudget() {
  if (profile.dailyRiskDate !== houseDayKey(new Date()) || profile.dailyRiskAmount == null) return 0;
  return profile.dailyRiskAmount + netChallengeTxsToday();
}
function hasPendingChallengesToday() {
  const today = houseDayKey(new Date());
  return allPicks.some(p => {
    if (p.poolType !== 'challenge' || p.propType === 'combo_pool') return false;
    const involvesMe = p.creator === profile.name || p.acceptedBy === profile.name;
    if (!involvesMe) return false;
    if (houseDayKey(new Date(p.timestamp)) !== today) return false;
    if (p.status === 'open' && p.creator === profile.name) return true; // stake reserved, still waiting for someone to accept
    if (p.status === 'accepted') return settlePick(p).status === 'pending'; // game not final yet
    return false;
  });
}
function requireDailyBudget(actionLabel) {
  if (todaysRemainingBudget() > 0) return true;
  if (hasPendingChallengesToday()) return true; // your stake is tied up, not gone — you could still win it back once those settle
  alert(`You've used up today's risk budget and everything from today has settled. Come back after midnight to set a new one \u2014 that's the whole point of setting a limit before you start.`);
  return false;
}

function incomingFriendRequests() {
  return allPicks.filter(p => p.poolType === 'friendRequest' && p.status === 'pending' && p.toUid === profile.uid);
}
async function syncAcceptedFriendRequests() {
  if (!profile) return false;
  const myFriends = profile.friends || [];
  const accepted = allPicks.filter(p => p.poolType === 'friendRequest' && p.status === 'accepted' && p.fromUid === profile.uid && !p.synced);
  if (!accepted.length) return false;
  const toAdd = [];
  accepted.forEach(req => {
    if (!myFriends.some(f => f.uid === req.toUid) && !toAdd.some(f => f.uid === req.toUid)) {
      toAdd.push({ uid: req.toUid, name: req.toName, username: req.toUsername });
    }
    req.synced = true;
  });
  const updated = toAdd.length ? [...myFriends, ...toAdd] : myFriends;
  try {
    if (toAdd.length) {
      await saveProfileDoc(profile.uid, { friends: updated });
      saveProfile({ ...profile, friends: updated });
    }
    await savePicks(allPicks); // persist the synced flags either way, so this doesn't re-run forever
    return true;
  } catch (e) { return false; }
}

  switchLink.style.cssText = 'text-align:center;margin-top:12px;font-size:12.5px;color:var(--accent);font-weight:700;';
  switchLink.onclick = () => { authMode = authMode === 'login' ? 'signup' : 'login'; setupError = ''; render(); };
  card.appendChild(switchLink);

  if (authMode === 'login') {
    const forgotLink = el('div', null, 'Forgot username or password?');
    forgotLink.style.cssText = 'text-align:center;margin-top:8px;font-size:12px;color:var(--text-faint);font-weight:700;';
    forgotLink.onclick = () => { authMode = 'recover'; setupError = ''; render(); };
    card.appendChild(forgotLink);
  }

  wrap.appendChild(card);

  goBtn.onclick = async () => {
    const username = userInput.value.trim();
    const password = passInput.value;
    if (!username) { userInput.style.borderColor = 'var(--danger)'; return; }
    if (!password) { passInput.style.borderColor = 'var(--danger)'; return; }
    setupError = '';
    goBtn.disabled = true; goBtn.textContent = 'Loading…';
    try {
      if (authMode === 'signup') {
        const name = nameInput.value.trim();
        if (!name) { setupError = 'Enter your name.'; goBtn.disabled = false; goBtn.textContent = 'Create account'; render(); return; }
        const email = emailInput.value.trim() || null;
        const auth = await authSignUp(username, password);
        saveSession({ idToken: auth.idToken, refreshToken: auth.refreshToken, uid: auth.localId, expiresAt: Date.now() + parseInt(auth.expiresIn, 10) * 1000 });
        let authEmail = auth.email; // the synthetic username-based email, unless we swap it below
        if (email) {
          try {
            const updated = await authUpdateEmail(auth.idToken, email);
            authEmail = email;
            saveSession({ idToken: updated.idToken, refreshToken: updated.refreshToken, uid: auth.localId, expiresAt: Date.now() + parseInt(updated.expiresIn, 10) * 1000 });
          } catch (e) { /* real email update failed (e.g. already in use elsewhere) — keep the synthetic one, account still works */ }
        }
        await saveProfileDoc(auth.localId, { name, username, email, authEmail });
        saveProfile({ name, username, email, uid: auth.localId });
      } else {
        const auth = await authSignIn(username, password);
        saveSession({ idToken: auth.idToken, refreshToken: auth.refreshToken, uid: auth.localId, expiresAt: Date.now() + parseInt(auth.expiresIn, 10) * 1000 });
        const doc = await fetchProfileDoc(auth.localId);
        if (!doc) throw new Error('Profile data missing for this account.');
        saveProfile({ name: doc.name, username: doc.username, email: doc.email || null, unitSize: doc.unitSize || null, dailyRiskDate: doc.dailyRiskDate || null, dailyRiskAmount: doc.dailyRiskAmount != null ? doc.dailyRiskAmount : null, friends: doc.friends || [], uid: auth.localId });
      }
      await completeLoginSetup();
    } catch (e) {
      clearSession();
      setupError = describeAuthError(e);
      goBtn.disabled = false; goBtn.textContent = authMode === 'login' ? 'Log in' : 'Create account';
      render();
    }
  };
  return wrap;
}

  const wrap = el('div');

  card.appendChild(resultEl);

  const backLink = el('div', null, '\u2190 Back to log in');
  backLink.style.cssText = 'text-align:center;margin-top:12px;font-size:12.5px;color:var(--accent);font-weight:700;';
  backLink.onclick = () => { authMode = 'login'; setupError = ''; render(); };
  card.appendChild(backLink);
  wrap.appendChild(card);

  goBtn.onclick = async () => {
    const query = input.value.trim();
    resultEl.textContent = '';
    if (!query) { input.style.borderColor = 'var(--danger)'; return; }
    goBtn.disabled = true; goBtn.textContent = 'Looking up…';
    try {
      let profileMatch = null;
      if (query.includes('@')) {
        profileMatch = await findProfileByEmail(query);
      } else {
        profileMatch = await findProfileByUsername(query);
      }
      const email = profileMatch && (profileMatch.authEmail || profileMatch.email);
      if (email && email.indexOf('@units-app.local') === -1) {
        await authSendPasswordReset(email);
        resultEl.textContent = `If that matches an account, a reset link was sent. Your username is "${profileMatch.username}" — good to know for next time.`;
      } else if (profileMatch) {
        resultEl.textContent = `We found the account "${profileMatch.username}", but it has no recovery email on file, so we can't send a reset link. You'll need help from whoever manages this app.`;
      } else {
        resultEl.textContent = "If that matches an account with a recovery email, a reset link was sent.";
      }
      goBtn.disabled = false; goBtn.textContent = 'Send reset link';
    } catch (e) {
      resultEl.textContent = "Couldn't process that (" + describeFetchError(e) + ") — try again.";
      goBtn.disabled = false; goBtn.textContent = 'Send reset link';
    }
  };
  return wrap;
}

function statusInfo(status, liveDetail) {
  if (status === 'inprogress') return { text: liveDetail || 'Live', live: true };
  if (status === 'closed' || status === 'complete') return { text: 'Final', live: false };
  return { text: 'Upcoming', live: false };
}

// ---------- House Bank: 100 units/week, confidence chips, spread + total bets ----------
function houseWeekStart(d) {
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = (day + 5) % 7; // days since most recent Tuesday
  dt.setDate(dt.getDate() - diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function houseWeekKey(d) { return houseWeekStart(d).toISOString().slice(0,10); }
function weekRangeLabel(wk) {
  return new Date(wk + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function chipsFor(units) {
  return '\ud83d\udd25'.repeat(Math.max(0, Math.min(3, Math.round(units))));
}

function houseDayKey(d) { const dt = new Date(d); dt.setHours(0,0,0,0); return dt.toISOString().slice(0,10); }
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (Math.imul(31, h) + seedStr.charCodeAt(i)) | 0;
  return function() {
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}
let cachedDailyPool = null;
let cachedDailyPoolKey = null;
function dailyOptionPool() {
  const dayKey = houseDayKey(new Date());
  if (cachedDailyPoolKey === dayKey && cachedDailyPool) return cachedDailyPool;
  const rand = seededRandom(dayKey);
  const candidates = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      if (houseDayKey(new Date(g.start)) !== dayKey) return;
      const spreadVal = computeSpread(lg.id, g);
      const totalVal = g.overUnder;
      const availableTypes = [];
      if (spreadVal !== null) availableTypes.push('spread');
      if (totalVal !== null && totalVal !== undefined) availableTypes.push('total');
      if (!availableTypes.length) return;
      candidates.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, availableTypes });
    });
  });
  // Sort by a stable, fetch-order-independent key first — ESPN doesn't guarantee the same game order on every
  // fetch, and without this the same date-based seed could pick a different 5 games depending on fetch timing.
  candidates.sort((a, b) => (a.sport + '_' + a.gameId).localeCompare(b.sport + '_' + b.gameId));
  const pool = candidates.map(c => ({
    sport: c.sport, gameId: c.gameId, gameLabel: c.gameLabel,
    betType: c.availableTypes[Math.floor(rand() * c.availableTypes.length)]
  }));
  cachedDailyPool = pool;

}
function computeDailySlateLocal(dayKey) {
  const pool = dailyOptionPool();

  for (let i = shuffled.length - 1; i > 0; i--) {

}
function dailyBaseSlate() {

  // else (including this device on future loads) reads that same saved value instead of recomputing their own.

function weeklyBetsFor(name, wk) {

function weeklyRemaining(name, wk) { return Math.max(0, HOUSE_BANK_TOTAL - weeklyUnitsUsed(name, wk)); }

function settleWeeklyBet(p) {
  if (p.settledResult) return p.settledResult;
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };
  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else if (p.sideAbbr === 'OVER') outcome = diff > 0 ? 'win' : 'loss';
    else outcome = diff < 0 ? 'win' : 'loss';
  } else {
    const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
    const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
    const margin = (teamScore - oppScore) + p.line;
    outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');

}
async function persistNewlySettledWeeklyBets() {

    const r = settleWeeklyBet(p);
    if (r.status !== 'pending') { p.settledResult = r; changed = true; }
  });
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* retry next cycle */ } }
  return changed;
}
function weeklyNetUnits(name, wk) {
  return weeklyBetsFor(name, wk).reduce((s,p) => {
    const r = settleWeeklyBet(p);
    return s + (r.status === 'win' || r.status === 'loss' ? r.profit : 0);

}
function weeklyAllSettled(name, wk) {
  const bets = weeklyBetsFor(name, wk);
  if (!bets.length) return false;
  return bets.every(p => settleWeeklyBet(p).status !== 'pending');
}
function allWeekKeysFor(name) {
  return [...new Set(allPicks.filter(p => p.player === name && p.poolType === 'weekly').map(p => p.weekKey))].sort();
}

}

  const weeks = allWeekKeysFor(name).slice().sort().reverse();
  let streak = 0;
  for (const wk of weeks) {
    if (!weeklyAllSettled(name, wk)) continue;
    if (weeklyNetUnits(name, wk) > 0) streak++;

}

    const r = settleWeeklyBet(p);

    const seg = el('div'); seg.style.cssText = `flex:${p.units} 0 0;background:${color};border-right:1px solid var(--bg);`;

    rightWrap.style.cssText = 'display:flex;align-items:center;gap:8px;';

function renderDailyOptionCard(opt, remaining, fullSlate, usedMulligan) {
  const idx = gameIndex[opt.gameId];
  if (!idx) return el('div');
  const game = idx.game;
  const sport = opt.sport;
  const card = el('div', 'event-card');
  const timeStr = new Date(game.start).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  card.appendChild(el('div', 'event-meta', game.title || timeStr));
  const awayRec = game.teams[game.away].record ? ` (${game.teams[game.away].record})` : '';
  const homeRec = game.teams[game.home].record ? ` (${game.teams[game.home].record})` : '';
  card.appendChild(el('div', null, `${game.teams[game.away].name}${awayRec} @ ${game.teams[game.home].name}${homeRec}`)).style.cssText = 'font-size:13.5px;font-weight:700;margin:6px 0 4px;';
  if (sport === 'mlb' && (game.awayPitcher || game.homePitcher)) {
    card.appendChild(el('div', null, `${game.awayPitcher || 'TBD'} vs ${game.homePitcher || 'TBD'}`)).style.cssText = 'font-size:11px;color:var(--text-faint);margin:0 0 6px;';
  }
  card.appendChild(el('div', null, opt.betType === 'spread' ? 'Spread' : 'Total')).style.cssText = 'font-size:10.5px;color:var(--text-faint);text-transform:uppercase;font-weight:700;letter-spacing:0.03em;margin-bottom:6px;';

  const wk = houseDayKey(new Date());
  const existingBet = weeklyBetsFor(profile.name, wk).find(p => p.gameId === opt.gameId && p.betType === opt.betType);

  if (existingBet) {
    const note = el('div', 'locked-note');
    note.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;';
    const infoDiv = el('div');
    const spreadTxt = existingBet.betType === 'spread' ? (existingBet.line === 0 ? 'PK' : (existingBet.line > 0 ? '+' + existingBet.line : existingBet.line)) : null;
    const pickTxt = existingBet.betType === 'total' ? `${existingBet.sideAbbr === 'OVER' ? 'Over' : 'Under'} ${existingBet.line}` : `${existingBet.sideAbbr} ${spreadTxt}`;
    infoDiv.innerHTML = `<div class="ln-title">Your bet: ${pickTxt}</div>${chipsFor(existingBet.units)} <b>${existingBet.units}u</b>`;
    note.appendChild(infoDiv);
    if (game.status === 'scheduled') {
      const delBtn = el('button', null, '✕');
      delBtn.style.cssText = 'background:none;border:1px solid var(--accent);color:var(--accent);border-radius:6px;width:28px;height:28px;font-size:13px;flex-shrink:0;';
      delBtn.onclick = () => { if (confirm('Delete this bet? Your units will return to the bank.')) deletePick(existingBet.id); };
      note.appendChild(delBtn);
    }
    card.appendChild(note);
    return card;
  }
  if (game.status !== 'scheduled') {
    card.appendChild(el('div', 'no-odds-note', 'Game already started — this option is no longer available'));
    return card;
  }
  if (remaining <= 0) { card.appendChild(el('div', 'no-odds-note', 'Bank empty this week')); return card; }

  if (!usedMulligan) {
    const mullWrap = el('div');
    mullWrap.style.cssText = 'margin-bottom:10px;';
    const mullToggleBtn = el('button', null, '\ud83d\udd04 Swap this pick (mulligan)');
    mullToggleBtn.style.cssText = 'width:100%;background:none;border:1px dashed var(--border);color:var(--text-dim);border-radius:6px;padding:9px;font-size:12px;font-weight:700;';
    const swapPanel = el('div');
    swapPanel.style.cssText = 'display:none;margin-top:8px;';
    const alreadyUsedKeys = new Set(fullSlate.map(o => o.gameId + '_' + o.betType));
    const alternatives = dailyOptionPool().filter(o => !alreadyUsedKeys.has(o.gameId + '_' + o.betType));
    const altSel = el('select');
    altSel.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px;font-size:13px;margin-bottom:8px;box-sizing:border-box;';
    if (!alternatives.length) {
      swapPanel.appendChild(el('div', 'no-odds-note', 'No other options available to swap in today.'));
    } else {
      alternatives.forEach((o,i) => { const op = document.createElement('option'); op.value = String(i); op.textContent = `${o.gameLabel} — ${o.betType === 'spread' ? 'Spread' : 'Total'}`; altSel.appendChild(op); });
      swapPanel.appendChild(altSel);
      const confirmBtn = el('button', 'lock-btn', 'Confirm swap');
      confirmBtn.onclick = async () => {
        const chosen = alternatives[parseInt(altSel.value, 10)];
        const mullRecord = {
          id: profile.name + '_mulligan_' + wk,
          poolType: 'mulligan', player: profile.name, dayKey: wk,
          replacedGameId: opt.gameId, replacedBetType: opt.betType,
          newOption: chosen,
          timestamp: new Date().toISOString()
        };
        confirmBtn.disabled = true; confirmBtn.textContent = 'Saving…';
        allPicks.push(mullRecord);
        try { await savePicks(allPicks); render(); }
        catch (e) { allPicks.pop(); confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm swap'; alert("Couldn't save (" + describeFetchError(e) + ") — try again."); }
      };
      swapPanel.appendChild(confirmBtn);
    }
    mullToggleBtn.onclick = () => { swapPanel.style.display = swapPanel.style.display === 'none' ? 'block' : 'none'; };
    mullWrap.appendChild(mullToggleBtn);
    mullWrap.appendChild(swapPanel);
    card.appendChild(mullWrap);
  }

  const key = opt.gameId + '_' + opt.betType;
  const sideKey = 'house_' + key;

  // side selector — the user picks which side, unlike the old auto-assigned version
  const sideGrid = el('div', 'outcome-grid');
  sideGrid.style.marginBottom = '10px';
  let sideOptions;
  if (opt.betType === 'total') {
    sideOptions = [{ side: 'OVER', team: 'Over', label: String(game.overUnder) }, { side: 'UNDER', team: 'Under', label: String(game.overUnder) }];
  } else {
    const spreadVal = computeSpread(sport, game);
    const favSide = spreadVal <= 0 ? game.home : game.away;
    const magnitude = Math.abs(spreadVal);
    const favLabel = magnitude === 0 ? 'PK' : '-' + magnitude;
    const udLabel = magnitude === 0 ? 'PK' : '+' + magnitude;
    sideOptions = [game.away, game.home].map(ab => ({ side: ab, team: fullTeamName(opt.gameId, ab), label: ab === favSide ? favLabel : udLabel }));
  }
  sideOptions.forEach(so => {
    const btn = el('div', 'outcome-btn' + (selectedSide[sideKey] === so.side ? ' selected' : ''));
    btn.innerHTML = `<div class="oc-team">${so.team}</div><div class="oc-line">${so.label}</div>`;
    btn.onclick = () => {
      selectedSide[sideKey] = so.side;
      sideGrid.querySelectorAll('.outcome-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      refreshConfidenceUI();
    };
    sideGrid.appendChild(btn);
  });
  card.appendChild(sideGrid);

  const slip = el('div', 'bet-slip');
  if (weeklySelectedUnits[key] === undefined) weeklySelectedUnits[key] = 0;
  const cap = Math.min(HOUSE_BET_CAP, remaining);

  const confRow = el('div');
  confRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:10px;';
  const addBtn = el('button', null, '+ Add unit');
  addBtn.style.cssText = 'flex:1;background:var(--accent-dark);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:11px;font-size:13px;font-weight:700;';
  const removeBtn = el('button', null, '\u2715');
  removeBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:38px;height:38px;font-size:14px;flex-shrink:0;';
  confRow.appendChild(addBtn);
  confRow.appendChild(removeBtn);
  slip.appendChild(confRow);

  const lockBtn = el('button', 'lock-btn', 'Pick a side first');
  lockBtn.disabled = true;
  slip.appendChild(lockBtn);
  const errEl = el('div', 'pick-error');
  slip.appendChild(errEl);
  card.appendChild(slip);

  function refreshConfidenceUI() {
    const u = weeklySelectedUnits[key];
    const hasSide = !!selectedSide[sideKey];
    addBtn.textContent = u > 0 ? `${chipsFor(u)}  Add unit (${u}/${cap})` : '+ Add unit';
    addBtn.disabled = u >= cap || !hasSide;
    removeBtn.disabled = u <= 0;
    lockBtn.disabled = u <= 0 || !hasSide;
    lockBtn.textContent = !hasSide ? 'Pick a side first' : (u > 0 ? `Lock: ${chipsFor(u)}` : 'Pick a unit amount');
  }
  addBtn.onclick = () => { if (weeklySelectedUnits[key] < cap) weeklySelectedUnits[key]++; refreshConfidenceUI(); };
  removeBtn.onclick = () => { if (weeklySelectedUnits[key] > 0) weeklySelectedUnits[key]--; refreshConfidenceUI(); };
  refreshConfidenceUI();

  lockBtn.onclick = async () => {
    try {
      const units = weeklySelectedUnits[key];
      const chosenSide = selectedSide[sideKey];
      errEl.textContent = '';
      if (!chosenSide) { errEl.textContent = 'Pick a side first.'; return; }
      if (!units) { errEl.textContent = 'Pick 1, 2, or 3 units.'; return; }
      if (units > remaining + 0.001) { errEl.textContent = `Only ${remaining}u left in your bank this week.`; return; }
      let line;
      if (opt.betType === 'total') {
        line = game.overUnder;
      } else {
        const spreadVal = computeSpread(sport, game);
        line = chosenSide === game.home ? spreadVal : -spreadVal;
      }
      const pick = {
        id: profile.name + '_weekly_' + opt.gameId + '_' + opt.betType + '_' + Date.now(),
        player: profile.name, sport, gameId: opt.gameId,
        gameLabel: game.away + ' @ ' + game.home,
        betType: opt.betType, sideAbbr: chosenSide, line, units,
        weekKey: wk, poolType: 'weekly',
        timestamp: new Date().toISOString()
      };
      lockBtn.disabled = true; lockBtn.textContent = 'Saving…';
      allPicks.push(pick);
      try {
        await savePicks(allPicks);
      } catch (saveErr) {
        allPicks.pop();
        lockBtn.disabled = false; lockBtn.textContent = `Lock: ${chipsFor(units)}`;
        const msg = describeFetchError(saveErr);
        errEl.textContent = "Couldn't save (" + msg + ") — try again.";
        alert('Save failed: ' + msg);
        return;
      }
      render();
    } catch (outerErr) {
      const msg = (outerErr && outerErr.message) ? outerErr.message : String(outerErr);
      alert('Unexpected error locking this bet: ' + msg);
      lockBtn.disabled = false;
    }
  };
  return card;
}

function trackerBetsFor(name) {

function normTeamName(s) { return (s || '').toLowerCase().replace(/[^a-z]/g, ''); }
function matchGameForBet(matchupText) {
  if (!matchupText) return null;
  const norm = normTeamName(matchupText);
  let best = null;
  Object.keys(DATA).forEach(sport => {
    (DATA[sport] || []).forEach(g => {
      const homeName = normTeamName(g.teams[g.home]?.name);
      const awayName = normTeamName(g.teams[g.away]?.name);
      const homeAbbr = normTeamName(g.home), awayAbbr = normTeamName(g.away);

async function fetchGamesForDate(sport, dateStr) {
  const paths = ESPN_PATHS[sport];

  const compact = dateStr.replace(/-/g, '');
  try {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${paths.sport}/${paths.league}/scoreboard?dates=${compact}&limit=300`);
    if (!res.ok) return [];
    const json = await res.json();
    return (json.events || []).map(ev => {
      const comp = ev.competitions && ev.competitions[0];
      if (!comp) return null;
      const home = comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
      if (!home || !away || !home.team || !away.team) return null;
      return {
        id: ev.id,
        home: home.team.abbreviation, away: away.team.abbreviation,
        homeName: home.team.displayName, awayName: away.team.displayName

}

function renderProfitTrendBareSVG(days) {
  if (!days.length) return '<div class="empty" style="padding:24px 10px;">No settled bets in this range.</div>';
  const w = 320, h = 150, padL = 38, padR = 8, padT = 10, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;

    const start = cum;
    cum += d.profit;

  });
  const allVals = bars.flatMap(b => [b.start, b.end]);
  const minV = Math.min(0, ...allVals), maxV = Math.max(0, ...allVals);
  const range = (maxV - minV) || 1;
  const n = bars.length;
  const slotW = innerW / n;
  const barW = Math.max(4, slotW * 0.6);
  const xCenter = i => padL + slotW * (i + 0.5);
  const yScale = v => padT + innerH - ((v - minV) / range) * innerH;
  const zeroY = yScale(0);

  const connectors = bars.slice(0, -1).map((b, i) => {
    const x1 = xCenter(i) + barW / 2;
    const x2 = xCenter(i + 1) - barW / 2;
    const y = yScale(b.end);
    return `<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,2"/>`;
  }).join('');
  const barsSvg = bars.map((b, i) => {

    const yTop = yScale(Math.max(b.start, b.end));
    const yBot = yScale(Math.min(b.start, b.end));
    const height = Math.max(1.5, yBot - yTop);
    const color = b.profit >= 0 ? '#4CAF50' : 'var(--danger)';
    return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${height.toFixed(1)}" fill="${color}" rx="2"/>`;
  }).join('');

  const fmtDate = k => new Date(k + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const labelIdxs = n <= 4 ? bars.map((_,i) => i) : [0, Math.floor((n-1)/2), n-1];
  const labels = labelIdxs.map(i => `<text x="${xCenter(i).toFixed(1)}" y="${h - 6}" font-size="9" text-anchor="middle" style="fill:var(--text-faint)" font-family="var(--font-mono)">${fmtDate(days[i].dateKey)}</text>`).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${zeroY}" x2="${padL + innerW}" y2="${zeroY}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${zeroY + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">$0</text>
    <text x="2" y="${padT + 8}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">${maxV.toFixed(0)}</text>
    ${connectors}
    ${barsSvg}
    ${labels}
  </svg>`;
}

  const addLegBtn = el('button', null, '+ Add parlay leg');
  addLegBtn.style.cssText = 'width:100%;margin-top:10px;background:none;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;padding:9px;border-radius:6px;';
  addLegBtn.onclick = () => {
    const leg = buildCurrentLeg();
    if (!leg) return;
    trackerWizardLegs.push(leg);
    render();
  };
  card.appendChild(addLegBtn);

  const addBtn = el('button', 'lock-btn', trackerWizardLegs.length ? `Finish parlay (${trackerWizardLegs.length + 1} legs)` : 'Add this bet');
  addBtn.style.marginTop = '8px';
  addBtn.onclick = () => {
    const leg = buildCurrentLeg();
    if (!leg) return;
    if (!costInput.value) { errEl.textContent = 'Enter the amount bet.'; return; }

    const allLegs = [...trackerWizardLegs, leg];
    const shared = {
      cost: parseFloat(costInput.value) || 0,
      payout: payoutInput.value === '' ? null : parseFloat(payoutInput.value),
      maxPayout: null,
      status: payoutInput.value === '' ? 'open' : 'settled',
      placedAt: leg.placedAt
    };

    if (!kalshiPendingExtraction) kalshiPendingExtraction = [];
    if (allLegs.length === 1) {
      kalshiPendingExtraction.push({ _tempId: 'temp_' + Date.now(), ...leg, ...shared });
    } else {
      const sports = [...new Set(allLegs.map(l => l.matchedSport).filter(Boolean))];
      kalshiPendingExtraction.push({
        _tempId: 'temp_' + Date.now(),
        betType: 'parlay', legs: allLegs,
        matchup: allLegs.length + '-leg parlay',
        selection: allLegs.map(l => l.selection).join(' + '),
        matchedSport: sports.length === 1 ? sports[0] : null,
        matchedGameId: null, homeAbbr: null, awayAbbr: null, betSide: null,
        ...shared
      });
    }
    trackerWizardLegs = [];
    trackerWizardOpen = false;
    render();
  };
  card.appendChild(addBtn);

  const cancelBtn = el('button', null, 'Cancel');
  cancelBtn.style.cssText = 'margin-top:8px;width:100%;background:none;border:1px solid var(--border);color:var(--text-faint);font-size:12px;padding:8px;border-radius:6px;';
  cancelBtn.onclick = () => { trackerWizardOpen = false; trackerWizardLegs = []; render(); };
  card.appendChild(cancelBtn);

  return card;
}

      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      const newRecords = kalshiPendingExtraction.map(bet => ({

        const teamSel = el('select');

    if (trackerBetTypeFilter !== 'all' && e.p.betType !== trackerBetTypeFilter) return false;

  const settledEntries = history.filter(e => e.profit !== null);

  return wrap;

function poolLegSideOptions(leg) {

async function deleteChallenge(ch) {
  if (ch.status !== 'open') return; // can only withdraw a challenge before someone accepts it
  if (!confirm('Delete this challenge permanently? Your reserved stake will be refunded.')) return;
  const idx = allPicks.findIndex(p => p.id === ch.id);
  if (idx === -1) return;
  const removed = allPicks.splice(idx, 1)[0];
  let refundTx = null;
  if (profile.unitSize) {
    refundTx = {
      id: profile.name + '_accounttx_refund_' + ch.id,
      poolType: 'accountTx', player: profile.name,
      type: 'deposit', amount: ch.units * profile.unitSize,
      note: `Stake refunded \u2014 ${challengeMarketTxt(ch)}`,
      relatedChallengeId: ch.id,
      timestamp: new Date().toISOString()
    };
    allPicks.push(refundTx);
  }
  try { await savePicks(allPicks); render(); }
  catch (e) { allPicks.splice(idx, 0, removed); if (refundTx) allPicks.pop(); alert("Couldn't delete (" + describeFetchError(e) + ") — try again."); }
}

function generateHouseChallenges(limit) {
  const pool = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      const spreadVal = computeSpread(lg.id, g);
      if (spreadVal !== null) {
        const side = Math.random() < 0.5 ? g.home : g.away;
        const line = side === g.home ? spreadVal : -spreadVal;
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'spread', side, line, spreadLabel: spreadLabelForSide(lg.id, g, side) });
      }
      const totalVal = g.overUnder;
      if (totalVal !== null && totalVal !== undefined) {
        const side = Math.random() < 0.5 ? 'OVER' : 'UNDER';
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'total', side, line: totalVal, spreadLabel: null });
      }
    });
  });
  const existingKeys = new Set(
    allPicks.filter(p => p.poolType === 'challenge' && p.creator === 'House' && p.status === 'open')
      .map(p => p.gameId + '_' + p.betType)
  );
  const fresh = pool.filter(o => !existingKeys.has(o.gameId + '_' + o.betType));
  for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
  const chosen = fresh.slice(0, limit || 100);
  return chosen.map(o => ({
    id: 'house_challenge_' + o.gameId + '_' + o.betType + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    poolType: 'challenge', creator: 'House',
    sport: o.sport, gameId: o.gameId, gameLabel: o.gameLabel,
    betType: o.betType, sideAbbr: o.side, units: 1 + Math.floor(Math.random() * 3), line: o.line, spreadLabel: o.spreadLabel,
    visibility: 'public', targetFriend: null, status: 'open', acceptedBy: null,
    timestamp: new Date().toISOString()
  }));
}

function myChallengeOutcome(ch) {
  if (ch.status !== 'accepted') return null;
  const r = settlePick(ch);
  if (r.status === 'pending') return null;
  if (r.status === 'push') return 'push';
  const iAmCreator = ch.creator === profile.name;
  // ch.sideAbbr/line/spreadLabel represent the side the ACCEPTOR receives; the creator implicitly holds the opposite.
  if (r.status === 'win') return iAmCreator ? 'loss' : 'win';
  return iAmCreator ? 'win' : 'loss';
}
function convertedUnitsForViewer(ch) {
  // What it would actually cost the current viewer to accept this, preserving real-dollar equivalence with
  // what the creator staked. Falls back to the raw unit count if either side hasn't set a unit size — there's
  // no dollar basis to convert from/to in that case, so we can't do better than showing the number as posted.
  if (!ch.creatorUnitSize || !profile.unitSize) return ch.units;
  return Math.round((ch.units * ch.creatorUnitSize / profile.unitSize) * 100) / 100;
}
function displayUnitsFor(ch) {
  const iAmCreator = ch.creator === profile.name;
  if (iAmCreator) return ch.units;
  if (ch.status === 'accepted') return ch.acceptorUnits != null ? ch.acceptorUnits : ch.units;
  return convertedUnitsForViewer(ch); // still open — show what it would actually cost me to accept
}
function requireUnitSize(actionLabel) {
  if (profile.unitSize) return true;
  alert(`Set today's risk amount above $0 before you can ${actionLabel || 'do this'}. You'll get asked for this each day the app opens.`);
  return false;
}
function requireFunded(actionLabel) {
  if (accountBalanceFor(profile.name) > 0) return true;
  alert(`Your Account balance is $0. Deposit funds before you can ${actionLabel || 'do this'} \u2014 tap your balance in the top right to add some.`);
  return false;
}
function computeChallengeProfit(ch, iAmCreator) {
  const r = settlePick(ch);
  if (r.status === 'pending') return null;
  if (r.status === 'push') return 0;
  const offeredSideWon = r.status === 'win';
  const iWin = iAmCreator ? !offeredSideWon : offeredSideWon;
  const mult = ch.oddsMultiplier || 1;
  const myStake = iAmCreator ? ch.units : (ch.acceptorUnits != null ? ch.acceptorUnits : ch.units);
  if (iWin) return iAmCreator ? myStake : myStake * mult;
  return -myStake;
}

function parseSpreadLabel(label) {

}
function settlePick(p) {
  if (p.settledResult) return p.settledResult;
  if (p.propType === 'player') return { status: 'pending' }; // resolved by persistNewlySettledPlayerProps
  if (p.propType === 'golf_h2h') return { status: 'pending' }; // resolved by persistNewlySettledGolfH2H
  if (p.propType === 'combo_pool') return { status: 'pending' }; // resolved by persistNewlySettledComboPool
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };

  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else outcome = p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss');
  } else {
    const spreadVal = parseSpreadLabel(p.spreadLabel);
    if (spreadVal !== null) {

      const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
      const margin = (teamScore - oppScore) + spreadVal;
      outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
    } else {
      const winnerAbbr = homeScore > awayScore ? g.home : (awayScore > homeScore ? g.away : null);
      outcome = winnerAbbr === null ? 'push' : (winnerAbbr === p.sideAbbr ? 'win' : 'loss');

}
function computePoolPayouts(pool) {
  const participants = pool.participants || [];
  if (!participants.length) return [];
  const scored = participants.map(p => ({ name: p.name, ...poolParticipantScore(pool, p) }));
  if (scored.some(s => !s.allSettled)) return null; // not everyone's games are final yet
  const purse = pool.buyInDollars * participants.length;
  const perSlot = purse / pool.paidPositions;
  scored.sort((a,b) => b.total - a.total);
  const payouts = [];
  let slotIndex = 0, i = 0;
  while (i < scored.length && slotIndex < pool.paidPositions) {
    let j = i;
    while (j < scored.length && scored[j].total === scored[i].total) j++;
    const tierSize = j - i;
    const tierStartSlot = slotIndex;
    const tierEndSlot = Math.min(slotIndex + tierSize, pool.paidPositions) - 1;
    if (tierEndSlot >= tierStartSlot) {
      const slotsCovered = tierEndSlot - tierStartSlot + 1;
      const perPerson = (slotsCovered * perSlot) / tierSize;
      for (let k = i; k < j; k++) payouts.push({ name: scored[k].name, amount: perPerson });
    }
    slotIndex += tierSize;
    i = j;
  }
  return payouts;
}

function parseGolfScore(s) {

async function persistNewlySettledGolfH2H() {
  let changed = false;
  const toCheck = allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'golf_h2h' && !p.settledResult && (p.status === 'open' || p.status === 'accepted'));
  if (!toCheck.length) return false;
  const field = await fetchGolfField(false);
  if (!field || !field.completed) return false; // only settle once the tournament itself is final
  for (const p of toCheck) {
    const a = findGolferByName(field, p.playerA);
    const b = findGolferByName(field, p.playerB);
    if (!a || !b) { if (!p.playerNotFound) { p.playerNotFound = true; changed = true; } continue; }
    const round = p.round || 'total';
    let aScore, bScore, cutRuleApplied = false, winnerName = null;

    if ((round === 'r3' || round === 'r4' || round === 'total') && a.missedCut !== b.missedCut) {
      // One player made the cut, the other didn't — whoever made the cut automatically wins this bet.
      winnerName = a.missedCut ? p.playerB : p.playerA;
      cutRuleApplied = true;
    } else if (round === 'r1') { aScore = a.roundScores[0]; bScore = b.roundScores[0]; }
    else if (round === 'r2') { aScore = a.roundScores[1]; bScore = b.roundScores[1]; }
    else if (round === 'r3') { aScore = a.roundScores[2]; bScore = b.roundScores[2]; }
    else if (round === 'r4') { aScore = a.roundScores[3]; bScore = b.roundScores[3]; }

    if (!cutRuleApplied) {

        if (!p.playerNotFound) { p.playerNotFound = true; changed = true; }
        continue;
      }
      if (aScore === bScore) { p.settledResult = { status: 'push' }; changed = true; continue; }
      winnerName = aScore < bScore ? p.playerA : p.playerB; // lower score wins
    }

    const outcome = winnerName === p.sideAbbr ? 'win' : 'loss';
    p.settledResult = { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
    p.finalScores = { [p.playerA]: aScore !== undefined ? aScore : a.score, [p.playerB]: bScore !== undefined ? bScore : b.score };
    changed = true;
  }
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* best-effort; retry next cycle */ } }
  return changed;
}

function currentProfit(name) {
  return poolOnly(allPicks.filter(p => p.player === name)).reduce((s,p) => {
    const r = settlePick(p);
    if (r.status === 'win' || r.status === 'loss') return s + r.profit;
    return s;
  }, 0);
}
function potentialProfit(name) {
  return poolOnly(allPicks.filter(p => p.player === name)).reduce((s,p) => {
    const r = settlePick(p);
    if (r.status === 'win' || r.status === 'loss') return s + r.profit;
    if (r.status === 'pending') return s + potentialWin(p);
    return s;
  }, 0);
}
function rankAmong(valueForName) {
  const pool = players.length ? players.slice() : [profile.name];
  if (!pool.includes(profile.name)) pool.push(profile.name);
  const arr = pool.map(name => ({ name, val: valueForName(name) }));
  arr.sort((a,b) => b.val - a.val);
  const idx = arr.findIndex(x => x.name === profile.name);
  return { rank: idx + 1, total: arr.length };
}

function isOrphaned(p) { if (p.poolType === 'kalshi' || p.poolType === 'tracker' || p.poolType === 'mulligan' || p.poolType === 'swipeSkip' || p.poolType === 'swipeCartItem' || p.poolType === 'accountTx' || p.poolType === 'comment' || p.poolType === 'friendRequest') return false; return !gameIndex[p.gameId]; }

async function deletePick(pickId) {
  const idx = allPicks.findIndex(p => p.id === pickId);
  if (idx === -1) return;
  const removed = allPicks.splice(idx, 1)[0];
  try {
    await savePicks(allPicks);
    render();
  } catch (e) {
    allPicks.splice(idx, 0, removed);
    alert("Couldn't delete that bet (" + describeFetchError(e) + ") — try again.");
    render();
  }
}
async function clearOrphanedPicks() {
  const kept = allPicks.filter(p => !isOrphaned(p));
  const removedCount = allPicks.length - kept.length;
  const prevPicks = allPicks;
  allPicks = kept;
  try {
    await savePicks(allPicks);
    render();
  } catch (e) {
    allPicks = prevPicks;
    alert("Couldn't clear those bets (" + describeFetchError(e) + ") — try again.");
    render();
  }
}

function pickDate(p) {
  const idx = gameIndex[p.gameId];
  return idx ? new Date(idx.game.start) : new Date(p.timestamp);
}
function sortPicks(list, mode) {
  const arr = list.slice();
  if (mode === 'date_desc') arr.sort((a,b) => pickDate(b) - pickDate(a));
  else if (mode === 'date_asc') arr.sort((a,b) => pickDate(a) - pickDate(b));
  else if (mode === 'units_desc') arr.sort((a,b) => b.units - a.units);
  else if (mode === 'units_asc') arr.sort((a,b) => a.units - b.units);
  return arr;
}

function settledPicksSorted(name) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), start: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .sort((a, b) => a.start - b.start);
}
function recordFor(entries) {
  let w = 0, l = 0, net = 0;
  entries.forEach(x => { if (x.r.status === 'win') { w++; net += x.r.profit; } else { l++; net += x.r.profit; } });
  const total = w + l;
  return { w, l, total, winPct: total ? (w / total) * 100 : 0, net };
}
function winPctTrendSVG(entries) {
  if (!entries.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, h = 130, padL = 30, padR = 8, padT = 10, padB = 18;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  let wins = 0;
  const pts = entries.map((x, i) => { if (x.r.status === 'win') wins++; return { x: i, y: (wins / (i + 1)) * 100 }; });
  const n = pts.length;
  const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const yScale = pct => padT + innerH - (pct / 100) * innerH;
  const d = pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(pt.y).toFixed(1)}`).join(' ');
  const y50 = padT + innerH / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${y50}" x2="${padL + innerW}" y2="${y50}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${padT + 6}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">100</text>
    <text x="6" y="${y50 + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">50</text>
    <text x="10" y="${padT + innerH + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">0</text>
    <path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2"/>
  </svg>`;
}
function leagueBarsSVG(rows) {
  if (!rows.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, rowH = 26, h = rows.length * rowH + 8;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.net)));
  const mid = w / 2, halfTrack = w / 2 - 56;
  let bars = '';
  rows.forEach((r, i) => {
    const y = 6 + i * rowH;
    const barW = (Math.abs(r.net) / maxAbs) * halfTrack;
    const x = r.net >= 0 ? mid : mid - barW;
    const color = r.net > 0 ? 'var(--accent)' : (r.net < 0 ? 'var(--danger)' : 'var(--text-faint)');
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="14" rx="2" style="fill:${color}"/>`;
    bars += `<text x="6" y="${y + 11}" font-size="10.5" style="fill:var(--text-dim)" font-family="var(--font-head)" font-weight="700">${r.label}</text>`;
    bars += `<text x="${w - 6}" y="${y + 11}" font-size="10.5" text-anchor="end" style="fill:var(--text)" font-family="var(--font-mono)">${fmtUnits(r.net)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${mid}" y1="0" x2="${mid}" y2="${h}" style="stroke:var(--border)"/>
    ${bars}
  </svg>`;
}

function filteredSettledFor(name, dateMode, leagueId) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), date: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .filter(x => inDateRange(x.date, dateMode))
    .filter(x => leagueId === null || x.p.sport === leagueId);
}

function renderLeaderboard() {
  const wrap = el('div');
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);

  // date range chips
  const dateScroller = el('div', 'league-scroller');
  [['day','Today'], ['week','This week'], ['year','This year'], ['all','All-time']].forEach(([mode,label]) => {
    const pill = el('button', 'league-pill' + (lbDateMode === mode ? ' active' : ''), label);
    pill.onclick = () => { lbDateMode = mode; render(); };
    dateScroller.appendChild(pill);
  });
  wrap.appendChild(dateScroller);

  // league filter chips
  const leaguesPresent = [...new Set(poolOnly(allPicks).map(p => p.sport))];
  if (leaguesPresent.length) {
    const leagueScroller = el('div', 'league-scroller');
    const allPill = el('button', 'league-pill' + (lbLeagueFilter === null ? ' active' : ''), 'All leagues');
    allPill.onclick = () => { lbLeagueFilter = null; render(); };
    leagueScroller.appendChild(allPill);
    leaguesPresent.forEach(sport => {
      const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
      const pill = el('button', 'league-pill' + (lbLeagueFilter === sport ? ' active' : ''), label);
      pill.onclick = () => { lbLeagueFilter = sport; render(); };
      leagueScroller.appendChild(pill);
    });
    wrap.appendChild(leagueScroller);
  }

  const ranked = names.map(name => {
    const entries = filteredSettledFor(name, lbDateMode, lbLeagueFilter);
    const rec = recordFor(entries);
    return { name, profit: rec.net, rec };
  }).sort((a,b) => b.profit - a.profit);

  if (!ranked.length || ranked.every(r => r.rec.total === 0)) {
    wrap.appendChild(el('div', 'empty', 'No settled bets in this range yet.'));
    wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount.'));
    return wrap;
  }
  ranked.forEach((r, i) => {
    const row = el('div', 'lb-row' + (profile && r.name === profile.name ? ' me' : ''));
    row.appendChild(el('div', 'lb-rank' + (i === 0 && r.profit > 0 ? ' first' : ''), (i+1).toString()));
    const nameWrap = el('div', 'lb-name', r.name);
    row.appendChild(nameWrap);
    row.appendChild(el('div', 'lb-record', `${r.rec.w}-${r.rec.l}`));
    row.appendChild(el('div', 'lb-profit ' + (r.profit > 0 ? 'pos' : r.profit < 0 ? 'neg' : ''), fmtUnits(r.profit)));
    wrap.appendChild(row);
  });
  wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount. Scores are checked live from ESPN, so standings update automatically as games finish.'));
  return wrap;
}

(async function init() {
  loadProfile();
  loadSession();
  appSection = 'pools';
  activeTab = 'existing';
  existingChallengeView = 'friends';
  challengeBrowseMode = 'swipe';
  openChallengeLeague = null;
  openChallengeTypeFilter = 'all';
  openChallengeDateFilter = 'today';
  swipeStackInitialized = false;

  if (profile && session) {
    const ok = await ensureFreshSession().catch(() => false);
    if (!ok) { profile = null; clearSession(); }
  } else if (profile && !session) {
    profile = null; // stale profile cache with no real session behind it (from before real auth existed)
  }

  if (profile) {
    try {
      const g = await loadGlobalData();
      players = g.players; allPicks = g.picks; dailySlateData = g.dailySlate;
    } catch (e) {
      setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
    }
  }
  render();

  if (profile) {
    (async () => {
      try {
        await migrateLegacyWeeklyPicks();
        await cleanupStaleHouseBets();
        await cleanupAcceptedChallengesOnce();
        await cleanupAllOpenAndAcceptedChallengesOnce();
        await cleanupHouseChallengesOnce();
        await resetMyAccountOnce();
        if (!players.includes(profile.name)) { players.push(profile.name); await savePlayers(players); }
        await refreshGameLists();

        startPolling();
        startLiveScoreChecks();
        render();
      } catch (e) {
        setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
        render();
      }
    })();
  }
  render();
})();
</script>
