async function deleteChallenge(ch) {
  if (ch.status !== 'open') return; // can only withdraw a challenge before someone accepts it
  if (!confirm('Delete this challenge permanently? Your reserved stake will be refunded.')) return;
  const idx = allPicks.findIndex(p => p.id === ch.id);
  if (idx === -1) return;
  const removed = allPicks.splice(idx, 1)[0];
  const refundTx = {
    id: profile.name + '_accounttx_refund_' + ch.id,
    poolType: 'accountTx', player: profile.name,
    type: 'deposit', amount: ch.units,
    note: `Stake refunded \u2014 ${challengeMarketTxt(ch)}`,
    relatedChallengeId: ch.id,
    timestamp: new Date().toISOString()
  };
  allPicks.push(refundTx);
  try { await savePicks(allPicks); render(); }
  catch (e) { allPicks.splice(idx, 0, removed); if (refundTx) allPicks.pop(); alert("Couldn't delete (" + describeFetchError(e) + ") — try again."); }
}

function generateHouseChallenges(limit) {
  const pool = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      const spreadVal = computeSpread(lg.id, g);
      if (spreadVal !== null) {
        const side = Math.random() < 0.5 ? g.home : g.away;
        const line = side === g.home ? spreadVal : -spreadVal;
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'spread', side, line, spreadLabel: spreadLabelForSide(lg.id, g, side) });
      }
      const totalVal = g.overUnder;
      if (totalVal !== null && totalVal !== undefined) {
        const side = Math.random() < 0.5 ? 'OVER' : 'UNDER';
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'total', side, line: totalVal, spreadLabel: null });
      }
    });
  });
  const existingKeys = new Set(
    allPicks.filter(p => p.poolType === 'challenge' && p.creator === 'House' && p.status === 'open')
      .map(p => p.gameId + '_' + p.betType)
  );
  const fresh = pool.filter(o => !existingKeys.has(o.gameId + '_' + o.betType));
  for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
  const chosen = fresh.slice(0, limit || 100);
  return chosen.map(o => ({
    id: 'house_challenge_' + o.gameId + '_' + o.betType + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    poolType: 'challenge', creator: 'House',
    sport: o.sport, gameId: o.gameId, gameLabel: o.gameLabel,
    betType: o.betType, sideAbbr: o.side, units: 1 + Math.floor(Math.random() * 3), line: o.line, spreadLabel: o.spreadLabel,
    visibility: 'public', targetFriend: null, status: 'open', acceptedBy: null,
    timestamp: new Date().toISOString()
  }));
}

function attachCardGesture(card, opts) {
  const { stampAccept, stampDecline, onSwipeRight, onSwipeLeft, onTap } = opts;
  let startX = 0, startY = 0, currentX = 0, dragging = false, locked = null; // locked: 'x' | 'y' | null
  card.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; currentX = 0; dragging = true; locked = null;
    card.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (locked === 'x') {
      e.preventDefault(); // this is a horizontal swipe — don't let the page also scroll
      currentX = dx;
      card.style.transform = `translateX(${currentX}px) rotate(${currentX / 20}deg)`;
      if (stampAccept) { stampAccept.style.opacity = currentX > 20 ? String(Math.min(1, currentX / 100)) : '0'; }
      if (stampDecline) { stampDecline.style.opacity = currentX < -20 ? String(Math.min(1, -currentX / 100)) : '0'; }
    }
    // locked === 'y' — do nothing, let the browser handle vertical scroll/pull-to-refresh natively
  }, { passive: false });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (locked === 'x') {
      card.style.transition = 'transform 0.25s ease';
      if (currentX > 100) { card.style.transform = `translateX(600px) rotate(30deg)`; setTimeout(onSwipeRight, 150); }
      else if (currentX < -100) { card.style.transform = `translateX(-600px) rotate(-30deg)`; setTimeout(onSwipeLeft, 150); }
      else {
        card.style.transform = 'translateX(0) rotate(0)';
        if (stampAccept) stampAccept.style.opacity = '0';
        if (stampDecline) stampDecline.style.opacity = '0';
      }
    } else if (locked === null && onTap) {

}

    elm.style.fontSize = size + 'px';
    guard++;

}

function isMyGroupChallenge(ch) {

function pendingFriendChallengesForMe() {

    (p.visibility === 'friend' && p.targetFriend === profile.name) ||
    isMyGroupChallenge(p)

}
let seenFriendChallengeIds = null;
function getSeenFriendChallengeIds() {
  if (seenFriendChallengeIds) return seenFriendChallengeIds;
  try { seenFriendChallengeIds = new Set(JSON.parse(localStorage.getItem('ww_seen_friend_challenges') || '[]')); }
  catch (e) { seenFriendChallengeIds = new Set(); }
  return seenFriendChallengeIds;
}
function unseenPendingFriendChallenges() {

}

  if (changed) { try { localStorage.setItem('ww_seen_friend_challenges', JSON.stringify([...seen])); } catch (e) {} }
}
function renderExistingChallenges() {
  const all = allPicks.filter(p => p.poolType === 'challenge' && p.propType !== 'combo_pool');

  const publicOpenAll = all.filter(ch => ch.visibility === 'public' && stillActive(ch));
  const publicOpen = publicOpenAll.filter(ch => ch.creator !== profile.name);
  const reviewableBase = publicOpen.filter(ch => ch.acceptedBy !== profile.name && !cartIdsForCount.has(ch.id) && !declinedIdsForCount.has(ch.id));

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  function matchesDateFilterVal(gd, dateVal) {
    if (!gd) return true;
    if (dateVal === 'today') {
      return gd.getFullYear() === now.getFullYear() && gd.getMonth() === now.getMonth() && gd.getDate() === now.getDate();
    }
    if (dateVal === 'tomorrow') {
      const tmrw = new Date(startOfToday); tmrw.setDate(tmrw.getDate() + 1);
      return gd.getFullYear() === tmrw.getFullYear() && gd.getMonth() === tmrw.getMonth() && gd.getDate() === tmrw.getDate();
    }
    const weekEnd = new Date(startOfToday); weekEnd.setDate(weekEnd.getDate() + 7);
    return gd >= startOfToday && gd < weekEnd;
  }
  function resolvedDate(ch) {
    const idx = gameIndex[ch.gameId];
    if (idx && idx.game && idx.game.start) return new Date(idx.game.start);
    if (ch.propType === 'golf_h2h' && golfFieldCache && golfFieldCache.tournamentId === ch.tournamentId && golfFieldCache.date) return new Date(golfFieldCache.date);
    return null;
  }
  function matchesTypeVal(ch, typeVal) {
    if (typeVal === 'all') return true;
    if (typeVal === 'player') return ch.propType === 'player';
    if (typeVal === 'moneyline') return ch.propType === 'golf_h2h' || ch.betType === 'moneyline' || (ch.betType === 'spread' && !ch.propType && !ch.spreadLabel);
    if (typeVal === 'spread') return !ch.propType && ch.betType === 'spread' && !!ch.spreadLabel;
    return !ch.propType && ch.betType === typeVal;
  }
  // Applies every filter, letting one dimension be overridden — used to compute "if I picked this option instead,

  function applyFilters(o) {

    const typeVal = 'type' in o ? o.type : openChallengeTypeFilter;

    const pill = el('button', 'league-pill' + (openChallengeLeague === golfMeta.id ? ' active' : ''), count > 0 ? `${golfMeta.label} (${count})` : golfMeta.label);
    pill.onclick = () => { openChallengeLeague = golfMeta.id; swipeStackInitialized = false; render(); };
    leagueScroller.appendChild(pill);
  }

  const dateScroller = el('div', 'league-scroller');
  [['week','All Week'],['today','Today'],['tomorrow','Tomorrow']].forEach(([id,label]) => {
    const count = applyFilters({ date: id }).length;

function myChallengeOutcome(ch) {

  // ch.sideAbbr/line/spreadLabel represent the side the ACCEPTOR receives; the creator implicitly holds the opposite.

}

      const profit = computeChallengeProfit(ch, isCreator);
      if (profit === null) return;
      if (profit > 0) stats[name].wins++;
      else if (profit < 0) stats[name].losses++;
      stats[name].units += profit;
    });

  allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'combo_pool' && p.status === 'settled' && new Date(p.timestamp) >= periodStart).forEach(pool => {
    (pool.participants || []).forEach(pt => {

      const score = poolParticipantScore(pool, pt).total;
      if (payout && payout.placed) stats[pt.name].wins++;
      else stats[pt.name].losses++;
      stats[pt.name].units += score;
    });
  });

  allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'golf_team' && p.status === 'settled' && new Date(p.timestamp) >= periodStart).forEach(pool => {
    (pool.participants || []).forEach(pt => {
      if (!memberNames.has(pt.name)) return;
      const payout = (pool.payouts || []).find(po => po.name === pt.name);
      const result = computeGolfTeamParticipantScore(pool, pt);
      if (result.total === null) return;
      if (payout && payout.placed) stats[pt.name].wins++;
      else stats[pt.name].losses++;

}
function computeH2HStats(nameA, nameB, resetAt) {
  const periodStart = new Date(resetAt || '1970-01-01T00:00:00.000Z');
  const stats = { [nameA]: { wins: 0, units: 0 }, [nameB]: { wins: 0, units: 0 } };
  allPicks.filter(p => p.poolType === 'challenge' && p.propType !== 'combo_pool' && p.propType !== 'golf_team' && p.status === 'accepted' && new Date(p.timestamp) >= periodStart &&
    ((p.creator === nameA && p.acceptedBy === nameB) || (p.creator === nameB && p.acceptedBy === nameA))
  ).forEach(ch => {
    const profitCreator = computeChallengeProfit(ch, true);
    const profitAcceptor = computeChallengeProfit(ch, false);
    if (profitCreator === null || profitAcceptor === null) return;
    if (profitCreator > 0) stats[ch.creator].wins++;
    else if (profitAcceptor > 0) stats[ch.acceptedBy].wins++;
    stats[ch.creator].units += profitCreator;
    stats[ch.acceptedBy].units += profitAcceptor;

  allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'combo_pool' && p.status === 'settled' && new Date(p.timestamp) >= periodStart &&
    (p.participants || []).some(pt => pt.name === nameA) && (p.participants || []).some(pt => pt.name === nameB)
  ).forEach(pool => {
    const scoreA = poolParticipantScore(pool, pool.participants.find(pt => pt.name === nameA)).total;
    const scoreB = poolParticipantScore(pool, pool.participants.find(pt => pt.name === nameB)).total;
    stats[nameA].units += scoreA;
    stats[nameB].units += scoreB;
    if (scoreA > scoreB) stats[nameA].wins++;
    else if (scoreB > scoreA) stats[nameB].wins++;
  });
  allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'golf_team' && p.status === 'settled' && new Date(p.timestamp) >= periodStart &&
    (p.participants || []).some(pt => pt.name === nameA) && (p.participants || []).some(pt => pt.name === nameB)
  ).forEach(pool => {
    const scoreA = computeGolfTeamParticipantScore(pool, pool.participants.find(pt => pt.name === nameA)).total;
    const scoreB = computeGolfTeamParticipantScore(pool, pool.participants.find(pt => pt.name === nameB)).total;
    if (scoreA === null || scoreB === null) return;

async function checkGroupThreshold(grp, stats) {
  if (!grp.winThreshold) return false;
  const ranked = Object.keys(stats).map(name => ({ name, units: stats[name].units })).sort((a,b) => b.units - a.units);
  if (!ranked.length) return false;
  const leader = ranked[0];
  if (leader.units < grp.winThreshold) return false;
  const idx = allPicks.findIndex(p => p.id === grp.id);
  if (idx === -1) return false;
  const nowIso = new Date().toISOString();
  const prevMatchWins = { ...(grp.matchWins || {}) };
  const newMatchWins = { ...prevMatchWins, [leader.name]: (prevMatchWins[leader.name] || 0) + 1 };
  allPicks[idx].matchWins = newMatchWins;
  allPicks[idx].leaderboardResetMode = 'manual';
  allPicks[idx].leaderboardPeriodStart = nowIso;
  try { await savePicks(allPicks); return true; }
  catch (e) { allPicks[idx].matchWins = prevMatchWins; return false; }
}

async function checkH2HThreshold(tracker, nameA, nameB, stats) {
  if (!tracker || !tracker.winThreshold) return false;
  const leaderName = stats[nameA].units > stats[nameB].units ? nameA : (stats[nameB].units > stats[nameA].units ? nameB : null);
  if (!leaderName) return false;
  const leaderUnits = Math.max(stats[nameA].units, stats[nameB].units);
  if (leaderUnits < tracker.winThreshold) return false;
  const idx = allPicks.findIndex(p => p.id === tracker.id);
  if (idx === -1) return false;
  const nowIso = new Date().toISOString();
  const prevMatchWins = { ...(tracker.matchWins || {}) };
  const newMatchWins = { ...prevMatchWins, [leaderName]: (prevMatchWins[leaderName] || 0) + 1 };
  allPicks[idx].matchWins = newMatchWins;
  allPicks[idx].resetAt = nowIso;
  try { await savePicks(allPicks); return true; }
  catch (e) { allPicks[idx].matchWins = prevMatchWins; allPicks[idx].resetAt = tracker.resetAt; return false; }
}

function parseSpreadLabel(label) {

function settlePick(p) {

  if (p.propType === 'player') return { status: 'pending' }; // resolved by persistNewlySettledPlayerProps
  if (p.propType === 'golf_h2h') return { status: 'pending' }; // resolved by persistNewlySettledGolfH2H
  if (p.propType === 'combo_pool') return { status: 'pending' }; // resolved by persistNewlySettledComboPool
  if (p.propType === 'golf_team') return { status: 'pending' }; // resolved by persistNewlySettledGolfTeamPool
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };

  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else outcome = p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss');
  } else {
    const spreadVal = parseSpreadLabel(p.spreadLabel);
    if (spreadVal !== null) {
      const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
      const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
      const margin = (teamScore - oppScore) + spreadVal;
      outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
    } else {
      const winnerAbbr = homeScore > awayScore ? g.home : (awayScore > homeScore ? g.away : null);
      outcome = winnerAbbr === null ? 'push' : (winnerAbbr === p.sideAbbr ? 'win' : 'loss');

function computePoolPayouts(pool) {

  const scored = participants.map(p => ({ name: p.name, ...poolParticipantScore(pool, p) }));
  if (scored.some(s => !s.allSettled)) return null; // not everyone's games are final yet
  scored.sort((a,b) => b.total - a.total);
  const placements = [];
  let slotIndex = 0, i = 0;
  while (i < scored.length && slotIndex < pool.paidPositions) {
    let j = i;
    while (j < scored.length && scored[j].total === scored[i].total) j++;
    const tierSize = j - i;
    const tierStartSlot = slotIndex;
    const tierEndSlot = Math.min(slotIndex + tierSize, pool.paidPositions) - 1;
    if (tierEndSlot >= tierStartSlot) {
      for (let k = i; k < j; k++) placements.push({ name: scored[k].name, placed: true });
    }

  }

}

async function fetchGolfField(forceRefresh) {

    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard');

async function persistNewlySettledGolfH2H() {
  let changed = false;
  const toCheck = allPicks.filter(p => p.poolType === 'challenge' && p.propType === 'golf_h2h' && !p.settledResult && (p.status === 'open' || p.status === 'accepted'));
  if (!toCheck.length) return false;
  const field = await fetchGolfField(false);
  if (!field || !field.completed) return false; // only settle once the tournament itself is final
  for (const p of toCheck) {
    const a = findGolferByName(field, p.playerA);
    const b = findGolferByName(field, p.playerB);
    if (!a || !b) { if (!p.playerNotFound) { p.playerNotFound = true; changed = true; } continue; }
    const round = p.round || 'total';
    let aScore, bScore, cutRuleApplied = false, winnerName = null;

    if ((round === 'r3' || round === 'r4' || round === 'total') && a.missedCut !== b.missedCut) {
      // One player made the cut, the other didn't — whoever made the cut automatically wins this bet.
      winnerName = a.missedCut ? p.playerB : p.playerA;
      cutRuleApplied = true;
    } else if (round === 'r1') { aScore = a.roundScores[0]; bScore = b.roundScores[0]; }
    else if (round === 'r2') { aScore = a.roundScores[1]; bScore = b.roundScores[1]; }
    else if (round === 'r3') { aScore = a.roundScores[2]; bScore = b.roundScores[2]; }
    else if (round === 'r4') { aScore = a.roundScores[3]; bScore = b.roundScores[3]; }
    else { aScore = a.score; bScore = b.score; }

    if (!cutRuleApplied) {
      if (aScore === null || aScore === undefined || bScore === null || bScore === undefined) {
        if (!p.playerNotFound) { p.playerNotFound = true; changed = true; }
        continue;
      }
      if (aScore === bScore) { p.settledResult = { status: 'push' }; changed = true; continue; }
      winnerName = aScore < bScore ? p.playerA : p.playerB; // lower score wins
    }

    const outcome = winnerName === p.sideAbbr ? 'win' : 'loss';
    p.settledResult = { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
    p.finalScores = { [p.playerA]: aScore !== undefined ? aScore : a.score, [p.playerB]: bScore !== undefined ? bScore : b.score };
    changed = true;
  }
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* best-effort; retry next cycle */ } }
  return changed;
}

  return wrap;
}

function renderPickRow(p) {
  const r = settlePick(p);
  const row = el('div', 'pick-row');
  const left = el('div');
  const leagueLabel = (LEAGUES_META.find(l => l.id === p.sport) || {}).label || (p.sport || 'sport').toUpperCase();
  const orphanTag = isOrphaned(p) ? ' <span style="color:var(--danger);font-size:9.5px;text-transform:uppercase;">orphaned</span>' : '';
  left.appendChild(el('div', 'who', `<span class="pick-league">${leagueLabel}</span> ${p.gameLabel}${orphanTag}`));
  const marketTxt = p.betType === 'total'
    ? (p.sideAbbr === 'OVER' ? 'Over' : 'Under') + ' ' + p.line
    : p.sideAbbr + (pickSpreadDisplay(p) ? ' ' + pickSpreadDisplay(p) : '');
  left.appendChild(el('div', 'detail', `${marketTxt} · ${p.units}u risked`));
  row.appendChild(left);
  const rightWrap = el('div');
  rightWrap.style.display = 'flex';
  rightWrap.style.alignItems = 'center';
  rightWrap.style.gap = '10px';
  let resultHtml = '', cls = 'pending';
  if (r.status === 'win') { resultHtml = fmtUnits(r.profit) + '<span class="sub">Won</span>'; cls = 'win'; }
  else if (r.status === 'loss') { resultHtml = fmtUnits(r.profit) + '<span class="sub">Lost</span>'; cls = 'loss'; }
  else if (r.status === 'push') { resultHtml = 'Push<span class="sub">Refunded</span>'; cls = 'pending'; }
  else { resultHtml = fmtUnits(potentialWin(p)) + '<span class="sub">If it hits</span>'; cls = 'pending'; }
  rightWrap.appendChild(el('div', 'result ' + cls, resultHtml));
  const delBtn = el('button', null, '✕');
  delBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:26px;height:26px;font-size:12px;';
  delBtn.onclick = () => { if (confirm('Delete this bet? This cannot be undone.')) deletePick(p.id); };
  rightWrap.appendChild(delBtn);
  row.appendChild(rightWrap);
  return row;
}

// ---------- stats analytics ----------
function settledPicksSorted(name) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), start: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .sort((a, b) => a.start - b.start);
}
function recordFor(entries) {
  let w = 0, l = 0, net = 0;
  entries.forEach(x => { if (x.r.status === 'win') { w++; net += x.r.profit; } else { l++; net += x.r.profit; } });
  const total = w + l;
  return { w, l, total, winPct: total ? (w / total) * 100 : 0, net };
}
function winPctTrendSVG(entries) {
  if (!entries.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, h = 130, padL = 30, padR = 8, padT = 10, padB = 18;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  let wins = 0;
  const pts = entries.map((x, i) => { if (x.r.status === 'win') wins++; return { x: i, y: (wins / (i + 1)) * 100 }; });
  const n = pts.length;
  const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const yScale = pct => padT + innerH - (pct / 100) * innerH;
  const d = pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(pt.y).toFixed(1)}`).join(' ');
  const y50 = padT + innerH / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${y50}" x2="${padL + innerW}" y2="${y50}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${padT + 6}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">100</text>
    <text x="6" y="${y50 + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">50</text>
    <text x="10" y="${padT + innerH + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">0</text>
    <path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2"/>
  </svg>`;
}
function leagueBarsSVG(rows) {
  if (!rows.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, rowH = 26, h = rows.length * rowH + 8;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.net)));
  const mid = w / 2, halfTrack = w / 2 - 56;
  let bars = '';
  rows.forEach((r, i) => {
    const y = 6 + i * rowH;
    const barW = (Math.abs(r.net) / maxAbs) * halfTrack;
    const x = r.net >= 0 ? mid : mid - barW;
    const color = r.net > 0 ? 'var(--accent)' : (r.net < 0 ? 'var(--danger)' : 'var(--text-faint)');
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="14" rx="2" style="fill:${color}"/>`;
    bars += `<text x="6" y="${y + 11}" font-size="10.5" style="fill:var(--text-dim)" font-family="var(--font-head)" font-weight="700">${r.label}</text>`;
    bars += `<text x="${w - 6}" y="${y + 11}" font-size="10.5" text-anchor="end" style="fill:var(--text)" font-family="var(--font-mono)">${fmtUnits(r.net)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${mid}" y1="0" x2="${mid}" y2="${h}" style="stroke:var(--border)"/>
    ${bars}
  </svg>`;
}

// ---------- badges ----------
const BADGES = [
  { id: 'first_win', icon: '🏆', label: 'First Blood', desc: 'Win your first bet',
    check: (settled) => settled.some(x => x.r.status === 'win') },
  { id: 'perfect_week', icon: '💯', label: 'Perfect Week', desc: 'Go undefeated in a week (2+ bets)',
    check: (settled) => {
      const byWeek = {};
      settled.forEach(x => { const wk = weekKey(x.start); (byWeek[wk] = byWeek[wk] || []).push(x); });
      return Object.values(byWeek).some(list => list.length >= 2 && list.every(x => x.r.status === 'win'));
    } },
  { id: 'hot_streak', icon: '🔥', label: 'Hot Streak', desc: 'Win 3 bets in a row',
    check: (settled) => {
      let streak = 0, best = 0;
      settled.forEach(x => { if (x.r.status === 'win') { streak++; best = Math.max(best, streak); } else streak = 0; });
      return best >= 3;
    } },
  { id: 'iron_stomach', icon: '💪', label: 'Iron Stomach', desc: 'Risk 5+ units on a single bet',
    check: (settled, mine) => mine.some(p => p.units >= 5) },
  { id: 'diversifier', icon: '🎲', label: 'Diversifier', desc: 'Bet on 3+ leagues in the same week',
    check: (settled, mine) => {
      const byWeek = {};
      mine.forEach(p => { (byWeek[p.week] = byWeek[p.week] || new Set()).add(p.sport); });
      return Object.values(byWeek).some(s => s.size >= 3);
    } },
  { id: 'big_week', icon: '📈', label: 'Big Week', desc: 'Net +5 units in a single week',
    check: (settled) => {
      const byWeek = {};
      settled.forEach(x => { const wk = weekKey(x.start); byWeek[wk] = (byWeek[wk] || 0) + x.r.profit; });
      return Object.values(byWeek).some(v => v >= 5);
    } },
  { id: 'century', icon: '💰', label: 'Century Club', desc: 'Reach +10 net units lifetime',
    check: (settled) => settled.reduce((s, x) => s + x.r.profit, 0) >= 10 },
  { id: 'grinder', icon: '⛏️', label: 'Grinder', desc: 'Place 25 total bets',
    check: (settled, mine) => mine.length >= 25 },
];
function renderBadges(settled, mine) {
  const grid = el('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:8px;';
  BADGES.forEach(b => {
    const earned = b.check(settled, mine);
    const tile = el('div');
    tile.style.cssText = `background:${earned ? 'var(--accent-dark)' : 'var(--surface)'};border:1px solid ${earned ? 'var(--accent)' : 'var(--border)'};border-radius:10px;padding:12px 10px;text-align:center;${earned ? '' : 'opacity:0.5;'}`;
    tile.innerHTML = `<div style="font-size:26px;line-height:1;">${b.icon}</div><div style="font-size:12px;font-weight:800;margin-top:6px;color:${earned ? 'var(--accent)' : 'var(--text-dim)'};">${b.label}</div><div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">${b.desc}</div>`;
    grid.appendChild(tile);
  });
  return grid;
}

function renderStats() {
  const wrap = el('div');
  const entries = settledPicksSorted(profile.name);
  const mine = poolOnly(allPicks.filter(p => p.player === profile.name));

  wrap.appendChild(el('div', 'week-header', 'Badges'));
  wrap.appendChild(renderBadges(entries, mine));

  if (!entries.length) {
    wrap.appendChild(el('div', 'empty', 'No settled bets yet — stats will fill in once games finish.'));
    return wrap;
  }

  const overall = recordFor(entries);
  const overallBanner = el('div', 'rank-banner');
  const oc1 = el('div', 'rank-cell');
  oc1.appendChild(el('div', 'rc-label', 'Record'));
  oc1.appendChild(el('div', 'rc-value', `${overall.w}-${overall.l}`));
  oc1.appendChild(el('div', 'rc-sub', overall.winPct.toFixed(1) + '% win rate'));
  overallBanner.appendChild(oc1);
  const oc2 = el('div', 'rank-cell');
  oc2.appendChild(el('div', 'rc-label', 'Net units'));
  oc2.appendChild(el('div', 'rc-value ' + (overall.net > 0 ? 'accent' : ''), fmtUnits(overall.net)));
  oc2.appendChild(el('div', 'rc-sub', overall.total + ' settled bets'));
  overallBanner.appendChild(oc2);
  wrap.appendChild(overallBanner);

  wrap.appendChild(el('div', 'week-header', 'Win % over time'));
  const trendCard = el('div', 'event-card');
  trendCard.innerHTML = winPctTrendSVG(entries);
  wrap.appendChild(trendCard);

  wrap.appendChild(el('div', 'week-header', 'Rolling record'));
  const rollWrap = el('div', 'rank-banner');
  [10, 20, 50].forEach(n => {
    const recentWindow = entries.slice(-n);
    const rec = recordFor(recentWindow);
    const cell = el('div', 'rank-cell');
    cell.appendChild(el('div', 'rc-label', 'Last ' + n));
    cell.appendChild(el('div', 'rc-value', recentWindow.length ? rec.winPct.toFixed(0) + '%' : '—'));
    cell.appendChild(el('div', 'rc-sub', recentWindow.length ? `${rec.w}-${rec.l} · ${fmtUnits(rec.net)}` : 'not enough yet'));
    rollWrap.appendChild(cell);
  });
  wrap.appendChild(rollWrap);

  wrap.appendChild(el('div', 'week-header', 'By league'));
  const byLeague = {};
  entries.forEach(x => { (byLeague[x.p.sport] = byLeague[x.p.sport] || []).push(x); });
  const leagueRows = Object.keys(byLeague).map(sport => {
    const rec = recordFor(byLeague[sport]);
    const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
    return { label, w: rec.w, l: rec.l, winPct: rec.winPct, net: rec.net };
  }).sort((a, b) => b.net - a.net);

  const table = el('table', 'stats-table');
  table.innerHTML = `<thead><tr><th>League</th><th>Record</th><th>Win%</th><th>Net</th></tr></thead>`;
  const tbody = el('tbody');
  leagueRows.forEach(r => {
    const tr = el('tr');
    tr.innerHTML = `<td>${r.label}</td><td>${r.w}-${r.l}</td><td>${r.winPct.toFixed(0)}%</td><td class="${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : ''}">${fmtUnits(r.net)}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.appendChild(el('div', 'week-header', 'Net units by league'));
  const barsCard = el('div', 'event-card');
  barsCard.innerHTML = leagueBarsSVG(leagueRows.map(r => ({ label: r.label, net: r.net })));
  wrap.appendChild(barsCard);

  return wrap;
}

function filteredSettledFor(name, dateMode, leagueId) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), date: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .filter(x => inDateRange(x.date, dateMode))
    .filter(x => leagueId === null || x.p.sport === leagueId);
}

function renderLeaderboard() {
  const wrap = el('div');
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);

  // date range chips
  const dateScroller = el('div', 'league-scroller');
  [['day','Today'], ['week','This week'], ['year','This year'], ['all','All-time']].forEach(([mode,label]) => {
    const pill = el('button', 'league-pill' + (lbDateMode === mode ? ' active' : ''), label);
    pill.onclick = () => { lbDateMode = mode; render(); };
    dateScroller.appendChild(pill);
  });
  wrap.appendChild(dateScroller);

  // league filter chips
  const leaguesPresent = [...new Set(poolOnly(allPicks).map(p => p.sport))];
  if (leaguesPresent.length) {
    const leagueScroller = el('div', 'league-scroller');
    const allPill = el('button', 'league-pill' + (lbLeagueFilter === null ? ' active' : ''), 'All leagues');
    allPill.onclick = () => { lbLeagueFilter = null; render(); };
    leagueScroller.appendChild(allPill);
    leaguesPresent.forEach(sport => {
      const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
      const pill = el('button', 'league-pill' + (lbLeagueFilter === sport ? ' active' : ''), label);
      pill.onclick = () => { lbLeagueFilter = sport; render(); };
      leagueScroller.appendChild(pill);
    });
    wrap.appendChild(leagueScroller);
  }

  const ranked = names.map(name => {
    const entries = filteredSettledFor(name, lbDateMode, lbLeagueFilter);
    const rec = recordFor(entries);
    return { name, profit: rec.net, rec };
  }).sort((a,b) => b.profit - a.profit);

  if (!ranked.length || ranked.every(r => r.rec.total === 0)) {
    wrap.appendChild(el('div', 'empty', 'No settled bets in this range yet.'));
    wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount.'));
    return wrap;
  }
  ranked.forEach((r, i) => {
    const row = el('div', 'lb-row' + (profile && r.name === profile.name ? ' me' : ''));
    row.appendChild(el('div', 'lb-rank' + (i === 0 && r.profit > 0 ? ' first' : ''), (i+1).toString()));
    const nameWrap = el('div', 'lb-name', r.name);
    row.appendChild(nameWrap);
    row.appendChild(el('div', 'lb-record', `${r.rec.w}-${r.rec.l}`));
    row.appendChild(el('div', 'lb-profit ' + (r.profit > 0 ? 'pos' : r.profit < 0 ? 'neg' : ''), fmtUnits(r.profit)));
    wrap.appendChild(row);
  });
  wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount. Scores are checked live from ESPN, so standings update automatically as games finish.'));
  return wrap;
}

(async function init() {
  loadProfile();
  loadSession();
  loadNavState();
  challengeBrowseMode = 'swipe';
  openChallengeLeague = null;
  openChallengeTypeFilter = 'all';
  openChallengeDateFilter = 'week';
  swipeStackInitialized = false;

  if (profile && session) {
    const ok = await ensureFreshSession().catch(() => false);
    if (!ok) { profile = null; clearSession(); }
  } else if (profile && !session) {
    profile = null; // stale profile cache with no real session behind it (from before real auth existed)
  }

  if (profile) {
    try {
      const g = await loadGlobalData();
      players = g.players; allPicks = g.picks; dailySlateData = g.dailySlate;
    } catch (e) {
      setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
    }
  }
  render();

  if (profile) {
    (async () => {
      try {
        await migrateLegacyWeeklyPicks();
        await cleanupStaleHouseBets();
        await cleanupAcceptedChallengesOnce();
        await cleanupAllOpenAndAcceptedChallengesOnce();
        await cleanupHouseChallengesOnce();
        await resetMyAccountOnce();
        await clearChallengesPoolsAndUnitsOnce();
        if (!players.includes(profile.name)) { players.push(profile.name); await savePlayers(players); }
        await refreshGameLists();

        startPolling();
        startLiveScoreChecks();
        render();
      } catch (e) {
        setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
        render();
      }
    })();
  }
  render();
})();
</script>
