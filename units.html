function attachCardGesture(card, opts) {
  const { stampAccept, stampDecline, onSwipeRight, onSwipeLeft, onTap } = opts;
  let startX = 0, startY = 0, currentX = 0, dragging = false, locked = null; // locked: 'x' | 'y' | null
  card.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; currentX = 0; dragging = true; locked = null;
    card.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (locked === 'x') {
      e.preventDefault(); // this is a horizontal swipe — don't let the page also scroll
      currentX = dx;
      card.style.transform = `translateX(${currentX}px) rotate(${currentX / 20}deg)`;
      if (stampAccept) { stampAccept.style.opacity = currentX > 20 ? String(Math.min(1, currentX / 100)) : '0'; }
      if (stampDecline) { stampDecline.style.opacity = currentX < -20 ? String(Math.min(1, -currentX / 100)) : '0'; }
    }
    // locked === 'y' — do nothing, let the browser handle vertical scroll/pull-to-refresh natively
  }, { passive: false });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (locked === 'x') {
      card.style.transition = 'transform 0.25s ease';
      if (currentX > 100) { card.style.transform = `translateX(600px) rotate(30deg)`; setTimeout(onSwipeRight, 150); }
      else if (currentX < -100) { card.style.transform = `translateX(-600px) rotate(-30deg)`; setTimeout(onSwipeLeft, 150); }
      else {
        card.style.transform = 'translateX(0) rotate(0)';
        if (stampAccept) stampAccept.style.opacity = '0';
        if (stampDecline) stampDecline.style.opacity = '0';
      }
    } else if (locked === null && onTap) {
      onTap();
    }
    currentX = 0; locked = null;
  }
  card.addEventListener('touchend', endDrag);
  card.addEventListener('touchcancel', endDrag);
}

  const iAmCreator = ch.creator === profile.name;
  // ch.sideAbbr/line/spreadLabel represent the side the ACCEPTOR receives; the creator implicitly holds the opposite.

}

  if (leader.units < grp.winThreshold) return false;
  const idx = allPicks.findIndex(p => p.id === grp.id);
  if (idx === -1) return false;
  const nowIso = new Date().toISOString();
  const prevMatchWins = { ...(grp.matchWins || {}) };
  const prevLog = (grp.matchWinLog || []).slice();
  const newMatchWins = { ...prevMatchWins, [leader.name]: (prevMatchWins[leader.name] || 0) + 1 };
  allPicks[idx].matchWins = newMatchWins;
  allPicks[idx].matchWinLog = [...prevLog, { name: leader.name, date: nowIso, periodStart: grp.leaderboardPeriodStart || null }];
  allPicks[idx].leaderboardResetMode = 'manual';
  allPicks[idx].leaderboardPeriodStart = nowIso;
  try { await savePicks(allPicks); return true; }
  catch (e) { allPicks[idx].matchWins = prevMatchWins; allPicks[idx].matchWinLog = prevLog; return false; }
}

function parseSpreadLabel(label) {

function settlePick(p) {
  if (p.settledResult) return p.settledResult;
  if (p.propType === 'player') return { status: 'pending' }; // resolved by persistNewlySettledPlayerProps
  if (p.propType === 'golf_h2h') return { status: 'pending' }; // resolved by persistNewlySettledGolfH2H
  if (p.propType === 'combo_pool') return { status: 'pending' }; // resolved by persistNewlySettledComboPool
  if (p.propType === 'golf_team') return { status: 'pending' }; // resolved by persistNewlySettledGolfTeamPool
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };

  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else outcome = p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss');
  } else {
    const spreadVal = parseSpreadLabel(p.spreadLabel);
    if (spreadVal !== null) {
      const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
      const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
      const margin = (teamScore - oppScore) + spreadVal;
      outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
    } else {
      const winnerAbbr = homeScore > awayScore ? g.home : (awayScore > homeScore ? g.away : null);
      outcome = winnerAbbr === null ? 'push' : (winnerAbbr === p.sideAbbr ? 'win' : 'loss');

function computePoolPayouts(pool) {
  const participants = pool.participants || [];

  const scored = participants.map(p => ({ name: p.name, ...poolParticipantScore(pool, p) }));
  if (scored.some(s => !s.allSettled)) return null; // not everyone's games are final yet
  scored.sort((a,b) => b.total - a.total);
  const placements = [];
  let slotIndex = 0, i = 0;
  while (i < scored.length && slotIndex < pool.paidPositions) {
    let j = i;
    while (j < scored.length && scored[j].total === scored[i].total) j++;
    const tierSize = j - i;
    const tierStartSlot = slotIndex;
    const tierEndSlot = Math.min(slotIndex + tierSize, pool.paidPositions) - 1;
    if (tierEndSlot >= tierStartSlot) {
      for (let k = i; k < j; k++) placements.push({ name: scored[k].name, placed: true });
    }
    slotIndex += tierSize;
    i = j;
  }

}

    const idx = gameIndex[p.gameId];

  mine.forEach(p => {
    const st = gameStatusFor(p);

    else groups.future.push(p);

  [['active','Active'], ['future','Upcoming'], ['past','Settled']].forEach(([key,label]) => {

      wrap.appendChild(el('div', 'empty', 'Nothing here yet.'));
      return;

    const byLeague = {};
    list.forEach(p => { (byLeague[p.sport] = byLeague[p.sport] || []).push(p); });

function settledPicksSorted(name) {

    .map(p => ({ p, r: settlePick(p), start: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')

}
function recordFor(entries) {
  let w = 0, l = 0, net = 0;
  entries.forEach(x => { if (x.r.status === 'win') { w++; net += x.r.profit; } else { l++; net += x.r.profit; } });
  const total = w + l;
  return { w, l, total, winPct: total ? (w / total) * 100 : 0, net };
}
function winPctTrendSVG(entries) {
  if (!entries.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, h = 130, padL = 30, padR = 8, padT = 10, padB = 18;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  let wins = 0;
  const pts = entries.map((x, i) => { if (x.r.status === 'win') wins++; return { x: i, y: (wins / (i + 1)) * 100 }; });
  const n = pts.length;
  const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const yScale = pct => padT + innerH - (pct / 100) * innerH;
  const d = pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(pt.y).toFixed(1)}`).join(' ');
  const y50 = padT + innerH / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${y50}" x2="${padL + innerW}" y2="${y50}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${padT + 6}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">100</text>

}
function leagueBarsSVG(rows) {
  if (!rows.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, rowH = 26, h = rows.length * rowH + 8;

  const mid = w / 2, halfTrack = w / 2 - 56;

  rows.forEach((r, i) => {

  });

// ===================== GAME LOGIC (pure functions) =====================

// ---------- Bowling ----------
function bowlFrames(rolls) {
  rolls = rolls || [];
  const frames = []; let i = 0, total = 0;
  for (let f = 0; f < 10; f++) {
    const fr = { rolls: [], score: null, done: false }; frames.push(fr);
    if (i >= rolls.length) continue;
    if (f < 9) {
      const a = rolls[i];
      if (a === 10) {
        fr.rolls = [10]; fr.done = true;
        const b = rolls[i + 1], c = rolls[i + 2];
        if (b !== undefined && c !== undefined) { total += 10 + b + c; fr.score = total; }
        i += 1;
      } else {
        fr.rolls = [a]; const b = rolls[i + 1];
        if (b !== undefined) {
          fr.rolls.push(b); fr.done = true;
          if (a + b === 10) { const c = rolls[i + 2]; if (c !== undefined) { total += 10 + c; fr.score = total; } }
          else { total += a + b; fr.score = total; }
          i += 2;
        } else i += 1;
      }
    } else {
      const a = rolls[i], b = rolls[i + 1], c = rolls[i + 2];
      fr.rolls = rolls.slice(i, i + 3);
      if (a === 10 || (b !== undefined && a + b === 10)) { if (c !== undefined) { fr.done = true; total += a + b + c; fr.score = total; } }
      else if (b !== undefined) { fr.done = true; total += a + b; fr.score = total; }
    }
  }
  return frames;
}
function bowlMaxNext(rolls) {
  const fr = bowlFrames(rolls); const idx = fr.findIndex(f => !f.done);
  if (idx === -1) return null;
  const f = fr[idx];
  if (idx < 9) return f.rolls.length === 0 ? 10 : 10 - f.rolls[0];
  const r = f.rolls;
  if (r.length === 0) return 10;
  if (r.length === 1) return r[0] === 10 ? 10 : 10 - r[0];
  if (r[0] === 10) return r[1] === 10 ? 10 : 10 - r[1];
  return 10;
}
function bowlTotal(rolls) { const fr = bowlFrames(rolls); let t = 0; fr.forEach(f => { if (f.score !== null) t = f.score; }); return t; }
function bowlRollSymbol(frames, fi, ri) {
  const f = frames[fi], r = f.rolls[ri]; if (r === undefined) return '';
  if (fi < 9) { if (ri === 0) return r === 10 ? 'X' : (r === 0 ? '-' : String(r)); return (f.rolls[0] + r === 10) ? '/' : (r === 0 ? '-' : String(r)); }
  const prev = ri > 0 ? f.rolls[ri - 1] : null;
  if (r === 10) return 'X';
  if (ri > 0 && prev !== 10 && prev + r === 10) return '/';
  return r === 0 ? '-' : String(r);
}
// who bowls next given rolls by player (order = players array)
function bowlNextPlayer(players, rollsBy) {
  let best = null, bestDone = 99;
  players.forEach(p => {
    const fr = bowlFrames(rollsBy[p] || []); const done = fr.filter(f => f.done).length;
    if (done < 10 && done < bestDone) { best = p; bestDone = done; }
  });
  return best;
}

// ---------- Darts ----------
const DART_VALUES = (() => { const v = []; for (let n = 1; n <= 20; n++) { v.push({ s: 'S' + n, v: n, d: false }); v.push({ s: 'D' + n, v: 2 * n, d: true }); v.push({ s: 'T' + n, v: 3 * n, d: false }); } v.push({ s: '25', v: 25, d: false }); v.push({ s: 'DB', v: 50, d: true }); return v; })();
function dartsCheckout(rem, doubleOut) {
  if (rem < 2 && doubleOut) return null; if (rem < 1) return null; if (rem > 170 && doubleOut) return null; if (rem > 180) return null;
  const outs = DART_VALUES.filter(d => !doubleOut || d.d);
  const ranked = DART_VALUES.slice().sort((a, b) => b.v - a.v);
  for (let n = 1; n <= 3; n++) {
    let best = null;
    const tryCombo = (combo) => { const sum = combo.reduce((s, d) => s + d.v, 0); if (sum === rem) { if (!best) best = combo; } };
    if (n === 1) outs.forEach(o => tryCombo([o]));
    if (n === 2) { for (const a of ranked) { if (a.v >= rem) continue; for (const o of outs) { if (a.v + o.v === rem) { best = [a, o]; break; } } if (best) break; } }
    if (n === 3) { outer: for (const a of ranked) { if (a.v >= rem) continue; for (const b of ranked) { if (a.v + b.v >= rem) continue; for (const o of outs) { if (a.v + b.v + o.v === rem) { best = [a, b, o]; break outer; } } } } }
    if (best) return best.map(d => d.s);
  }
  return null;
}
function dartsApplyTurn(rem, pts, doubleOut) {
  if (pts > rem) return { newRem: rem, bust: true, checkout: false };
  if (doubleOut && rem - pts === 1) return { newRem: rem, bust: true, checkout: false };
  if (pts === rem) return { newRem: 0, bust: false, checkout: true };
  return { newRem: rem - pts, bust: false, checkout: false };
}
const CRICKET_NUMS = [20, 19, 18, 17, 16, 15, 25];
function cricketInit(players) { const marks = {}, points = {}; players.forEach(p => { marks[p] = {}; CRICKET_NUMS.forEach(n => marks[p][n] = 0); points[p] = 0; }); return { marks, points }; }
function cricketHit(st, players, who, num, m) {
  const s = JSON.parse(JSON.stringify(st));
  for (let k = 0; k < m; k++) {
    if (s.marks[who][num] < 3) s.marks[who][num]++;
    else if (players.some(o => o !== who && s.marks[o][num] < 3)) s.points[who] += num;
  }
  return s;
}
function cricketWinner(st, players) {
  for (const p of players) {

  const me = meName(); const draft = settleDraft[f.uid]; const panel = T('div', 'sheet');
  if (!labels.includes(draft.label)) { draft.label = labels[0]; draft.qty = Math.abs(bal[labels[0]]); }
  panel.appendChild(T('label', null, 'What are you settling?'));
  const sel = T('select'); labels.forEach(l => { const o = T('option', null, `${l} (${bal[l] > 0 ? f.name + ' owes you ' : 'you owe '}${Math.abs(bal[l])})`); o.value = l; sel.appendChild(o); }); sel.value = draft.label;
  sel.onchange = () => { draft.label = sel.value; draft.qty = Math.abs(bal[sel.value]); if (draft.takeLabel && Math.sign(bal[draft.takeLabel]) === Math.sign(bal[sel.value])) draft.takeLabel = ''; render(); };
  panel.appendChild(sel);
  panel.appendChild(T('label', null, 'How many?'));
  const q = T('input'); q.type = 'number'; q.min = '0'; q.step = 'any'; q.value = String(draft.qty); q.onchange = () => { draft.qty = Math.max(0, Math.min(Math.abs(bal[draft.label]), parseFloat(q.value) || 0)); render(); };
  panel.appendChild(q);
  panel.appendChild(T('div', 'setup-hint', 'Settle part or all of it. You can pay down just some.'));
  const opposite = labels.filter(l => Math.sign(bal[l]) !== Math.sign(bal[draft.label]));
  if (opposite.length) {
    panel.appendChild(T('label', null, 'Trade something back? (optional)'));
    const t = T('select'); const none = T('option', null, 'No trade'); none.value = ''; t.appendChild(none);
    opposite.forEach(l => { const o = T('option', null, `${l} (${bal[l] > 0 ? f.name + ' owes you ' : 'you owe '}${Math.abs(bal[l])})`); o.value = l; t.appendChild(o); }); t.value = draft.takeLabel || '';
    t.onchange = () => { draft.takeLabel = t.value; if (t.value) draft.takeQty = Math.min(Math.abs(bal[t.value]), draft.takeQty || 1); render(); };
    panel.appendChild(t);
    if (draft.takeLabel) {
      const tq = T('input'); tq.type = 'number'; tq.min = '0'; tq.step = 'any'; tq.value = String(draft.takeQty); tq.onchange = () => { draft.takeQty = Math.max(0, Math.min(Math.abs(bal[draft.takeLabel]), parseFloat(tq.value) || 0)); render(); };
      panel.appendChild(tq);
    }
  }
  const note = T('input'); note.placeholder = 'Add a note (optional)'; note.maxLength = 80; note.value = draft.note || ''; note.oninput = () => { draft.note = note.value; }; note.style.marginTop = '8px'; panel.appendChild(note);
  // preview
  const owesLabel = bal[draft.label] < 0; const from = owesLabel ? me : f.name, to = owesLabel ? f.name : me;
  const give = { label: draft.label, qty: draft.qty }; const take = draft.takeLabel && draft.takeQty > 0 ? { label: draft.takeLabel, qty: draft.takeQty } : null;
  panel.appendChild(T('div', 'preview', describeSettlement({ from, to, give, take })));
  const err = T('div', 'pick-error');
  const send = Btn(`Send to ${f.name} to redeem`, 'btn btn-primary', async () => {
    if (!(give.qty > 0)) { err.textContent = 'Enter how many to settle.'; return; }
    const rec = { id: me + '_settle_' + Date.now(), poolType: 'settlement', from, to, give, take, note: (draft.note || '').trim(), status: 'pending', createdBy: me, timestamp: new Date().toISOString() };
    allPicks.push(rec);
    try { await savePicks(allPicks); settlePanelOpen[f.uid] = false; delete settleDraft[f.uid]; render(); }
    catch (e) { allPicks.pop(); err.textContent = "Couldn't send (" + describeFetchError(e) + ") — try again."; }
  });
  send.style.marginTop = '10px'; panel.appendChild(send); panel.appendChild(err);
  return panel;
}
// per-label tally text for a category, e.g. "+10 units · −3 chores"
function tallyText(entries, cat, resetAt) {
  const start = new Date(resetAt || '1970-01-01T00:00:00.000Z');
  const rows = entries.filter(e => e.cat === cat && new Date(e.date) >= start);
  const b = ledgerBalancesFromEntries(rows); const keys = sortLabels(Object.keys(b));
  return keys.map(k => ({ label: k, amount: b[k] }));
}

async function endScoreKeeperGame(gameId) {

// deep link ( ?game=<id> from a QR code ) — opens the scoreboard once logged in and data is loaded
function handleDeepLink() {
  let id = null; try { const q = new URLSearchParams(window.location.search); id = q.get('game') || localStorage.getItem('ww_deeplink'); } catch (e) {}
  if (!id) return false;
  if (!profile) { try { localStorage.setItem('ww_deeplink', id); } catch (e) {} return false; }
  const rec = allPicks.find(p => p.id === id); if (!rec) return false;
  try { localStorage.removeItem('ww_deeplink'); window.history.replaceState({}, '', window.location.pathname); } catch (e) {}
  appSection = 'kalshi';
  if (rec.poolType === 'scoreKeeperGame') { sbOpenGame(id); return true; }
  if (rec.poolType === 'triviaGame') { sbTab = 'trivia'; trivActiveId = id; trivView = 'play'; render(); return true; }
  if (rec.poolType === 'sideLeague') { sbTab = 'sports'; sbSport = rec.gameKey; sbLeagueId = id; sbLeagueTab = 'standings'; sbView = 'league'; render(); return true; }
  return false;
}

(async function init() {
  loadProfile();
  loadSession();
  loadNavState();
  challengeBrowseMode = 'swipe';
  openChallengeLeague = null;
  openChallengeTypeFilter = 'all';
  openChallengeDateFilter = 'week';
  swipeStackInitialized = false;

  if (profile && session) {
    const ok = await ensureFreshSession().catch(() => false);
    if (!ok) { profile = null; clearSession(); }
  } else if (profile && !session) {
    profile = null; // stale profile cache with no real session behind it (from before real auth existed)
  }

  if (profile) {
    try {
      const g = await loadGlobalData();
      players = g.players; allPicks = g.picks; dailySlateData = g.dailySlate; settledGameCache = g.settledGameCache || {};
    } catch (e) {
      setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
    }
  }
  applyTextZoom();
  render();
  if (profile) { try { handleDeepLink(); } catch (e) {} }

  if (profile) {
    (async () => {
      try {
        await migrateLegacyWeeklyPicks();
        await cleanupStaleHouseBets();
        await cleanupAcceptedChallengesOnce();
        await cleanupAllOpenAndAcceptedChallengesOnce();
        await cleanupHouseChallengesOnce();
        await resetMyAccountOnce();
        await clearChallengesPoolsAndUnitsOnce();
        await clearStuckPendingChallengesAndPoolsOnce();
        if (!players.includes(profile.name)) { players.push(profile.name); await savePlayers(players); }
        await refreshGameLists();

        startPolling();
        startLiveScoreChecks();
        try { handleDeepLink(); } catch (e) {}
        render();
      } catch (e) {
        setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
        render();
      }
    })();
  }
  render();
})();
