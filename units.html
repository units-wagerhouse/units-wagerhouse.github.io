<html lang="en">
<head>

<title>UNITS</title>
<style>
  :root {
    --bg: #0B0B0B; --surface: #171514; --surface-2: #201C1A; --border: #332D29;
    --text: #F6EBD7; --text-dim: #B8A99A; --text-faint: #7A6D62;
    --accent: #FF7A3D; --accent-dark: #3D2011; --accent-text: #1F0E05;
    --danger: #EF3B3B; --danger-dark: #3A1414;
    --gold: #FFC629;
    --font-head: 'Helvetica Neue', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-head); -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; overflow-x: hidden; width: 100%; touch-action: manipulation; }
  * { touch-action: manipulation; }
  #app { min-height: 100vh; padding-bottom: 50px; }
  input, button { font-family: var(--font-head); }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 16px 16px 0; }

  header.top h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; text-transform: uppercase; color: var(--text); }
  header.top h1 span { background: linear-gradient(135deg, #FFC629, #EF3B3B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .header-actions { display: flex; align-items: center; gap: 4px; margin-top: -4px; margin-right: -5px; }
  header.top .who { font-size: 12px; color: var(--text-dim); }
  .menu-btn { background: none; border: none; color: var(--text); font-size: 24px; line-height: 1; padding: 4px 8px; cursor: pointer; height: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; margin-left: -10px; }
  .friends-btn { background: none; border: none; padding: 4px 8px; cursor: pointer; height: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; position: relative; }
  .balance-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 8px; cursor: pointer; color: var(--accent); font-weight: 800; font-size: 12px; font-family: var(--font-mono); height: 26px; display: flex; align-items: center; }
  .menu-dropdown { position: absolute; top: 44px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; z-index: 30; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .menu-dropdown .menu-item { padding: 12px 16px; font-size: 13.5px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; }
  .menu-dropdown .menu-item:last-child { border-bottom: none; }
  .menu-dropdown .menu-item.danger { color: var(--danger); }
  .menu-dropdown .menu-item .sub { display: block; font-size: 11px; color: var(--text-faint); font-weight: 500; margin-top: 2px; }
  .swipe-card-big { display: flex; flex-direction: column; justify-content: center; overflow-y: auto; overflow-x: hidden; max-width: 100%; width: 100%; flex: 1; min-height: 0; box-sizing: border-box; }
  .swipe-team-logo { width: 56px; height: 56px; object-fit: contain; }
  .swipe-fixed-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 25; box-sizing: border-box; }
  .swipe-bar-spacer { height: 76px; }

  .tabbar { display: flex; gap: 4px; }
  #sectionSwitch { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 4px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 700; color: var(--text-faint); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.02em; }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  .league-scroller { display: flex; gap: 5px; overflow-x: auto; padding: 3px 0; scrollbar-width: none; }
  .league-scroller::-webkit-scrollbar { display: none; }
  .league-pill { flex: 0 0 auto; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); font-size: 11px; font-weight: 700; white-space: nowrap; text-transform: uppercase; }
  .league-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .league-pill.offered { border-color: #4CAF50; color: #4CAF50; }
  .league-pill.offered.active { background: #4CAF50; border-color: #4CAF50; color: #0a1f0c; }
  .league-pill.offered.outline-only.active { background: var(--accent); border-color: #4CAF50; color: var(--accent-text); }
  .league-pill.off { opacity: 0.5; }

  main { padding: 0 16px 8px; }

  .offseason-card { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .offseason-card .big { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .offseason-card .small { font-size: 12.5px; }

  .event-card { background: var(--surface); border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid var(--border); box-sizing: border-box; max-width: 100%; }
  .event-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .event-meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.03em; }
  .event-meta.live { color: var(--danger); font-weight: 700; }

  .team-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  .team-name { font-size: 14.5px; font-weight: 700; }
  .team-score { font-family: var(--font-mono); font-size: 15px; font-weight: 700; min-width: 24px; text-align: right; }
  .team-row.winner .team-name { color: var(--accent); }
  .team-row.loser .team-name { color: var(--text-dim); }

  .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .outcome-btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 6px; text-align: center; color: var(--text); }
  .outcome-btn .oc-team { font-size: 11.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
  .outcome-btn .oc-line { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
  .outcome-btn .oc-odds { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .outcome-btn.selected { background: var(--accent); border-color: var(--accent); }
  .outcome-btn.selected .oc-team, .outcome-btn.selected .oc-line, .outcome-btn.selected .oc-odds { color: var(--accent-text); }
  .outcome-btn.disabled { opacity: 0.45; }

  .bet-slip { margin-top: 10px; background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .bs-row { display: flex; align-items: center; gap: 8px; }
  .bs-row label { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  .bs-row input { width: 58px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 8px; font-family: var(--font-mono); font-size: 14px; }
  .bs-row .to-win { flex: 1; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  .bs-row .to-win .lbl { color: var(--text-faint); font-family: var(--font-head); font-size: 10.5px; display: block; text-transform: uppercase; }
  .lock-btn { width: 100%; margin-top: 9px; background: var(--accent); border: none; color: var(--accent-text); border-radius: 6px; padding: 10px; font-size: 13.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .lock-btn:disabled { opacity: 0.35; }
  .pick-error { color: var(--danger); font-size: 11px; margin-top: 6px; }

  .locked-note { margin-top: 10px; background: var(--accent-dark); border: 1px solid var(--accent); border-radius: 8px; padding: 10px; font-size: 12.5px; color: var(--accent); }
  .locked-note .ln-title { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.03em; margin-bottom: 3px; color: var(--text-dim); }
  .locked-note b { font-family: var(--font-mono); }
  .no-odds-note { margin-top: 8px; font-size: 11.5px; color: var(--text-faint); font-style: italic; }

  .setup-card { background: var(--surface); border-radius: 10px; padding: 16px; margin-top: 8px; border: 1px solid var(--border); }
  .setup-card label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; margin-top: 12px; }
  .setup-card label:first-child { margin-top: 0; }
  .setup-card input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 9px 10px; font-size: 14px; }
  .setup-card .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .setup-card button { flex: 1; padding: 10px; border-radius: 6px; font-size: 13.5px; font-weight: 800; border: none; background: var(--accent); color: var(--accent-text); text-transform: uppercase; }
  .setup-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }

  .rank-banner { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .rank-cell { flex: 1; padding: 12px; text-align: center; }
  .rank-cell + .rank-cell { border-left: 1px solid var(--border); }
  .rank-cell .rc-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .rank-cell .rc-value { font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--text); }
  .rank-cell .rc-value.accent { color: var(--accent); }
  .rank-cell .rc-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .pick-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface); border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }
  .pick-row .who { font-size: 13.5px; font-weight: 700; }
  .pick-row .who .pick-league { display: inline-block; background: var(--surface-2); color: var(--accent); font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.02em; vertical-align: middle; }
  .pick-row .detail { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; font-family: var(--font-mono); }
  .pick-row .result { font-family: var(--font-mono); font-size: 15px; font-weight: 800; text-align: right; white-space: nowrap; }
  .pick-row .result .sub { display: block; font-size: 9.5px; color: var(--text-faint); font-weight: 500; text-transform: uppercase; font-family: var(--font-head); }
  .result.win { color: var(--accent); }
  .result.loss { color: var(--danger); }
  .result.pending { color: var(--gold); }
  .result.profit-pos { color: #4CAF50; }
  .result.profit-neg { color: var(--danger); }

  .week-header { font-size: 12.5px; font-weight: 800; color: var(--text-dim); margin: 18px 0 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .week-header:first-child { margin-top: 8px; }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--border); background: var(--surface); margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); }
  .lb-row.me { border-color: var(--accent); }
  .lb-rank { font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); width: 20px; }
  .lb-rank.first { color: var(--gold); font-weight: 800; }
  .lb-name { flex: 1; font-size: 14.5px; font-weight: 700; }
  .lb-record { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .lb-profit { font-family: var(--font-mono); font-size: 16px; font-weight: 800; min-width: 60px; text-align: right; }
  .lb-profit.pos { color: var(--accent); }
  .lb-profit.neg { color: var(--danger); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-faint); font-size: 14px; }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stats-table th { text-align: left; font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .stats-table td { padding: 9px 10px; font-size: 13px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); color: var(--text); }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table td.pos { color: var(--accent); }
  .stats-table td.neg { color: var(--danger); }
  .refresh-note { margin: 16px 0 0; padding: 11px 13px; background: var(--surface); border-radius: 8px; font-size: 11px; color: var(--text-faint); line-height: 1.5; border-left: 2px solid var(--accent-dark); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  /* ===================== v2 DESIGN SYSTEM ===================== */
  :root { --radius: 16px; --radius-sm: 12px; --pos: #58D68D; --accent-grad: linear-gradient(135deg, #FF8F52, #FF6A2A); --font-head: 'Inter', 'Helvetica Neue', -apple-system, system-ui, sans-serif; --card-bg: linear-gradient(180deg, #1b1816, #141211); }
  html { -webkit-text-size-adjust: 100%; }
  body { font-size: 15px; line-height: 1.45; background: radial-gradient(900px 420px at 50% -160px, rgba(255,122,61,0.10), transparent 65%), var(--bg); }
  #app { padding-bottom: 60px; }
  main { padding: 0 16px 24px; max-width: 760px; margin: 0 auto; }
  header.top { background: rgba(11,11,11,0.88); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 14px 16px 0; }
  header.top .brand { cursor: pointer; }
  #sectionSwitch { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px; margin-bottom: 8px; padding-bottom: 4px; }
  #sectionSwitch .tab { flex: 1; display: flex; gap: 6px; align-items: center; justify-content: center; border: none; border-radius: 12px; padding: 11px 6px; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--text-dim); transition: background .18s, color .18s; cursor: pointer; font-weight: 800; }
  #sectionSwitch .tab.active { background: var(--accent-grad); color: #1F0E05; box-shadow: 0 4px 16px rgba(255,122,61,0.35); border: none; }
  #subSwitch { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  #subSwitch::-webkit-scrollbar { display: none; }
  #subSwitch:empty { display: none; }
  .subtab { flex: 0 0 auto; position: relative; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; font-weight: 800; color: var(--text-dim); background: var(--surface); white-space: nowrap; cursor: pointer; }
  .subtab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dark); }
  .subtab .dot { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }
  #tabbar { margin-top: 0; }
  #tabbar .tab { padding: 11px 4px; }
  main.enter > * { animation: fadeUp .28s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  input[type=checkbox], input[type=radio] { width: auto; min-height: 0; }
  input, select, textarea { font-family: var(--font-head); font-size: 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; width: 100%; min-height: 46px; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,122,61,0.18); }
  input[type=file] { padding: 10px; }
  label { display: block; font-size: 12.5px; font-weight: 800; color: var(--text-dim); margin: 14px 0 6px; }
  .btn { appearance: none; -webkit-appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; font-weight: 800; min-height: 46px; cursor: pointer; transition: transform .08s, background .15s, opacity .15s; font-family: var(--font-head); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; }
  .btn-primary { background: var(--accent-grad); color: #1F0E05; border-color: transparent; box-shadow: 0 6px 18px rgba(255,122,61,0.28); width: 100%; }
  .btn-primary.btn-sm { width: auto; }
  .btn-ghost { background: transparent; color: var(--text-dim); }
  .btn-sm { min-height: 38px; padding: 8px 13px; font-size: 13px; border-radius: 10px; }
  .btn-dashed { width: 100%; background: transparent; border: 1.5px dashed var(--accent); color: var(--accent); }
  .btn-yes { background: #16301f; border-color: var(--pos); color: var(--pos); }
  .btn-no { background: #3a1414; border-color: var(--danger); color: #ff8a8a; }
  .btn-danger-text { color: var(--danger); }
  .btn-x { background: none; border: 1px solid var(--border); color: var(--text-faint); border-radius: 8px; width: 32px; height: 32px; font-size: 13px; cursor: pointer; flex: 0 0 auto; }
  .lock-btn { border-radius: 12px; min-height: 48px; background: var(--accent-grad); box-shadow: 0 6px 18px rgba(255,122,61,0.25); }
  .league-pill { padding: 8px 14px; border-radius: 999px; font-size: 12.5px; }
  .event-card, .setup-card { border-radius: var(--radius); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
  .accent-card { border-color: var(--accent); background: linear-gradient(180deg, #2a170d, #1b1009); }
  .explainer { border: 1px solid var(--border); background: linear-gradient(180deg, #1f1a17, #141211); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
  .h2 { font-size: 21px; font-weight: 900; letter-spacing: -0.01em; }
  .h3 { font-size: 15px; font-weight: 800; }
  .muted { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; }
  .small { font-size: 12px; }
  .eyebrow { font-size: 11px; font-weight: 800; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 6px; }
  .pos { color: var(--pos); } .neg { color: var(--danger); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { display: inline-block; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--text-dim); font-family: var(--font-head); }
  .chip-on { border-color: var(--accent); color: var(--accent); background: var(--accent-dark); }
  .chip-btn { cursor: pointer; min-height: 34px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { text-align: left; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; color: var(--text); min-height: 128px; cursor: pointer; transition: transform .1s, border-color .15s; font-family: var(--font-head); }
  .tile:active { transform: scale(0.97); border-color: var(--accent); }
  .tile .ti { font-size: 30px; margin-bottom: 6px; } .tile .tt { font-weight: 900; font-size: 15px; } .tile .td { font-size: 12px; color: var(--text-faint); margin-top: 4px; line-height: 1.35; } .tile .tm { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 800; }
  .rowcard { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; margin-top: 8px; cursor: pointer; }
  .rowcard.sel { border-color: var(--accent); } .ri { font-size: 26px; } .rm { flex: 1; min-width: 0; } .chev { color: var(--text-faint); font-size: 22px; }
  .search { margin-top: 12px; }
  .sb-top { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 10px; }
  .sb-title { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; } .sb-icon { font-size: 38px; }
  .result-banner { border: 1px solid var(--gold); background: linear-gradient(180deg, #2b2209, #171514); border-radius: var(--radius); padding: 14px; margin: 10px 0; text-align: center; }
  .result-banner .big { font-size: 22px; font-weight: 900; color: var(--gold); margin-bottom: 4px; }
  .fold { border: 1px solid var(--border); border-radius: 14px; margin-top: 10px; background: var(--surface); overflow: hidden; }
  .fold summary { padding: 13px 14px; font-weight: 800; cursor: pointer; list-style: none; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold > *:not(summary) { padding: 0 14px 14px; }
  .plrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .togrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick { text-align: left; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; color: var(--text); cursor: pointer; min-height: 120px; font-family: var(--font-head); transition: transform .1s; } .quick:active { transform: scale(0.97); }
  .quick .qi { font-size: 28px; } .quick .qt { font-weight: 900; margin-top: 4px; } .quick .qd { font-size: 12px; color: var(--text-faint); margin-top: 3px; line-height: 1.35; }

  .maprow { padding: 9px 0; border-bottom: 1px solid var(--border); } .maprow:last-child { border-bottom: none; }
  .faq { border: 1px solid var(--border); border-radius: 14px; margin-top: 8px; background: var(--surface); padding: 0 14px; } .faq summary { padding: 14px 0; font-weight: 800; cursor: pointer; } .faq > div { padding-bottom: 12px; }
  .attrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; } .attrow .btn { width: auto; flex: 0 0 auto; }
  .ledger { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); } .ledger-row { padding: 3px 0; font-weight: 800; } .ledger-pending { padding: 6px 0; }
  .preview { margin: 10px 0; padding: 10px; border-radius: 10px; background: var(--accent-dark); color: var(--accent); font-weight: 700; font-size: 13px; }
  .sheet { background: var(--surface-2); border-radius: 14px; padding: 12px; margin-top: 10px; }

  .tally-pos { color: var(--pos); font-weight: 800; } .tally-neg { color: var(--danger); font-weight: 800; }

<script>

// Belt-and-suspenders fix for double-tap-to-zoom: some elements (like the swipe card) need
// touch-action:pan-y for their own drag handling, which doesn't reliably suppress the browser's
// native double-tap-zoom gesture the way touch-action:manipulation does. This catches two quick
// taps on the same spot (the actual double-tap-to-zoom trigger) and blocks the zoom response,
// without interfering with normal quick taps on two different buttons.
(function() {
  let lastTouchEnd = 0;
  let lastTouchTarget = null;
  document.addEventListener('touchend', function(e) {
    const now = Date.now();
    // Never swallow taps on interactive controls (steppers, inputs, buttons) — touch-action:manipulation
    // already stops double-tap zoom on those, and blocking them made +/- and unit fields feel dead.
    const interactive = e.target && e.target.closest && e.target.closest('button,input,select,textarea,label,a,summary,[role=button]');
    if (!interactive && now - lastTouchEnd <= 350 && e.target === lastTouchTarget) {
      e.preventDefault();
    }
    lastTouchEnd = now;
    lastTouchTarget = e.target;
  }, { passive: false });
})();

const LEAGUES_META = [
  { id: 'nfl', label: 'NFL', active: true, spreadSport: true },
  { id: 'mlb', label: 'MLB', active: true, spreadSport: false },
  { id: 'ncaaf', label: 'NCAAF', active: true, spreadSport: true },
  { id: 'wnba', label: 'WNBA', active: true, spreadSport: true },
  { id: 'atp', label: "Men's Tennis", active: true, spreadSport: false, moneylineOnly: true },
  { id: 'wta', label: "Women's Tennis", active: true, spreadSport: false, moneylineOnly: true },
  { id: 'nba', label: 'NBA', active: false, returns: 'Oct 20, 2026' },
  { id: 'nhl', label: 'NHL', active: false, returns: 'Sep 29, 2026' },
  { id: 'ncaab', label: 'NCAAB', active: false, returns: 'early Nov 2026' },
  { id: 'pga', label: 'PGA Golf', active: true, isGolf: true },
];

let DATA = { nfl: [], mlb: [], ncaaf: [], wnba: [], atp: [], wta: [] };
const gameIndex = {};
function rebuildGameIndex() {
  Object.keys(gameIndex).forEach(k => delete gameIndex[k]);
  Object.keys(DATA).forEach(sport => (DATA[sport] || []).forEach(g => gameIndex[g.id] = { sport, game: g }));
  Object.keys(settledGameCache).forEach(gid => { if (!gameIndex[gid]) gameIndex[gid] = settledGameCache[gid]; });
}
function updateSettledGameCache() {
  let changed = false;
  const cutoff = Date.now() - 60 * 24 * 60 * 60 * 1000; // keep 60 days — plenty of slack for settlement to catch up
  Object.keys(DATA).forEach(sport => {
    (DATA[sport] || []).forEach(g => {
      if (g.status !== 'closed' && g.status !== 'complete') return;
      if (!g.score || g.score[g.home] === undefined || g.score[g.away] === undefined) return;
      const existing = settledGameCache[g.id];
      if (!existing || JSON.stringify(existing.game) !== JSON.stringify(g)) {
        settledGameCache[g.id] = { sport, game: g };
        changed = true;
      }
    });
  });
  Object.keys(settledGameCache).forEach(gid => {
    const g = settledGameCache[gid].game;
    if (g.start && new Date(g.start).getTime() < cutoff) { delete settledGameCache[gid]; changed = true; }
  });
  return changed;
}

// ---------- live game list + scores (ESPN public scoreboard) ----------
const ESPN_PATHS = {
  nfl: { sport: 'football', league: 'nfl' },
  mlb: { sport: 'baseball', league: 'mlb' },
  ncaaf: { sport: 'football', league: 'college-football' },
  wnba: { sport: 'basketball', league: 'wnba' },
  atp: { sport: 'tennis', league: 'atp' },
  wta: { sport: 'tennis', league: 'wta' },
  nba: { sport: 'basketball', league: 'nba' },
  nhl: { sport: 'hockey', league: 'nhl' },
  ncaab: { sport: 'basketball', league: 'mens-college-basketball' },
};
async function fetchSportGames(sport) {
  const { sport: espnSport, league } = ESPN_PATHS[sport];
  const now = new Date();
  const dateStrs = [-1, 0, 1, 2, 3, 4, 5, 6].map(offset => {
    const d = new Date(now);
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10).replace(/-/g, '');
  });
  const seen = new Set();
  const events = [];
  const results = await Promise.all(dateStrs.map(async (date) => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${espnSport}/${league}/scoreboard?dates=${date}&limit=300`);
      if (!res.ok) return [];
      const json = await res.json();
      return json.events || [];
    } catch (e) { return []; /* best-effort per date */ }
  }));
  results.flat().forEach(ev => { if (!seen.has(ev.id)) { seen.add(ev.id); events.push(ev); } });
  return events.map(ev => {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp || !comp.competitors) return null;
    let home = comp.competitors.find(c => c.homeAway === 'home');
    let away = comp.competitors.find(c => c.homeAway === 'away');
    if (!home || !away) { home = comp.competitors[0]; away = comp.competitors[1]; }
    if (!home || !away) return null;
    const homeEntity = home.team || home.athlete;
    const awayEntity = away.team || away.athlete;
    if (!homeEntity || !awayEntity) return null;
    const homeAbbr = home.team ? home.team.abbreviation : ('p' + homeEntity.id);
    const awayAbbr = away.team ? away.team.abbreviation : ('p' + awayEntity.id);
    const homeName = home.team ? home.team.displayName : homeEntity.displayName;
    const awayName = away.team ? away.team.displayName : awayEntity.displayName;
    const homeLogo = home.team ? (home.team.logo || null) : ((homeEntity.headshot && homeEntity.headshot.href) || null);
    const awayLogo = away.team ? (away.team.logo || null) : ((awayEntity.headshot && awayEntity.headshot.href) || null);
    const extractRecord = (competitor) => {
      try {
        const recs = competitor.records;
        if (!recs || !recs.length) return null;
        const overall = recs.find(r => r.name === 'overall' || r.type === 'total') || recs[0];
        return overall.summary || null;
      } catch (e) { return null; }
    };
    const homeRecord = extractRecord(home);
    const awayRecord = extractRecord(away);
    const state = ev.status && ev.status.type && ev.status.type.state;
    const status = state === 'post' ? 'closed' : (state === 'in' ? 'inprogress' : 'scheduled');
    const odds = comp.odds && comp.odds[0];
    const extractPitcher = (competitor) => {
      try {
        const p = competitor.probables && competitor.probables[0];
        if (p && p.athlete) return p.athlete.shortName || p.athlete.displayName || null;
        if (p && p.displayName) return p.displayName;
      } catch (e) { /* field not present in this response */ }
      return null;
    };
    const g = {
      id: ev.id,
      status,
      home: homeAbbr, away: awayAbbr,
      teams: { [homeAbbr]: { name: homeName, logo: homeLogo, record: homeRecord }, [awayAbbr]: { name: awayName, logo: awayLogo, record: awayRecord } },
      start: ev.date,
      local_start: new Date(ev.date).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      title: (comp.notes && comp.notes[0] && comp.notes[0].headline) || null,
      liveDetail: state === 'in' ? ((ev.status.type && ev.status.type.shortDetail) || null) : null,
      oddsDetails: (odds && odds.details) || null,
      overUnder: (odds && typeof odds.overUnder === 'number') ? odds.overUnder : null,
      homePitcher: sport === 'mlb' ? extractPitcher(home) : null,
      awayPitcher: sport === 'mlb' ? extractPitcher(away) : null,
    };
    if (status !== 'scheduled') {
      g.score = { [homeAbbr]: Number(home.score), [awayAbbr]: Number(away.score) };
    }
    return g;
  }).filter(Boolean);
}
let gamesLoaded = false;
async function refreshGameLists() {
  const before = JSON.stringify(DATA);
  const activeSports = Object.keys(ESPN_PATHS).filter(sport => {
    const meta = LEAGUES_META.find(l => l.id === sport);
    return meta && meta.active;
  });
  await Promise.all(activeSports.map(async (sport) => {
    try {
      const games = await fetchSportGames(sport);
      if (games.length) DATA[sport] = games;
    } catch (e) { /* keep previous list for this sport on failure */ }
  }));
  const cacheChanged = updateSettledGameCache();
  rebuildGameIndex();
  gamesLoaded = true;
  const changed = JSON.stringify(DATA) !== before;
  if (changed) { cachedDailyPool = null; cachedDailyPoolKey = null; }
  if (cacheChanged) { fsPatch({ settledGameCache }).catch(() => { /* best-effort; retry next cycle */ }); }
  return changed;
}

function isMidFormEntry() {
  const golfMeta = LEAGUES_META.find(l => l.isGolf);
  const inPoolBuilder = appSection === 'daily' && poolsActiveTab === 'create' && !(golfMeta && poolCreateSport === golfMeta.id);
  const midPoolPick = appSection === 'daily' && poolsActiveTab === 'requested' && (poolBrowseMode === 'cart' || !!poolJoinTarget);
  const ae = document.activeElement; const typing = !!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || ''));
  const inSetup = appSection === 'kalshi' && (sbView === 'setup' || sbView === 'leagueSetup' || trivView === 'setup' || trivView === 'setEdit');
  const inSide = appSection === 'kalshi' && typing;
  return inPoolBuilder || midPoolPick || inSetup || inSide;
}
let liveTimer = null;
function startLiveScoreChecks() {
  refreshGameLists().then(async () => { await persistNewlySettledPicks(); await persistNewlySettledWeeklyBets(); await persistNewlySettledPlayerProps(); await persistNewlySettledGolfH2H(); await ensurePoolPlayerPropBoxScores(); await persistNewlySettledComboPool(); await persistNewlySettledGolfTeamPool(); await persistAccountAdjustmentsForChallenges(); if (profile && !isMidFormEntry()) render(); });
  if (liveTimer) return;

    const dataChanged = await refreshGameLists();
    const settledA = await persistNewlySettledPicks();

function computeSpread(sport, g) {
  const meta = LEAGUES_META.find(l => l.id === sport);
  if (!meta || !meta.spreadSport) return null;
  if (!g.oddsDetails) return null;
  const m = g.oddsDetails.match(/^([A-Za-z.]+)\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const favTeam = m[1].toUpperCase();
  const magnitude = Math.abs(parseFloat(m[2]));
  if (favTeam === (g.home || '').toUpperCase()) return -magnitude;
  if (favTeam === (g.away || '').toUpperCase()) return magnitude;
  return null;
}

async function loadGlobalData() {
  try {
    const data = await fsGet();
    return { players: data.players || [], picks: data.picks || [], dailySlate: data.dailySlate || null };
  } catch (e) { throw new Error(e.message || 'Firestore read failed'); }

async function savePlayers(list) { await fsPatch({ players: list }); }
let pendingSaveCount = 0;
let savePicksQueue = Promise.resolve();
let lastLocalSaveAt = 0;
async function savePicks(picks) {
  pendingSaveCount++; lastLocalSaveAt = Date.now();
  const runThisSave = savePicksQueue.then(() => fsPatch({ picks: picks }));
  savePicksQueue = runThisSave.catch(() => {}); // keep the chain alive even if this save fails
  try {
    await runThisSave;
  } finally {
    pendingSaveCount--; lastLocalSaveAt = Date.now();
  }
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (pendingSaveCount > 0 || Date.now() < localDirtyUntil) return; // a local write is still in flight — don't clobber it with a stale read
    try {
      const pollStartedAt = Date.now();
      const data = await fsGet();
      // A save may have started (or finished) while our read was in flight — that read is now stale, so drop it.
      if (pendingSaveCount > 0 || lastLocalSaveAt >= pollStartedAt || Date.now() < localDirtyUntil) return;
      let changed = false;
      if (data.players && JSON.stringify(data.players) !== JSON.stringify(players)) { players = data.players; changed = true; }
      if (data.picks && JSON.stringify(data.picks) !== JSON.stringify(allPicks)) {
        allPicks = data.picks;
        changed = true;
        swipeStackInitialized = false;
        if (!(poolBrowseMode === 'cart' || poolJoinTarget)) poolSwipeStackInitialized = false; // never rebuild the deck while someone is mid-pick
      }
      if (data.dailySlate && JSON.stringify(data.dailySlate) !== JSON.stringify(dailySlateData)) { dailySlateData = data.dailySlate; changed = true; }
      if (data.settledGameCache) {
        let cacheGrew = false;
        Object.keys(data.settledGameCache).forEach(gid => {
          if (!settledGameCache[gid]) { settledGameCache[gid] = data.settledGameCache[gid]; cacheGrew = true; }
        });
        if (cacheGrew) rebuildGameIndex();
      }
      const friendSynced = await syncAcceptedFriendRequests();
      if ((changed || friendSynced) && profile && !isMidFormEntry()) render();
    } catch (e) { /* ignore transient poll errors */ }
  }, 8000);
}

  if (!accepted.length) return false;
  const toAdd = [];
  accepted.forEach(req => {
    if (!myFriends.some(f => f.uid === req.toUid) && !toAdd.some(f => f.uid === req.toUid)) {

  const updated = toAdd.length ? [...myFriends, ...toAdd] : myFriends;
  try {
    if (toAdd.length) {
      await saveProfileDoc(profile.uid, { friends: updated });
      saveProfile({ ...profile, friends: updated });

    await savePicks(allPicks); // persist the synced flags either way, so this doesn't re-run forever

  } catch (e) { return false; }

  const wrap = el('div');
  const backBtn = el('button', null, '\u2190 Back');
  backBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-dim);font-size:12px;font-weight:700;padding:8px 12px;border-radius:6px;margin-bottom:12px;';
  backBtn.onclick = () => { appSection = 'home'; friendProfileView = null; render(); };
  wrap.appendChild(backBtn);

  wrap.appendChild(el('div', null, 'Friends')).style.cssText = 'font-size:18px;font-weight:800;margin-bottom:10px;';

  if (!friendsAllProfilesLoaded) {
    wrap.appendChild(el('div', 'empty', 'Loading users…'));
    fetchAllProfiles(false).then(() => { friendsAllProfilesLoaded = true; render(); });
    return wrap;
  }

  const myFriends = profile.friends || [];
  const allOthers = (allProfilesCache || []).filter(p => p.uid !== profile.uid);

  // ---- settle-up requests ----
  const settleReqs = pendingSettlementsForMe();
  if (settleReqs.length) { wrap.appendChild(el('div', 'week-header', `Settle-up requests (${settleReqs.length})`)); settleReqs.forEach(sr => wrap.appendChild(renderSettlementRequestCard(sr))); }

  // ---- incoming friend requests ----
  const incoming = incomingFriendRequests();
  if (incoming.length) {
    wrap.appendChild(el('div', 'week-header', `Friend Requests (${incoming.length})`));
    incoming.forEach(req => {
      const row = el('div', 'pick-row');
      const left = el('div');
      left.appendChild(el('div', 'who', req.fromName));
      left.appendChild(el('div', 'detail', '@' + req.fromUsername + ' wants to be friends'));
      row.appendChild(left);
      const btnRow = el('div'); btnRow.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';
      const acceptBtn = el('button', null, 'Accept');
      acceptBtn.style.cssText = 'background:var(--accent-dark);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;';
      acceptBtn.onclick = async () => {
        acceptBtn.disabled = true; acceptBtn.textContent = 'Adding…';
        const idx = allPicks.findIndex(p => p.id === req.id);
        if (idx > -1) allPicks[idx].status = 'accepted';
        const updatedFriends = myFriends.some(f => f.uid === req.fromUid) ? myFriends : [...myFriends, { uid: req.fromUid, name: req.fromName, username: req.fromUsername }];
        try {
          await savePicks(allPicks);
          await saveProfileDoc(profile.uid, { friends: updatedFriends });
          saveProfile({ ...profile, friends: updatedFriends });
          render();
        } catch (e) { alert("Couldn't accept (" + describeFetchError(e) + ") — try again."); acceptBtn.disabled = false; acceptBtn.textContent = 'Accept'; }
      };
      const declineBtn = el('button', null, 'Decline');
      declineBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;';
      declineBtn.onclick = async () => {
        declineBtn.disabled = true;
        const idx = allPicks.findIndex(p => p.id === req.id);
        if (idx > -1) allPicks[idx].status = 'declined';
        try { await savePicks(allPicks); render(); }
        catch (e) { alert("Couldn't decline (" + describeFetchError(e) + ") — try again."); declineBtn.disabled = false; }
      };
      btnRow.appendChild(acceptBtn); btnRow.appendChild(declineBtn);
      row.appendChild(btnRow);
      wrap.appendChild(row);
    });
  }

  // ---- outgoing pending requests ----
  const outgoing = allPicks.filter(p => p.poolType === 'friendRequest' && p.status === 'pending' && p.fromUid === profile.uid);
  if (outgoing.length) {
    wrap.appendChild(el('div', 'week-header', `Requested (${outgoing.length})`));
    outgoing.forEach(req => {
      const row = el('div', 'pick-row');
      const left = el('div');
      left.appendChild(el('div', 'who', req.toName));
      left.appendChild(el('div', 'detail', '@' + req.toUsername + ' \u2014 waiting for them to accept'));
      row.appendChild(left);
      wrap.appendChild(row);
    });
  }

  // ---- friend groups ----
  const myGroups = allPicks.filter(p => p.poolType === 'friendGroup' && (p.members || []).some(m => m.uid === profile.uid));
  wrap.appendChild(el('div', 'week-header', `Friend Groups (${myGroups.length})`));
  myGroups.forEach(grp => {
    const groupCard = el('div', 'event-card');

    const row = el('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;cursor:pointer;';
    const left = el('div');
    const nameRow = el('div'); nameRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
    nameRow.appendChild(el('div', 'who', grp.name));
    if (threadHasUnread(grp.id)) {
      const dot = el('span'); dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;';
      nameRow.appendChild(dot);
    }
    left.appendChild(nameRow);
    left.appendChild(el('div', 'detail', grp.members.map(m => m.name).join(', ')));
    row.appendChild(left);
    row.onclick = (e) => { if (e.target.closest('button')) return; groupLeaderboardOpen[grp.id] = !groupLeaderboardOpen[grp.id]; if (groupLeaderboardOpen[grp.id]) markThreadSeen(grp.id); render(); };
    if (grp.creatorUid === profile.uid) {
      const delBtn = el('button', null, '\u2715');
      delBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:28px;height:28px;font-size:12px;flex-shrink:0;';
      delBtn.onclick = async () => {
        if (!confirm(`Delete the group "${grp.name}"?`)) return;
        const idx = allPicks.findIndex(p => p.id === grp.id);
        if (idx === -1) return;
        const removed = allPicks.splice(idx, 1)[0];
        try { await savePicks(allPicks); render(); }
        catch (e) { allPicks.splice(idx, 0, removed); alert("Couldn't delete (" + describeFetchError(e) + ") — try again."); }
      };
      row.appendChild(delBtn);
    }
    groupCard.appendChild(row);

    if (groupLeaderboardOpen[grp.id]) {
      const memberUids = new Set(grp.members.map(m => m.uid));
      const invitableFriends = myFriends.filter(f => !memberUids.has(f.uid));

      const inviteToggleBtn = el('button', null, groupInviteOpen[grp.id] ? '\u2212 Cancel' : '+ Invite Friend');
      inviteToggleBtn.style.cssText = 'width:100%;margin-top:10px;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:8px;font-size:12px;font-weight:700;';
      inviteToggleBtn.onclick = () => { groupInviteOpen[grp.id] = !groupInviteOpen[grp.id]; render(); };
      groupCard.appendChild(inviteToggleBtn);

      if (groupInviteOpen[grp.id]) {
        if (!invitableFriends.length) {
          groupCard.appendChild(el('div', 'empty', 'All your friends are already in this group.'));
        } else {
          const inviteRow = el('div'); inviteRow.style.cssText = 'display:flex;gap:6px;margin-top:8px;';
          const friendSel = el('select');
          friendSel.style.cssText = 'flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font-size:13px;box-sizing:border-box;';
          invitableFriends.forEach(f => { const o = document.createElement('option'); o.value = f.uid; o.textContent = f.name; friendSel.appendChild(o); });
          const addBtn = el('button', null, 'Add');
          addBtn.style.cssText = 'background:var(--accent-dark);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:700;flex-shrink:0;';
          addBtn.onclick = async () => {
            const chosen = invitableFriends.find(f => f.uid === friendSel.value);
            if (!chosen) return;
            const idx = allPicks.findIndex(p => p.id === grp.id);
            if (idx === -1) return;
            const prevMembers = allPicks[idx].members.slice();
            allPicks[idx].members = [...prevMembers, { uid: chosen.uid, name: chosen.name, username: chosen.username }];
            addBtn.disabled = true; addBtn.textContent = 'Adding…';
            try {
              await savePicks(allPicks);
              groupInviteOpen[grp.id] = false;
              render();
            } catch (e) {
              allPicks[idx].members = prevMembers;
              addBtn.disabled = false; addBtn.textContent = 'Add';
              alert("Couldn't add (" + describeFetchError(e) + ") — try again.");
            }
          };
          inviteRow.appendChild(friendSel); inviteRow.appendChild(addBtn);
          groupCard.appendChild(inviteRow);
        }
      }
    }

    if (groupLeaderboardOpen[grp.id]) {
      const lbCard = el('div'); lbCard.style.cssText = 'background:var(--surface-2);border-radius:8px;padding:10px;margin-top:10px;';

      const stats = computeGroupLeaderboardStats(grp);
      const ranked = Object.keys(stats).map(name => ({ name, ...stats[name] })).sort((a,b) => b.units - a.units);
      lbCard.appendChild(el('div', null, 'Current standings')).style.cssText = 'font-size:10.5px;color:var(--text-faint);text-transform:uppercase;font-weight:700;margin-bottom:6px;';
      ranked.forEach((s, i) => {
        const r = el('div'); r.style.cssText = 'display:flex;justify-content:space-between;font-size:12px;padding:4px 0;';
        r.innerHTML = `<span>${i + 1}. ${s.name}${s.name === profile.name ? ' (you)' : ''}</span><span style="font-weight:700;color:${s.units > 0 ? 'var(--accent)' : (s.units < 0 ? 'var(--danger)' : 'var(--text-dim)')};">${s.units > 0 ? '+' : ''}${Math.round(s.units)}u</span>`;
        lbCard.appendChild(r);
      });

      const resetBtn = el('button', null, 'Reset Leaderboard Now');
      resetBtn.style.cssText = 'width:100%;margin-top:10px;background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;padding:7px;font-size:11px;font-weight:700;';
      resetBtn.onclick = async () => {
        if (!confirm('Reset this leaderboard? This just zeroes it out — no record is kept of who was ahead.')) return;
        const idx = allPicks.findIndex(p => p.id === grp.id);
        if (idx === -1) return;
        const nowIso = new Date().toISOString();
        const prev = { leaderboardResetMode: allPicks[idx].leaderboardResetMode, leaderboardPeriodStart: allPicks[idx].leaderboardPeriodStart };
        allPicks[idx].leaderboardResetMode = 'manual';
        allPicks[idx].leaderboardPeriodStart = nowIso;
        try { await savePicks(allPicks); render(); }
        catch (e) { Object.assign(allPicks[idx], prev); alert("Couldn't reset (" + describeFetchError(e) + ") — try again."); }
      };
      lbCard.appendChild(resetBtn);
      groupCard.appendChild(lbCard);
    }
    if (groupLeaderboardOpen[grp.id]) groupCard.appendChild(renderGroupCommentsSection(grp));
    wrap.appendChild(groupCard);
  });

  const groupToggleBtn = el('button', null, groupBuilderOpen ? '\u2212 Cancel' : '+ Create Group');
  groupToggleBtn.style.cssText = 'width:100%;margin-top:8px;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:10px;font-size:12.5px;font-weight:700;';
  groupToggleBtn.onclick = () => { groupBuilderOpen = !groupBuilderOpen; groupBuilderName = ''; groupBuilderMemberUids = new Set(); render(); };
  wrap.appendChild(groupToggleBtn);

  if (groupBuilderOpen) {
    const groupCard = el('div', 'setup-card');
    groupCard.style.marginTop = '8px';
    groupCard.appendChild(el('label', null, 'Group name'));
    const nameInput = el('input'); nameInput.placeholder = 'e.g. Fantasy League'; nameInput.value = groupBuilderName;
    nameInput.oninput = () => { groupBuilderName = nameInput.value; };
    groupCard.appendChild(nameInput);
    groupCard.appendChild(el('label', null, 'Members')).style.marginTop = '10px';
    if (!myFriends.length) {
      groupCard.appendChild(el('div', 'empty', 'Add some friends first before building a group.'));
    } else {
      myFriends.forEach(f => {
        const row = el('div', 'pick-row');
        row.style.cursor = 'pointer';
        const left = el('div');
        left.appendChild(el('div', 'who', f.name));
        left.appendChild(el('div', 'detail', '@' + f.username));
        row.appendChild(left);
        const checkSpan = el('div', null, groupBuilderMemberUids.has(f.uid) ? '\u2713' : '');
        checkSpan.style.cssText = 'width:24px;text-align:center;font-size:14px;color:var(--accent);font-weight:800;flex-shrink:0;';
        row.appendChild(checkSpan);
        row.onclick = () => {
          if (groupBuilderMemberUids.has(f.uid)) groupBuilderMemberUids.delete(f.uid);
          else groupBuilderMemberUids.add(f.uid);
          render();
        };
        groupCard.appendChild(row);
      });
    }
    const groupErr = el('div', 'pick-error');
    const createGroupBtn = el('button', 'lock-btn', 'Create Group');
    createGroupBtn.style.marginTop = '10px';
    groupCard.appendChild(createGroupBtn);
    groupCard.appendChild(groupErr);
    wrap.appendChild(groupCard);

    createGroupBtn.onclick = async () => {
      const name = groupBuilderName.trim();
      groupErr.textContent = '';
      if (!name) { groupErr.textContent = 'Enter a group name.'; return; }
      if (groupBuilderMemberUids.size < 1) { groupErr.textContent = 'Pick at least 1 friend.'; return; }
      const memberList = [{ uid: profile.uid, name: profile.name, username: profile.username }];
      myFriends.forEach(f => { if (groupBuilderMemberUids.has(f.uid)) memberList.push({ uid: f.uid, name: f.name, username: f.username }); });
      const group = {
        id: profile.name + '_group_' + Date.now(),
        poolType: 'friendGroup', creator: profile.name, creatorUid: profile.uid,
        name, members: memberList,
        timestamp: new Date().toISOString()
      };
      createGroupBtn.disabled = true; createGroupBtn.textContent = 'Creating…';
      allPicks.push(group);
      try {
        await savePicks(allPicks);
        groupBuilderOpen = false; groupBuilderName = ''; groupBuilderMemberUids = new Set();
        render();
      } catch (e) {
        allPicks.pop();
        groupErr.textContent = "Couldn't create (" + describeFetchError(e) + ") — try again.";
        createGroupBtn.disabled = false; createGroupBtn.textContent = 'Create Group';
      }
    };
  }

  // ---- your friends list ----
  wrap.appendChild(el('div', 'week-header', `Your friends (${myFriends.length})`));

  // ---- search ----
  const searchCard = el('div', 'setup-card');
  searchCard.appendChild(el('div', null, 'Find people')).style.cssText = 'font-size:14px;font-weight:800;margin-bottom:6px;';
  const searchInput = el('input'); searchInput.placeholder = 'Search by name or username…'; searchInput.value = friendSearchQuery;
  searchCard.appendChild(searchInput);
  const resultsWrap = el('div');
  resultsWrap.style.marginTop = '10px';
  searchCard.appendChild(resultsWrap);
  wrap.appendChild(searchCard);

  function renderResults() {
    resultsWrap.innerHTML = '';
    const q = friendSearchQuery.trim().toLowerCase();
    if (!q) return;
    const matches = allOthers.filter(p => p.name.toLowerCase().includes(q) || p.username.toLowerCase().includes(q));
    if (!matches.length) { resultsWrap.appendChild(el('div', 'empty', 'No matching users.')); return; }
    matches.slice(0, 20).forEach(p => {
      const row = el('div', 'pick-row');
      const left = el('div');
      left.appendChild(el('div', 'who', p.name));
      left.appendChild(el('div', 'detail', '@' + p.username));
      row.appendChild(left);
      const isFriend = myFriends.some(f => f.uid === p.uid);
      const pendingOut = allPicks.some(req => req.poolType === 'friendRequest' && req.status === 'pending' && req.fromUid === profile.uid && req.toUid === p.uid);
      const addBtn = el('button', null, isFriend ? '\u2713 Added' : (pendingOut ? 'Requested' : '+ Add'));
      addBtn.disabled = isFriend || pendingOut;
      addBtn.style.cssText = (isFriend || pendingOut)
        ? 'flex:0 0 auto;background:none;border:1px solid #4CAF50;color:#4CAF50;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;'
        : 'flex:0 0 auto;background:var(--accent-dark);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;';
      addBtn.onclick = async () => {
        addBtn.disabled = true; addBtn.textContent = 'Sending…';
        const request = {
          id: profile.name + '_freq_' + p.uid + '_' + Date.now(),
          poolType: 'friendRequest', status: 'pending',
          fromUid: profile.uid, fromName: profile.name, fromUsername: profile.username,
          toUid: p.uid, toName: p.name, toUsername: p.username,
          timestamp: new Date().toISOString()
        };
        allPicks.push(request);
        try {
          await savePicks(allPicks);
          render();
        } catch (e) {
          allPicks.pop();
          addBtn.disabled = false; addBtn.textContent = '+ Add';
          alert("Couldn't send request (" + describeFetchError(e) + ") — try again.");
        }
      };
      row.appendChild(addBtn);
      resultsWrap.appendChild(row);
    });
  }
  searchInput.addEventListener('input', () => { friendSearchQuery = searchInput.value; renderResults(); });
  renderResults();

  if (!myFriends.length) {
    wrap.appendChild(el('div', 'empty', 'No friends added yet — search above to add some.'));
  } else {
    myFriends.forEach(f => {
      const row = el('div', 'pick-row');
      row.style.cursor = 'pointer';
      const left = el('div');
      const nameRow = el('div'); nameRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
      nameRow.appendChild(el('div', 'who', f.name));
      if (threadHasUnread(friendChatId(profile.name, f.name))) {
        const dot = el('span'); dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;';
        nameRow.appendChild(dot);
      }
      left.appendChild(nameRow);
      left.appendChild(el('div', 'detail', '@' + f.username));
      { const bs = balanceSummaryText(profile.name, f.name); if (bs) { const bl = el('div', 'detail'); bl.style.cssText = 'color:var(--accent);margin-top:2px;'; bl.textContent = "You're " + bs; left.appendChild(bl); } }
      row.appendChild(left);
      const rmBtn = el('button', null, '\u2715');
      rmBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:28px;height:28px;font-size:12px;';
      rmBtn.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(`Remove ${f.name} from your friends?`)) return;
        const updated = myFriends.filter(x => x.uid !== f.uid);
        try {
          await saveProfileDoc(profile.uid, { friends: updated });
          saveProfile({ ...profile, friends: updated });
          render();
        } catch (err) { alert("Couldn't remove (" + describeFetchError(err) + ") — try again."); }
      };
      row.onclick = () => { friendProfileView = friendProfileView === f.uid ? null : f.uid; if (friendProfileView === f.uid) markThreadSeen(friendChatId(profile.name, f.name)); render(); };
      row.appendChild(rmBtn);
      wrap.appendChild(row);

      if (friendProfileView === f.uid) {
        const pairKey = h2hTrackerId(profile.name, f.name);
        const tracker = allPicks.find(p => p.poolType === 'h2hTracker' && p.id === pairKey);
        const categoryResetAt = (tracker && tracker.categoryResetAt) || {};

        const h2hCard = el('div'); h2hCard.style.cssText = 'background:var(--surface-2);border-radius:8px;padding:10px;margin-top:8px;';

        const ledger = ledgerEntries(profile.name, f.name);
        [['singles','Singles'],['pools','Pools'],['sides','Sides']].forEach(([catKey, catLabel], i) => {
          const tallies = tallyText(ledger, catKey, categoryResetAt[catKey]);
          const catWrap = el('div'); catWrap.style.cssText = i === 0 ? 'padding-bottom:8px;' : 'margin-top:10px;padding-top:8px;padding-bottom:8px;border-top:1px solid var(--border);';
          const headerRow = el('div'); headerRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;';
          headerRow.appendChild(el('div', null, catLabel)).style.cssText = 'font-size:10.5px;color:var(--text-faint);text-transform:uppercase;font-weight:700;';
          const resetLink = el('span', null, 'Reset');
          resetLink.style.cssText = 'font-size:10.5px;color:var(--text-faint);text-decoration:underline;cursor:pointer;';
          resetLink.onclick = async () => {
            if (!confirm(`Reset the ${catLabel} tally with ${f.name}? This zeroes out the record shown here. Anything you still owe each other stays in "Who owes what" until it's settled.`)) return;
            const idx = allPicks.findIndex(p => p.id === pairKey);
            const nowIso = new Date().toISOString();
            if (idx === -1) {
              const rec = { id: pairKey, poolType: 'h2hTracker', playerA: profile.name, playerB: f.name, categoryResetAt: { [catKey]: nowIso }, timestamp: nowIso };
              allPicks.push(rec);
              try { await savePicks(allPicks); render(); } catch (e) { allPicks.pop(); alert("Couldn't reset (" + describeFetchError(e) + ") — try again."); }
            } else {
              const prev = { ...allPicks[idx] };
              allPicks[idx].categoryResetAt = { ...(allPicks[idx].categoryResetAt || {}), [catKey]: nowIso };
              try { await savePicks(allPicks); render(); } catch (e) { allPicks[idx] = prev; alert("Couldn't reset (" + describeFetchError(e) + ") — try again."); }
            }
          };
          headerRow.appendChild(resetLink);
          catWrap.appendChild(headerRow);
          if (!tallies.length) { const r0 = el('div'); r0.style.cssText = 'font-size:12px;color:var(--text-faint);'; r0.textContent = 'Nothing yet'; catWrap.appendChild(r0); }
          tallies.forEach(t => {
            const row = el('div'); row.style.cssText = 'display:flex;justify-content:space-between;font-size:13px;padding:3px 0;';
            const l = el('span'); l.textContent = (t.amount > 0 ? 'Up ' : 'Down ') + fmtBalanceLine(t.label, t.amount);
            const c = t.amount > 0 ? 'var(--pos)' : 'var(--danger)';
            l.style.cssText = 'font-weight:800;color:' + c + ';';
            row.appendChild(l); catWrap.appendChild(row);
          });
          h2hCard.appendChild(catWrap);
        });
        h2hCard.appendChild(renderLedgerBlock(f));

        h2hCard.appendChild(renderFriendCommentsSection(f));
        wrap.appendChild(h2hCard);
      }
    });
  }

  return wrap;
}

function renderSetup() {
  if (authMode === 'recover') return renderRecoverScreen();
  const wrap = el('div');
  const card = el('div', 'setup-card');
  card.appendChild(el('div', null, authMode === 'login' ? 'Log in' : 'Create account')).style.cssText = 'font-size:16px;font-weight:800;margin-bottom:4px;';

  let nameInput, emailInput;
  if (authMode === 'signup') {
    card.appendChild(el('label', null, 'Your name'));
    nameInput = el('input'); nameInput.placeholder = 'e.g. Jordan';
    card.appendChild(nameInput);
  }

  card.appendChild(el('label', null, 'Username'));
  const userInput = el('input'); userInput.placeholder = 'e.g. jordan99'; userInput.autocapitalize = 'none'; userInput.autocomplete = 'username';
  card.appendChild(userInput);

  if (authMode === 'signup') {
    card.appendChild(el('label', null, 'Email (for password recovery)'));
    emailInput = el('input'); emailInput.type = 'email'; emailInput.placeholder = 'e.g. jordan@email.com'; emailInput.autocomplete = 'email';
    card.appendChild(emailInput);
  }

  card.appendChild(el('label', null, 'Password'));
  const passInput = el('input'); passInput.type = 'password'; passInput.placeholder = authMode === 'signup' ? 'At least 6 characters' : 'Your password'; passInput.autocomplete = authMode === 'signup' ? 'new-password' : 'current-password';
  card.appendChild(passInput);

  const btnRow = el('div', 'btn-row');
  const goBtn = el('button', null, authMode === 'login' ? 'Log in' : 'Create account');
  btnRow.appendChild(goBtn);
  card.appendChild(btnRow);

  if (setupError) card.appendChild(el('div', 'setup-hint', setupError));

  const switchLink = el('div', null, authMode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Log in');

        }

        saveProfile({ name, username, email, uid: auth.localId });

function statusInfo(status, liveDetail) {
  if (status === 'inprogress') return { text: liveDetail || 'Live', live: true };
  if (status === 'closed' || status === 'complete') return { text: 'Final', live: false };
  return { text: 'Upcoming', live: false };
}

// ---------- House Bank: 100 units/week, confidence chips, spread + total bets ----------
function houseWeekStart(d) {
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = (day + 5) % 7; // days since most recent Tuesday
  dt.setDate(dt.getDate() - diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function houseWeekKey(d) { return houseWeekStart(d).toISOString().slice(0,10); }
function weekRangeLabel(wk) {
  return new Date(wk + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function chipsFor(units) {
  return '\ud83d\udd25'.repeat(Math.max(0, Math.min(3, Math.round(units))));
}

function houseDayKey(d) { const dt = new Date(d); dt.setHours(0,0,0,0); return dt.toISOString().slice(0,10); }
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (Math.imul(31, h) + seedStr.charCodeAt(i)) | 0;
  return function() {
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}
let cachedDailyPool = null;
let cachedDailyPoolKey = null;
function dailyOptionPool() {
  const dayKey = houseDayKey(new Date());
  if (cachedDailyPoolKey === dayKey && cachedDailyPool) return cachedDailyPool;
  const rand = seededRandom(dayKey);
  const candidates = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      if (houseDayKey(new Date(g.start)) !== dayKey) return;
      const spreadVal = computeSpread(lg.id, g);
      const totalVal = g.overUnder;
      const availableTypes = [];
      if (spreadVal !== null) availableTypes.push('spread');
      if (totalVal !== null && totalVal !== undefined) availableTypes.push('total');
      if (!availableTypes.length) return;
      candidates.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, availableTypes });
    });
  });
  // Sort by a stable, fetch-order-independent key first — ESPN doesn't guarantee the same game order on every
  // fetch, and without this the same date-based seed could pick a different 5 games depending on fetch timing.
  candidates.sort((a, b) => (a.sport + '_' + a.gameId).localeCompare(b.sport + '_' + b.gameId));
  const pool = candidates.map(c => ({
    sport: c.sport, gameId: c.gameId, gameLabel: c.gameLabel,
    betType: c.availableTypes[Math.floor(rand() * c.availableTypes.length)]
  }));
  cachedDailyPool = pool;
  cachedDailyPoolKey = dayKey;
  return pool;
}
function computeDailySlateLocal(dayKey) {
  const pool = dailyOptionPool();
  if (pool.length < 5) return null;
  const rand = seededRandom(dayKey + '_slate');
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, 5);
}
function legHasLiveOdds(o) {
  const g = (DATA[o.sport] || []).find(x => x.id === o.gameId);
  if (!g) return false;
  if (o.betType === 'total') return g.overUnder !== null && g.overUnder !== undefined;
  if (o.betType === 'spread') return computeSpread(o.sport, g) !== null;
  return true;
}
function dailyBaseSlate() {
  const dayKey = houseDayKey(new Date());
  let slate = null;
  if (dailySlateData && dailySlateData.dayKey === dayKey) {
    slate = dailySlateData.slate;
  } else {
    slate = computeDailySlateLocal(dayKey);
    if (!slate) return null;
  }
  // Self-heal: a leg can end up without live odds if the slate was locked in before that game's odds
  // finished loading. Swap any such leg for a fresh valid candidate not already in the slate.
  const usedIds = new Set(slate.map(o => o.gameId));
  let healed = false;
  const healedSlate = slate.map(o => {
    if (legHasLiveOdds(o)) return o;
    const pool = dailyOptionPool();
    const replacement = pool.find(c => !usedIds.has(c.gameId) && legHasLiveOdds(c));
    if (!replacement) return o; // nothing better available yet — leave as-is
    usedIds.add(replacement.gameId);
    healed = true;
    return replacement;
  });
  dailySlateData = { dayKey, slate: healedSlate };
  if (healed || !slate) {
    fsPatch({ dailySlate: dailySlateData }).catch(() => { /* best-effort; next load will retry if this failed */ });
  }
  return healedSlate;
}
function mulliganFor(name, dayKey) {
  return allPicks.find(p => p.poolType === 'mulligan' && p.player === name && p.dayKey === dayKey);
}
function dailyOptionsForUser(name) {
  const base = dailyBaseSlate();
  if (!base) return null;
  const dayKey = houseDayKey(new Date());
  const mull = mulliganFor(name, dayKey);
  if (!mull) return base;
  const idx = base.findIndex(o => o.gameId === mull.replacedGameId && o.betType === mull.replacedBetType);
  if (idx === -1) return base;
  const copy = base.slice();
  copy[idx] = mull.newOption;
  return copy;
}
function weeklyBetsFor(name, wk) {
  return allPicks.filter(p => p.player === name && p.poolType === 'weekly' && p.weekKey === wk);
}
function weeklyUnitsUsed(name, wk) { return weeklyBetsFor(name, wk).reduce((s,p) => s + p.units, 0); }
function weeklyRemaining(name, wk) { return Math.max(0, HOUSE_BANK_TOTAL - weeklyUnitsUsed(name, wk)); }

function settleWeeklyBet(p) {
  if (p.settledResult) return p.settledResult;
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };
  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else if (p.sideAbbr === 'OVER') outcome = diff > 0 ? 'win' : 'loss';
    else outcome = diff < 0 ? 'win' : 'loss';
  } else {
    const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
    const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
    const margin = (teamScore - oppScore) + p.line;
    outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
  }
  if (outcome === 'push') return { status: 'push' };
  return { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
}
async function persistNewlySettledWeeklyBets() {
  let changed = false;
  allPicks.forEach(p => {
    if (p.poolType !== 'weekly' || p.settledResult) return;
    const r = settleWeeklyBet(p);
    if (r.status !== 'pending') { p.settledResult = r; changed = true; }
  });
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* retry next cycle */ } }
  return changed;
}
function weeklyNetUnits(name, wk) {
  return weeklyBetsFor(name, wk).reduce((s,p) => {
    const r = settleWeeklyBet(p);
    return s + (r.status === 'win' || r.status === 'loss' ? r.profit : 0);
  }, 0);
}
function weeklyAllSettled(name, wk) {
  const bets = weeklyBetsFor(name, wk);
  if (!bets.length) return false;
  return bets.every(p => settleWeeklyBet(p).status !== 'pending');
}
function allWeekKeysFor(name) {
  return [...new Set(allPicks.filter(p => p.player === name && p.poolType === 'weekly').map(p => p.weekKey))].sort();
}
function houseAllTimeLeaderboard() {
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);
  return names.map(n => ({ name: n, total: totalUnitsWon(n) })).sort((a,b) => b.total - a.total);
}
function totalUnitsWon(name) {
  return allWeekKeysFor(name).reduce((s,wk) => weeklyAllSettled(name, wk) ? s + weeklyNetUnits(name, wk) : s, 0);
}
function positiveStreak(name) {
  const weeks = allWeekKeysFor(name).slice().sort().reverse();
  let streak = 0;
  for (const wk of weeks) {
    if (!weeklyAllSettled(name, wk)) continue;
    if (weeklyNetUnits(name, wk) > 0) streak++;
    else break;
  }
  return streak;
}
function weeklyLeaderboard(wk) {
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);
  return names.map(n => ({ name: n, net: weeklyNetUnits(n, wk) })).sort((a,b) => b.net - a.net);
}

    lockBtn.textContent = !hasSide ? 'Pick a side first' : (u > 0 ? `Lock In (${u}u)` : 'Pick a unit amount');
  }
  plusBtn.onclick = () => { if (weeklySelectedUnits[key] < cap) weeklySelectedUnits[key]++; refreshConfidenceUI(); };
  minusBtn.onclick = () => { if (weeklySelectedUnits[key] > 0) weeklySelectedUnits[key]--; refreshConfidenceUI(); };
  refreshConfidenceUI();

  lockBtn.onclick = async () => {
    try {
      const units = weeklySelectedUnits[key];
      const chosenSide = selectedSide[sideKey];
      errEl.textContent = '';
      if (!chosenSide) { errEl.textContent = 'Pick a side first.'; return; }
      if (!units) { errEl.textContent = 'Pick 1, 2, or 3 units.'; return; }
      if (units > remaining + 0.001) { errEl.textContent = `Only ${remaining}u left in your bank this week.`; return; }
      let line;
      if (opt.betType === 'total') {
        line = game.overUnder;
      } else {
        const spreadVal = computeSpread(sport, game);
        line = chosenSide === game.home ? spreadVal : -spreadVal;
      }
      const pick = {
        id: profile.name + '_weekly_' + opt.gameId + '_' + opt.betType + '_' + Date.now(),
        player: profile.name, sport, gameId: opt.gameId,
        gameLabel: game.away + ' @ ' + game.home,
        betType: opt.betType, sideAbbr: chosenSide, line, units,
        weekKey: wk, poolType: 'weekly',
        timestamp: new Date().toISOString()
      };
      lockBtn.disabled = true; lockBtn.textContent = 'Saving…';
      allPicks.push(pick);
      try {
        await savePicks(allPicks);
        if (weeklyRemaining(profile.name, wk) === 0) {
          poolSwipeCart = poolSwipeCart.filter(p => !p.isDailyPool);
          recordPoolSwipeCartRemove('__daily_house_pool__');
        }
      } catch (saveErr) {
        allPicks.pop();
        lockBtn.disabled = false; lockBtn.textContent = `Lock: ${chipsFor(units)}`;
        const msg = describeFetchError(saveErr);
        errEl.textContent = "Couldn't save (" + msg + ") — try again.";
        alert('Save failed: ' + msg);
        return;
      }
      render();
    } catch (outerErr) {
      const msg = (outerErr && outerErr.message) ? outerErr.message : String(outerErr);
      alert('Unexpected error locking this bet: ' + msg);
      lockBtn.disabled = false;
    }
  };
  return card;
}

async function adjustManualRecord(gameId, playerName, delta) {
  const idx = allPicks.findIndex(p => p.id === gameId);
  if (idx === -1) return;
  const prev = { ...(allPicks[idx].manualRecord || {}) };
  const cur = prev[playerName] || 0;
  allPicks[idx].manualRecord = { ...prev, [playerName]: Math.max(0, cur + delta) };
  allPicks[idx].lastUpdated = new Date().toISOString();
  try { await savePicks(allPicks); render(); }
  catch (e) { allPicks[idx].manualRecord = prev; alert("Couldn't save (" + describeFetchError(e) + ") — try again."); }
}
function computeScoreKeeperWinner(game) {
  const players = game.players || [];
  if (game.mode === 'manual') {
    const record = game.manualRecord || {};
    let best = null;
    players.forEach(p => { const c = record[p.name] || 0; if (best === null || c > best.count) best = { name: p.name, count: c }; });
    return best ? best.name : null;
  }
  if (game.mode === 'yahtzee') {
    const scores = game.yahtzeeScores || {};
    let best = null;
    players.forEach(p => { const total = computeYahtzeeCombinedTotal(scores[p.name], game.yahtzeeVariant); if (best === null || total > best.total) best = { name: p.name, total }; });
    return best ? best.name : null;
  }
  const rounds = game.rounds || [];
  const totals = players.map(p => ({ name: p.name, total: rounds.reduce((s, r) => s + (r[p.name] || 0), 0) }));
  if (!totals.length) return null;
  const dir = game.winDirection === 'low' ? -1 : 1;
  return totals.reduce((best, t) => (dir * t.total > dir * best.total ? t : best), totals[0]).name;
}
async function endScoreKeeperGameLegacy(gameId) {
  const idx = allPicks.findIndex(p => p.id === gameId);
  if (idx === -1) return;
  const game = allPicks[idx];
  const winner = computeScoreKeeperWinner(game);
  const players = game.players || [];
  const finalScores = game.mode === 'manual'
    ? Object.fromEntries(players.map(p => [p.name, (game.manualRecord || {})[p.name] || 0]))
    : game.mode === 'yahtzee'
    ? Object.fromEntries(players.map(p => [p.name, computeYahtzeeCombinedTotal((game.yahtzeeScores || {})[p.name], game.yahtzeeVariant)]))
    : Object.fromEntries(players.map(p => [p.name, (game.rounds || []).reduce((s, r) => s + (r[p.name] || 0), 0)]));
  const prev = { status: game.status, winner: game.winner, finalScores: game.finalScores };
  allPicks[idx].status = 'completed';
  allPicks[idx].winner = winner;
  allPicks[idx].finalScores = finalScores;
  allPicks[idx].lastUpdated = new Date().toISOString();
  try { await savePicks(allPicks); render(); }
  catch (e) { Object.assign(allPicks[idx], prev); alert("Couldn't save (" + describeFetchError(e) + ") — try again."); }
}

function myChallengeFor(gameId, betType) {

}
function opponentSideView(ch) {
  const flipped = { ...ch };
  if (ch.propType === 'golf_h2h') {
    flipped.sideAbbr = ch.sideAbbr === ch.playerA ? ch.playerB : ch.playerA;
  } else if (ch.betType === 'total' || ch.propType === 'player') {
    flipped.sideAbbr = ch.sideAbbr === 'OVER' ? 'UNDER' : 'OVER';
  } else {
    let otherTeam = null;
    const idx = gameIndex[ch.gameId];
    if (idx && idx.game) {
      otherTeam = ch.sideAbbr === idx.game.home ? idx.game.away : idx.game.home;
    }
    if (!otherTeam && ch.gameLabel && ch.gameLabel.includes(' @ ')) {
      // gameIndex can be stale or missing this game entirely (e.g. it's aged out of the live fetch window) —
      // fall back to the two team abbreviations already stored on the challenge itself at creation time.
      const parts = ch.gameLabel.split(' @ ');
      const awayAbbr = parts[0], homeAbbr = parts[1];
      if (ch.sideAbbr === awayAbbr) otherTeam = homeAbbr;
      else if (ch.sideAbbr === homeAbbr) otherTeam = awayAbbr;
    }
    if (otherTeam) flipped.sideAbbr = otherTeam;
    if (ch.betType === 'spread' && ch.line !== null && ch.line !== undefined) {
      flipped.line = -ch.line;
      flipped.spreadLabel = ch.spreadLabel === 'PK' ? 'PK' : (ch.line < 0 ? '+' + Math.abs(ch.line) : '-' + Math.abs(ch.line));
    }
  }
  return challengeMarketTxt(flipped);
}
function challengeStatusText(ch) {
  if (ch.status === 'open') return ch.visibility === 'public' ? 'waiting for someone to accept' : `Sent to ${ch.targetFriend} — waiting for them to accept`;
  if (ch.status === 'declined') return `${ch.targetFriend} declined this challenge`;
  if (ch.status === 'accepted') {
    const r = settlePick(ch);
    if (r.status === 'pending') return `Sent to ${ch.acceptedBy} — game not final yet`;
    if (r.status === 'push') return `Sent to ${ch.acceptedBy} — pushed, no units changed hands`;
    const iWon = r.status !== 'win'; // creator holds the opposite side of what they posted

async function deleteChallenge(ch) {
  if (ch.status !== 'open') return; // can only withdraw a challenge before someone accepts it
  if (!confirm('Delete this challenge permanently? Your reserved stake will be refunded.')) return;
  const idx = allPicks.findIndex(p => p.id === ch.id);
  if (idx === -1) return;
  const removed = allPicks.splice(idx, 1)[0];
  const refundTx = {
    id: profile.name + '_accounttx_refund_' + ch.id,
    poolType: 'accountTx', player: profile.name,
    type: 'deposit', amount: ch.units,
    note: `Stake refunded \u2014 ${challengeMarketTxt(ch)}`,
    relatedChallengeId: ch.id,
    timestamp: new Date().toISOString()
  };

}

function generateHouseChallenges(limit) {
  const pool = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      const spreadVal = computeSpread(lg.id, g);
      if (spreadVal !== null) {
        const side = Math.random() < 0.5 ? g.home : g.away;
        const line = side === g.home ? spreadVal : -spreadVal;
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'spread', side, line, spreadLabel: spreadLabelForSide(lg.id, g, side) });
      }
      const totalVal = g.overUnder;
      if (totalVal !== null && totalVal !== undefined) {
        const side = Math.random() < 0.5 ? 'OVER' : 'UNDER';
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'total', side, line: totalVal, spreadLabel: null });
      }
    });
  });
  const existingKeys = new Set(
    allPicks.filter(p => p.poolType === 'challenge' && p.creator === 'House' && p.status === 'open')
      .map(p => p.gameId + '_' + p.betType)
  );
  const fresh = pool.filter(o => !existingKeys.has(o.gameId + '_' + o.betType));
  for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
  const chosen = fresh.slice(0, limit || 100);
  return chosen.map(o => ({
    id: 'house_challenge_' + o.gameId + '_' + o.betType + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    poolType: 'challenge', creator: 'House',
    sport: o.sport, gameId: o.gameId, gameLabel: o.gameLabel,
    betType: o.betType, sideAbbr: o.side, units: 1 + Math.floor(Math.random() * 3), line: o.line, spreadLabel: o.spreadLabel,
    visibility: 'public', targetFriend: null, status: 'open', acceptedBy: null,
    timestamp: new Date().toISOString()
  }));
}
